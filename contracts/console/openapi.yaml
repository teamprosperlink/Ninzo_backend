openapi: 3.1.0
info:
  title: Ninzo console API
  version: 0.1.0
  description: >-
    The API behind the ops console (admin, ops, support and hub_manager; decision 0014). The shared rules
    are in contracts/README.md. Sign-in is an ID and password, then an authenticator code. The server checks
    the role on every call; a missing permission is 403 with missing_permission. A settings, kill-switch or
    flag change, and a refund above the set amount, waits for a second person's approval. Support and live
    ops screens come in v0.10.0.
  contact:
    name: Ninzo backend
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://console-api.example.invalid/v1
  description: Placeholder. Real URLs are published with the mock server.
security:
- bearerAuth: []
tags:
- name: auth
  description: Sign-in, the authenticator and passwords.
- name: users
  description: Console users and roles.
- name: approvals
  description: Changes waiting for a second person.
- name: riders
  description: Rider review.
- name: flags
  description: Feature flags.
- name: zones
  description: Zones, settings and the kill switch.
- name: menu
  description: Menu items and prices.
- name: gates
  description: Gates and their history.
- name: hubs
  description: Hubs and hub staff.
- name: audit
  description: The audit log.
- name: reviews
  description: Late-arrival reviews and support alerts.
paths:
  /auth/login:
    post:
      tags:
      - auth
      operationId: consoleLogin
      summary: Sign in with an ID and password
      description: >-
        Step one. Returns a challenge for the authenticator code, and a session starts after verifyTotp. Until pre-launch the code is optional on staging: a user who has not set up an authenticator gets totp_required false and the session in this reply (session); one who has is still asked for the code. In production the code is always required. A wrong ID or password is invalid_credentials (401). After 5 wrong passwords or codes in 15 minutes the account locks for 15 minutes, and every sign-in then gets the same invalid_credentials; admins see locked_until. Errors also: rate_limited (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/totp/enroll:
    post:
      tags:
      - auth
      operationId: enrollTotp
      summary: Set up the authenticator
      description: >-
        Only when the challenge says totp_enrolled is false: returns the secret once, to add to an authenticator app. Errors: totp_already_enrolled, challenge_expired (both 409).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRef'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /auth/totp/verify:
    post:
      tags:
      - auth
      operationId: verifyTotp
      summary: Finish sign-in with the authenticator code
      description: >-
        Step two. A wrong code also counts toward the account's lockout. Errors: invalid_totp (400), challenge_expired (409), totp_attempts_exceeded (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleSession'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshToken
      summary: Get a new token pair
      description: >-
        Send only one refresh at a time. See Sign-in in contracts/README.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /auth/signout:
    post:
      tags:
      - auth
      operationId: signOut
      summary: Sign out on this device
      description: >-
        Ends this session.
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /me/password:
    post:
      tags:
      - auth
      operationId: changePassword
      summary: Change your password
      description: >-
        Ends every other session. After a temporary password, this is the only call that works besides getConsoleUser, refreshToken and signOut; every other call is 403 password_change_required. Errors: invalid_credentials (401) for a wrong current password; weak_password (400).
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/me:
    get:
      tags:
      - users
      operationId: getConsoleUser
      summary: Get the signed-in console user
      description: >-
        The user, their role and their permissions; the console builds its menus from them. The server checks the permission on every call.
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/users:
    get:
      tags:
      - users
      operationId: listConsoleUsers
      summary: List console users
      description: >-
        Admin only. Permission: users.manage.
      x-permission: users.manage
      parameters:
      - name: cursor
        in: query
        required: false
        description: From next_cursor.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        description: 1 to 100. 50 by default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
    post:
      tags:
      - users
      operationId: createConsoleUser
      summary: Add a console user
      description: >-
        Admin only. Returns a temporary password once; the user changes it and sets up the authenticator at first sign-in. A hub_manager needs hub_id. Errors: login_id_taken (409). Permission: users.manage.
      x-permission: users.manage
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleUserCreate'
      responses:
        '201':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserCreated'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/users/{user_id}:
    patch:
      tags:
      - users
      operationId: updateConsoleUser
      summary: Change a user's role, hub or access
      description: >-
        Admin only, with a reason. Deactivating ends the user's sessions. An admin cannot deactivate or demote themselves. Errors: last_admin (409). Permission: users.manage.
      x-permission: users.manage
      parameters:
      - name: user_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleUserUpdate'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/users/{user_id}/reset:
    post:
      tags:
      - users
      operationId: resetConsoleUser
      summary: Reset a user's password and authenticator
      description: >-
        Admin only, with a reason. Returns a new temporary password once and ends the user's sessions. Permission: users.manage.
      x-permission: users.manage
      parameters:
      - name: user_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleUserCreated'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/approvals:
    get:
      tags:
      - approvals
      operationId: listApprovals
      summary: List approvals
      description: >-
        Pending first. A second person approves a settings change, a kill-switch change, a flag change and a refund above the set amount (decision 0014). Permission: approvals.read.
      x-permission: approvals.read
      parameters:
      - name: status
        in: query
        required: false
        description: Only this status.
        schema:
          type: string
          enum: [pending, approved, rejected, failed, cancelled, lapsed, open, arrived_in_time, late, timed_out]
      - name: cursor
        in: query
        required: false
        description: From next_cursor.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        description: 1 to 100. 50 by default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/approvals/{approval_id}/approve:
    post:
      tags:
      - approvals
      operationId: approveChange
      summary: Approve a change
      description: >-
        Applies it. The person who asked cannot approve their own change. A kind of change not built yet is not_allowed (409). If the change no longer applies (the settings moved past its base version, or a zone would become invalid), the approval becomes failed with failure_code and nothing changes. Errors: own_change, not_pending (both 409). Permission: approvals.decide.
      x-permission: approvals.decide
      parameters:
      - name: approval_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/approvals/{approval_id}/reject:
    post:
      tags:
      - approvals
      operationId: rejectChange
      summary: Reject a change
      description: >-
        With a reason. Errors: not_pending (409). Permission: approvals.decide.
      x-permission: approvals.decide
      parameters:
      - name: approval_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/approvals/{approval_id}/cancel:
    post:
      tags:
      - approvals
      operationId: cancelChange
      summary: Cancel your own pending change
      description: >-
        Only the person who asked. A pending approval also lapses after 24 hours. Errors: not_pending (409). Permission: approvals.read.
      x-permission: approvals.read
      parameters:
      - name: approval_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/riders/review:
    get:
      tags:
      - riders
      operationId: listRiderReviews
      summary: List riders waiting for a decision
      description: >-
        Applicants, and active riders whose latest verification failed or expired (including a verification past its expiry), oldest first. Suspended riders are not listed. Admin and ops. Permission: riders.review.
      x-permission: riders.review
      parameters:
      - name: cursor
        in: query
        required: false
        description: From next_cursor.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        description: 1 to 100. 50 by default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderReviewList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/riders/{rider_id}/decision:
    post:
      tags:
      - riders
      operationId: decideRider
      summary: Approve, suspend or reinstate a rider
      description: >-
        With a reason. Approving needs zone_id and a verified rider. Suspending (also how an applicant is turned down) ends the rider's sessions and their shift. A rider carrying an order they accepted cannot be suspended until it is handed over. The zone must be active. Errors: not_verified, not_allowed, order_in_progress (all 409). Permission: riders.review.
      x-permission: riders.review
      parameters:
      - name: rider_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderDecision'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderReviewResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/flags:
    get:
      tags:
      - flags
      operationId: listFlags
      summary: List feature flags
      description: >-
        Admin. Permission: flags.manage.
      x-permission: flags.manage
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagList'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/flags/{flag_key}:
    put:
      tags:
      - flags
      operationId: requestFlagChange
      summary: Ask to change a feature flag
      description: >-
        Creates an approval; a second admin applies it. Errors: approval_pending (409) if one is already waiting. Permission: flags.manage.
      x-permission: flags.manage
      parameters:
      - name: flag_key
        in: path
        required: true
        description: The flag.
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,60}$
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagChange'
      responses:
        '202':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
