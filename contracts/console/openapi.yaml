      summary: Refund an order
      description: >-
        Up to the amount paid less refunds already made. The limit is cumulative per order: the refunds already made from the console on this order, plus any refund approval still waiting, plus this one. If that total is at or below the setting refund_approval_paise (20000 paise, Rs 200, to start) the refund is made at once (200, the refund); if it is above, an approval of kind refund is created (202) and the refund is made when a second admin approves it. An approved refund is applied only if it still fits: otherwise the approval fails with failure_code refund_too_large or not_paid. Errors (all 409): refund_too_large (more than is left to refund; a fully refunded order answers this, not not_paid), not_paid, approval_pending (a refund approval already waits for this order). Permission: refunds.request.
