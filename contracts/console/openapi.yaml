        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/arrival-reviews:
    get:
      tags:
      - reviews
      operationId: listArrivalReviews
      summary: List late-arrival reviews
      description: >-
        Open ones first, with how long is left. Ops and support. Permission: reviews.read.
      x-permission: reviews.read
      parameters:
      - name: status
        in: query
        required: false
        description: Only this status.
        schema:
          type: string
          enum: [open, arrived_in_time, late, timed_out]
      - name: cursor
        in: query
        required: false
        description: From next_cursor.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        description: 1 to 100. 50 by default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalReviewList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/arrival-reviews/{review_id}/decision:
    post:
      tags:
      - reviews
      operationId: decideArrivalReview
      summary: Decide a late-arrival review
      description: >-
        arrived_in_time stops the timer at the rider's evidence and takes back a credit still owed; late keeps the miss and its credit. Errors: review_closed, credit_applied (both 409; credit_applied when the credit was already given). Permission: reviews.decide.
      x-permission: reviews.decide
      parameters:
      - name: review_id
        in: path
        required: true
        description: The id.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrivalDecision'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalReviewResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /admin/support-alerts:
    get:
      tags:
      - reviews
      operationId: listSupportAlerts
      summary: List queued support alerts
      description: >-
        Alerts the system raised for a person to look at, such as a refused handover. Newest first. Permission: alerts.read.
      x-permission: alerts.read
      parameters:
      - name: cursor
        in: query
        required: false
        description: From next_cursor.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        required: false
        description: 1 to 100. 50 by default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAlertList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from the sign-in endpoints.
  schemas:
    Done:
      type: object
      required: [server_time]
      properties:
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Permission:
      type: string
      description: >-
        What a call needs; each role's list is in decision 0015. admin has every one; ops has
        approvals.read, riders.review, zones.read, settings.read, settings.request, zones.kill_switch,
        menu.manage, gates.read, gates.manage, hubs.read, hubs.manage, hub_staff.manage, reviews.read,
        reviews.decide, alerts.read; support has zones.read, gates.read, reviews.read, reviews.decide,
        alerts.read; hub_manager has hubs.read and hub_staff.manage for their own hub.
      enum: [users.manage, approvals.read, approvals.decide, riders.review, flags.manage, zones.read, settings.read,
        settings.request, zones.kill_switch, menu.manage, gates.read, gates.manage, hubs.read, hubs.manage,
        hub_staff.manage, audit.read, reviews.read, reviews.decide, alerts.read]
    Role:
      type: string
      description: admin runs users, settings and approvals; ops runs zones, hubs, riders and reviews; support handles customers and reviews; hub_manager runs one hub.
      enum: [admin, ops, support, hub_manager]
    LoginRequest:
      type: object
      required: [login_id, password]
      properties:
        login_id:
          type: string
          minLength: 3
          maxLength: 254
          description: The user's email address (or an older login ID). Not case sensitive.
        password:
          type: string
          minLength: 1
          maxLength: 200
    LoginChallenge:
      type: object
      required: [challenge_id, totp_enrolled, totp_required, must_change_password, expires_in_s, session, server_time]
      properties:
        challenge_id:
          type: string
          description: For enrollTotp and verifyTotp. Still given when totp_required is false, so a user can set up an authenticator.
        totp_enrolled:
          type: boolean
          description: False at first sign-in. Then call enrollTotp before verifyTotp.
        totp_required:
          type: boolean
          description: False when the password alone signed in (only before pre-launch, for a user with no authenticator); session then holds the session.
        session:
          description: The session when totp_required is false; otherwise null.
          oneOf:
          - $ref: '#/components/schemas/ConsoleSession'
          - type: 'null'
        must_change_password:
          type: boolean
          description: True with a temporary password. Change it with changePassword once signed in; until then only that call works.
        expires_in_s:
          type: integer
          minimum: 1
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ChallengeRef:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          maxLength: 200
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri, server_time]
      properties:
        secret:
          type: string
          description: Base32. Shown once.
        otpauth_uri:
          type: string
          description: For a QR code in the console.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    TotpCode:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          maxLength: 200
        code:
          type: string
          pattern: ^[0-9]{6}$
    ConsoleSession:
      type: object
      required: [access_token, refresh_token, expires_in_s, user_id, role, must_change_password, server_time]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_s:
          type: integer
          minimum: 1
        user_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        role:
          $ref: '#/components/schemas/Role'
        must_change_password:
          type: boolean
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in_s, server_time]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_s:
          type: integer
          minimum: 1
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 200
        new_password:
          type: string
          minLength: 12
          maxLength: 200
          description: At least 12 characters.
          example: a-new-long-password
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    ConsoleUser:
      type: object
      required: [id, login_id, name, role, hub_id, active, totp_enrolled, locked_until, created_at]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        login_id:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        hub_id:
          type: ['string', 'null']
          description: A hub_manager's hub.
        active:
          type: boolean
        totp_enrolled:
          type: boolean
        locked_until:
          type: ['string', 'null']
          format: date-time
          description: Set while sign-in is locked after repeated failures; a reset clears it.
        created_at:
          type: string
          format: date-time
    ConsoleUserResponse:
      type: object
      required: [user, permissions, server_time]
      properties:
        user:
          $ref: '#/components/schemas/ConsoleUser'
        permissions:
          type: array
          description: What this user's role may do.
          items:
            $ref: '#/components/schemas/Permission'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ConsoleUserList:
      type: object
      required: [users, next_cursor, server_time]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleUser'
        next_cursor:
          type: ['string', 'null']
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ConsoleUserCreate:
      type: object
      required: [login_id, name, role]
      properties:
        login_id:
          type: string
          maxLength: 254
          pattern: ^([a-z0-9._-]{3,80}|[a-z0-9._%+-]{1,64}@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,63})$
          description: The user's email address, lower case. The older ID form is still accepted.
        name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          $ref: '#/components/schemas/Role'
        hub_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
    ConsoleUserCreated:
      type: object
      required: [user, temporary_password, server_time]
      properties:
        user:
          $ref: '#/components/schemas/ConsoleUser'
        temporary_password:
          type: string
          description: Shown once. Give it to the user privately.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ConsoleUserUpdate:
      type: object
      required: [reason]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        hub_id:
          oneOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
          description: Null takes a user off a hub.
        active:
          type: boolean
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Actor:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
    SettingDiff:
      type: object
      required: [key, before, after]
      properties:
        key:
          type: string
        before:
          type: ['integer', 'null']
        after:
          type: ['integer', 'null']
    SettingsApprovalChange:
      type: object
      required: [kind, zone_id, base_version, diffs]
      properties:
        kind:
          type: string
          const: settings
        zone_id:
          type: ['string', 'null']
          description: Null for the global settings.
        base_version:
          type: integer
          minimum: 0
        diffs:
          type: array
          items:
            $ref: '#/components/schemas/SettingDiff'
    KillSwitchApprovalChange:
      type: object
      required: [kind, zone_id, offer_enabled_before, offer_enabled_after]
      properties:
        kind:
          type: string
          const: kill_switch
        zone_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        offer_enabled_before:
          type: boolean
        offer_enabled_after:
          type: boolean
    FlagApprovalChange:
      type: object
      required: [kind, key, enabled_before, enabled_after]
      properties:
        kind:
          type: string
          const: flag
        key:
          type: string
        enabled_before:
          type: boolean
        enabled_after:
          type: boolean
    RefundApprovalChange:
      type: object
      required: [kind, order_id, amount]
      properties:
        kind:
          type: string
          const: refund
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
    Approval:
      type: object
      required: [id, kind, status, summary, change, requested_by, requested_at, request_reason, decided_by, decided_at, decision_reason, failure_code, expires_at]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        kind:
          type: string
          enum: [settings, kill_switch, flag, refund]
        status:
          type: string
          enum: [pending, approved, rejected, failed, cancelled, lapsed]
        summary:
          type: string
          description: What would change, in words.
        change:
          oneOf:
          - $ref: '#/components/schemas/SettingsApprovalChange'
          - $ref: '#/components/schemas/KillSwitchApprovalChange'
          - $ref: '#/components/schemas/FlagApprovalChange'
          - $ref: '#/components/schemas/RefundApprovalChange'
          discriminator:
            propertyName: kind
            mapping:
              settings: '#/components/schemas/SettingsApprovalChange'
              kill_switch: '#/components/schemas/KillSwitchApprovalChange'
              flag: '#/components/schemas/FlagApprovalChange'
              refund: '#/components/schemas/RefundApprovalChange'
        requested_by:
          $ref: '#/components/schemas/Actor'
        requested_at:
          type: string
          format: date-time
        request_reason:
          type: string
        decided_by:
          oneOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
        decided_at:
          type: ['string', 'null']
          format: date-time
        decision_reason:
          type: ['string', 'null']
          description: Why it was rejected or cancelled.
        failure_code:
          type: ['string', 'null']
          description: Why an approved change could not be applied, such as stale_version or invalid_setting.
        expires_at:
          type: string
          format: date-time
          description: A pending approval lapses then.
    ApprovalResponse:
      type: object
      required: [approval, server_time]
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ApprovalList:
      type: object
      required: [approvals, next_cursor, server_time]
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        next_cursor:
          type: ['string', 'null']
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderReview:
      type: object
      required: [rider_id, name, phone_last4, status, verification, zone_id, applied_at]
      properties:
        rider_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: ['string', 'null']
        phone_last4:
          type: string
          description: The last four digits only.
        status:
          type: string
          enum: [applicant, active, suspended]
        verification:
          type: string
          enum: [none, pending, verified, failed, expired]
        zone_id:
          type: ['string', 'null']
        applied_at:
          type: string
          format: date-time
    RiderReviewList:
      type: object
      required: [riders, next_cursor, server_time]
      properties:
        riders:
          type: array
          items:
            $ref: '#/components/schemas/RiderReview'
        next_cursor:
          type: ['string', 'null']
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderReviewResponse:
      type: object
      required: [rider, server_time]
      properties:
        rider:
          $ref: '#/components/schemas/RiderReview'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderDecision:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, suspend, reinstate]
        zone_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Flag:
      type: object
      required: [key, enabled, description, updated_at]
      properties:
        key:
          type: string
        enabled:
          type: boolean
        description:
          type: string
        updated_at:
          type: string
          format: date-time
    FlagList:
      type: object
      required: [flags, server_time]
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    FlagChange:
      type: object
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Zone:
      type: object
      required: [id, name, city, offer_enabled, is_test]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        city:
          type: string
        offer_enabled:
          type: boolean
          description: The kill switch, true while the zone is active. False (paused) stops new orders in the zone.
        is_test:
          type: boolean
    ZoneList:
      type: object
      required: [zones, server_time]
      properties:
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Setting:
      type: object
      required: [key, unit, min, max, value, effective, required, description]
      properties:
        key:
          type: string
        unit:
          type: string
        min:
          type: integer
        max:
          type: integer
        value:
          type: ['integer', 'null']
          description: This level's own value; null means it follows the global one.
        effective:
          type: ['integer', 'null']
        required:
          type: boolean
        description:
          type: string
    SettingsView:
      type: object
      required: [zone_id, global_version, zone_version, settings, server_time]
      properties:
        zone_id:
          type: ['string', 'null']
          description: Null for the global settings.
        global_version:
          type: integer
          minimum: 0
        zone_version:
          type: ['integer', 'null']
          description: The zone's own version; null for the global settings, 0 for a zone with none yet.
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    SettingsChange:
      type: object
      required: [changes, base_version, reason]
      properties:
        base_version:
          type: integer
          minimum: 0
          description: The version you read (global_version, or zone_version for a zone).
        changes:
          type: object
          minProperties: 1
          maxProperties: 50
          additionalProperties:
            type: ['integer', 'null']
          description: Setting key to its new value; null goes back to the global value.
          example:
            timer_length_s: 120
        reason:
          type: string
          minLength: 3
          maxLength: 500
    KillSwitch:
      type: object
      required: [offer_enabled, reason]
      properties:
        offer_enabled:
          type: boolean
        reason:
          type: string
          minLength: 3
          maxLength: 500
    AdminMenuItem:
      type: object
      required: [id, name, description, price, status, sort_order, allergens, photo_url, updated_at]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        description:
          type: ['string', 'null']
        price:
          $ref: ../shared/common.yaml#/components/schemas/Money
        status:
          type: string
          enum: [active, hidden]
        sort_order:
          type: integer
        allergens:
          type: array
          items:
            type: string
        photo_url:
          type: ['string', 'null']
        updated_at:
          type: string
          format: date-time
    AdminMenuList:
      type: object
      required: [items, server_time]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminMenuItem'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    AdminMenuItemResponse:
      type: object
      required: [item, server_time]
      properties:
        item:
          $ref: '#/components/schemas/AdminMenuItem'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    MenuItemCreate:
      type: object
      required: [name, price_paise]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Kept in the price history as why the first price was set.
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        price_paise:
          type: integer
          minimum: 100
          maximum: 1000000
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
        allergens:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 40
        photo_url:
          type: string
          pattern: ^https://
          maxLength: 1000
    MenuItemUpdate:
      type: object
      required: [reason]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: ['string', 'null']
          maxLength: 500
        price_paise:
          type: integer
          minimum: 100
          maximum: 1000000
        status:
          type: string
          enum: [active, hidden]
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
        allergens:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 40
        photo_url:
          type: ['string', 'null']
          pattern: ^https://
          maxLength: 1000
        reason:
          type: string
          minLength: 3
          maxLength: 500
    AdminGate:
      type: object
      required: [id, zone_id, label, lat, lng, entry_notes, verified, version, updated_at]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        zone_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        label:
          type: string
        lat:
          type: number
        lng:
          type: number
        entry_notes:
          type: ['string', 'null']
        verified:
          type: boolean
        version:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
    AdminGateList:
      type: object
      required: [gates, next_cursor, server_time]
      properties:
        gates:
          type: array
          items:
            $ref: '#/components/schemas/AdminGate'
        next_cursor:
          type: ['string', 'null']
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    AdminGateResponse:
      type: object
      required: [gate, server_time]
      properties:
        gate:
          $ref: '#/components/schemas/AdminGate'
        server_time:
