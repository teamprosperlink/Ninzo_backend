        notes:
          type: array
          items:
            $ref: '#/components/schemas/IncidentNoteEntry'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    IncidentAssign:
      type: object
      required: [user_id]
      properties:
        user_id:
          oneOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
          description: A console user, or null to take the assignment away.
    IncidentNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    RestockQueueCounts:
      type: object
      required: [confirmed, hub_accepted, packing, partial, ready, picked_up]
      properties:
        confirmed:
          type: integer
          minimum: 0
        hub_accepted:
          type: integer
          minimum: 0
        packing:
          type: integer
          minimum: 0
        partial:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        picked_up:
          type: integer
          minimum: 0
    HubOps:
      type: object
      required: [hub, queue, stuck, open_shortfalls, quarantined_lots, active_staff]
      properties:
        hub:
          $ref: '#/components/schemas/AdminHub'
        queue:
          $ref: '#/components/schemas/RestockQueueCounts'
        stuck:
          type: integer
          minimum: 0
          description: Requests in confirmed, hub_accepted or packing waiting longer than restock_stuck_s.
        open_shortfalls:
          type: integer
          minimum: 0
        quarantined_lots:
          type: integer
          minimum: 0
        active_staff:
          type: integer
          minimum: 0
    HubOpsList:
      type: object
      required: [hubs, server_time]
      properties:
        hubs:
          type: array
          items:
            $ref: '#/components/schemas/HubOps'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    AdminRestock:
      type: object
      required: [id, hub_id, rider, state, waiting_s, requested_at, ended_reason]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        hub_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        rider:
          $ref: '#/components/schemas/Actor'
        state:
          type: string
          enum: [confirmed, hub_accepted, packing, partial, ready, picked_up, expired]
        waiting_s:
          type: integer
          minimum: 0
          description: How long it has waited in its state.
        requested_at:
          type: string
          format: date-time
        ended_reason:
          type: ['string', 'null']
    RestockList:
      type: object
      required: [requests, next_cursor, server_time]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AdminRestock'
        next_cursor:
          type: ['string', 'null']
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockResponse:
      type: object
      required: [restock, server_time]
      properties:
        restock:
          $ref: '#/components/schemas/AdminRestock'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    LiveRider:
      type: object
      required: [id, name, lat, lng, last_ping_at, state]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        last_ping_at:
          type: ['string', 'null']
          format: date-time
        state:
          type: string
          enum: [idle, offered, on_order, moving, on_break]
    LiveScooter:
      type: object
      required: [id, plate, node_id, rider_id, stock_units]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        plate:
          type: string
        node_id:
          type: ['string', 'null']
        rider_id:
          type: ['string', 'null']
        stock_units:
          type: integer
          minimum: 0
    LiveGate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
    LiveOrder:
      type: object
      required: [id, order_number, state, gate, rider_id, timer_started_at]
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        order_number:
          type: string
        state:
          $ref: ../shared/common.yaml#/components/schemas/OrderState
        gate:
          $ref: '#/components/schemas/LiveGate'
        rider_id:
          type: ['string', 'null']
        timer_started_at:
          type: ['string', 'null']
          format: date-time
    LiveZone:
      type: object
      required: [riders, scooters, orders, incidents_open, server_time]
      properties:
        riders:
          type: array
          items:
            $ref: '#/components/schemas/LiveRider'
        scooters:
          type: array
          items:
            $ref: '#/components/schemas/LiveScooter'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/LiveOrder'
        incidents_open:
          type: integer
          minimum: 0
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
