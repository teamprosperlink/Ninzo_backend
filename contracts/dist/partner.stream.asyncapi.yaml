# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
asyncapi: 2.6.0
channels:
    /v1/hub/stream:
        description: The signed-in staff member's hub. Every device at the hub sees the same events.
        publish:
            description: The first frame must be auth, within 5 seconds. Send it again with a new token before the current one expires.
            message:
                $ref: '#/components/messages/Auth'
            operationId: sendHubStreamFrame
            summary: Frames the app sends
            tags:
                - name: hub
        subscribe:
            description: 'One poll can send several frames with the same hub seq, one per changed request. Apply each frame by its request''s own seq (data.seq): drop it only if that is not newer than what you show for that request. Use the hub seq, here and on heartbeats, to know when to fetch the queue.'
            message:
                oneOf:
                    - $ref: '#/components/messages/AuthOk'
                    - $ref: '#/components/messages/Heartbeat'
                    - $ref: '#/components/messages/RequestNew'
                    - $ref: '#/components/messages/RequestChanged'
            operationId: receiveHubStreamEvent
            summary: Events the app receives
            tags:
                - name: hub
components:
    messages:
        Auth:
            name: auth
            payload:
                properties:
                    token:
                        type: string
                    type:
                        const: auth
                        type: string
                required:
                    - type
                    - token
                type: object
            summary: Sends a current access token.
            title: Sign in to the channel
        AuthOk:
            name: auth_ok
            payload:
                properties:
                    data:
                        type: object
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: auth_ok
                        type: string
                required:
                    - type
                    - server_time
                    - data
                type: object
            summary: The first event. Fetch the queue next if the app has not already.
            title: Signed in
        Heartbeat:
            name: heartbeat
            payload:
                properties:
                    data:
                        type: object
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: heartbeat
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: Sent every 15 seconds with the hub's current seq. If it is higher than the app has, fetch the queue.
            title: Heartbeat
        RequestChanged:
            name: request_changed
            payload:
                properties:
                    data:
                        $ref: '#/components/schemas/HubRequest'
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: request_changed
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: 'A request changed: accepted by someone, a scan, a shortfall or the rider''s answer to it, ready, picked up, the rider''s arrival time, or withdrawn by the rider.'
            title: Request changed
        RequestNew:
            name: request_new
            payload:
                properties:
                    data:
                        $ref: '#/components/schemas/HubRequest'
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: request_new
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: A rider confirmed a restock at this hub.
            title: New request
    schemas:
        HubLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                picked_qty:
                    description: Units in the lots scanned so far. Lots are whole, so this can pass qty.
                    minimum: 0
                    type: integer
                qty:
                    description: Units the rider asked for.
                    minimum: 1
                    type: integer
            required:
                - item_id
                - name
                - qty
                - picked_qty
            type: object
        HubRef:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
            required:
                - id
                - name
            type: object
        HubRequest:
            properties:
                accepted_by:
                    description: The staff member who accepted it, by name.
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/HubLine'
                    type: array
                lot_numbers:
                    description: The lots in the cassette so far.
                    items:
                        type: string
                    type: array
                rider_arrival_at:
                    description: When the rider is expected. It can change; the live channel sends it.
                    format: date-time
                    type:
                        - string
                        - "null"
                scooter_code:
                    description: The scooter the cassette goes to. No rider contact details are shown.
                    type: string
                seq:
                    description: Raised by every change; drop a live event older than what you show.
                    minimum: 1
                    type: integer
                shortfall:
                    oneOf:
                        - $ref: '#/components/schemas/HubShortfall'
                        - type: "null"
                slot_at:
                    description: When the cassette should be ready. Set on accept.
                    format: date-time
                    type:
                        - string
                        - "null"
                state:
                    $ref: '#/components/schemas/HubRequestState'
            required:
                - id
                - state
                - seq
                - scooter_code
                - items
                - lot_numbers
                - slot_at
                - rider_arrival_at
                - accepted_by
                - shortfall
                - created_at
            type: object
        HubRequestState:
            description: confirmed is new to the hub. hub_accepted is accepted, packing has a lot scanned, ready and partial are sealed, picked_up and received mean the rider took it. closed, expired and cancelled are ended.
            enum:
                - confirmed
                - hub_accepted
                - packing
                - ready
                - partial
                - picked_up
                - received
                - closed
                - expired
                - cancelled
            type: string
        HubShortfall:
            properties:
                action:
                    enum:
                        - partial
                        - substitute
                        - other_hub
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/ShortLine'
                    minItems: 1
                    type: array
                other_hub:
                    oneOf:
                        - $ref: '#/components/schemas/HubRef'
                        - type: "null"
                status:
                    description: The rider's answer. The rider sees and answers it once the cassette is sealed (partial).
                    enum:
                        - open
                        - accepted
                        - refused
                    type: string
                substitute_item_id:
                    oneOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
            required:
                - action
                - lines
                - substitute_item_id
                - other_hub
                - status
            type: object
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        ShortLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                qty_missing:
                    maximum: 500
                    minimum: 1
                    type: integer
            required:
                - item_id
                - qty_missing
            type: object
defaultContentType: application/json
id: urn:ninzo:partner:stream
info:
    contact:
        name: Ninzo backend
    description: 'The live channel for one hub: new and changed restock requests. Sign-in, seq, heartbeat and close code rules are in contracts/README.md. seq here is the hub''s: it rises with every change to any of the hub''s requests. GET /v1/hub/restock stays the authority. The token must be renewed on the same connection, because this channel stays open through a shift.'
    license:
        name: Apache-2.0
    title: Ninzo hub stream
    version: 0.1.0
servers:
    placeholder:
        description: Placeholder. Real URLs are published with the mock server.
        protocol: wss
        url: partner-api.example.invalid
tags:
    - description: Following a hub's restock queue live.
      name: hub
