# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
components:
    headers:
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                minimum: 0
                type: integer
    parameters:
        IdempotencyKey:
            description: Unique per intended action. Send the same key when retrying. Kept for 24 hours, per signed-in user, method and exact path.
            example: 7f3c1e9a-2b4d-4c8e-9a10-5d6e7f8a9b0c
            in: header
            name: Idempotency-Key
            required: true
            schema:
                maxLength: 128
                minLength: 8
                pattern: ^[A-Za-z0-9_-]+$
                type: string
        RequestId:
            description: The restock request.
            in: path
            name: request_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The request is invalid, or a required Idempotency-Key is missing.
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The action no longer fits the current state, or the same Idempotency-Key is still being processed. In that second case, retryable is true and Retry-After is set.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The caller lacks a permission, named in missing_permission.
        IdempotencyKeyReused:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: This Idempotency-Key was already used with a different request body.
        InternalError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: An unexpected server error.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The resource does not exist, or the caller cannot see it.
        ServiceUnavailable:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: A dependency is down. Retry later.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        TooManyRequests:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Rate limited.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The token is missing, invalid or expired.
    schemas:
        Done:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - server_time
            type: object
        Error:
            description: The one error shape, used by every endpoint.
            properties:
                code:
                    description: 'Stable code for app logic. This is an open list: contracts add codes for their own endpoints. If a client does not know a code, it follows retryable. Shared codes are listed in contracts/README.md.'
                    example: token_expired
                    type: string
                message:
                    description: For developers and logs. App wording comes from the copy deck.
                    example: The access token has expired.
                    type: string
                missing_permission:
                    description: Only on 403. The permission the caller lacks.
                    example: orders.read
                    type: string
                retryable:
                    description: True if the same request may succeed later without changes.
                    example: false
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                sign_in_method:
                    description: Only on sign_in_method_mismatch. How this account signs in.
                    example: google
                    type: string
            required:
                - code
                - message
                - retryable
                - server_time
            type: object
        EventBatchResult:
            properties:
                accepted_ids:
                    items:
                        type: string
                    type: array
                rejected:
                    items:
                        $ref: '#/components/schemas/RejectedEvent'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - accepted_ids
                - rejected
                - server_time
            type: object
        EventId:
            description: Unique, and created when the event is queued.
            maxLength: 128
            minLength: 8
            pattern: ^[A-Za-z0-9_-]+$
            type: string
        HubAcceptEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    $ref: '#/components/schemas/EventId'
                payload:
                    $ref: '#/components/schemas/HubRequestPayload'
                type:
                    const: accept
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HubEvent:
            description: One queued action. Each takes the same fields as its endpoint, plus the request or lot it acts on.
            discriminator:
                mapping:
                    accept: '#/components/schemas/HubAcceptEvent'
                    quarantine: '#/components/schemas/HubQuarantineEvent'
                    ready: '#/components/schemas/HubReadyEvent'
                    scan: '#/components/schemas/HubScanEvent'
                    shortfall: '#/components/schemas/HubShortfallEvent'
                    unscan: '#/components/schemas/HubUnscanEvent'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/HubAcceptEvent'
                - $ref: '#/components/schemas/HubScanEvent'
                - $ref: '#/components/schemas/HubUnscanEvent'
                - $ref: '#/components/schemas/HubShortfallEvent'
                - $ref: '#/components/schemas/HubReadyEvent'
                - $ref: '#/components/schemas/HubQuarantineEvent'
        HubLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                picked_qty:
                    description: Units in the lots scanned so far. Lots are whole, so this can pass qty.
                    minimum: 0
                    type: integer
                qty:
                    description: Units the rider asked for.
                    minimum: 1
                    type: integer
            required:
                - item_id
                - name
                - qty
                - picked_qty
            type: object
        HubLot:
            properties:
                expires_at:
                    format: date-time
                    type: string
                in_cassette:
                    description: True while the lot is packed in a cassette that is not yet collected.
                    type: boolean
                item_id:
                    $ref: '#/components/schemas/Id'
                lot_code:
                    type: string
                lot_id:
                    $ref: '#/components/schemas/Id'
                qty:
                    minimum: 0
                    type: integer
                status:
                    enum:
                        - ok
                        - quarantined
                        - expired
                    type: string
                temp_status:
                    $ref: '#/components/schemas/TempStatus'
            required:
                - lot_id
                - lot_code
                - item_id
                - qty
                - expires_at
                - temp_status
                - status
                - in_cassette
            type: object
        HubLotList:
            properties:
                lots:
                    items:
                        $ref: '#/components/schemas/HubLot'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - lots
                - server_time
            type: object
        HubLotResponse:
            properties:
                lot:
                    $ref: '#/components/schemas/HubLot'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - lot
                - server_time
            type: object
        HubQuarantineEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    $ref: '#/components/schemas/EventId'
                payload:
                    $ref: '#/components/schemas/HubQuarantinePayload'
                type:
                    const: quarantine
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HubQuarantinePayload:
            properties:
                lot_id:
                    $ref: '#/components/schemas/Id'
                note:
                    maxLength: 500
                    type: string
                reason:
                    enum:
                        - temperature
                        - damaged
                        - expired
                        - contamination
                        - other
                    type: string
            required:
                - lot_id
                - reason
            type: object
        HubReadyEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    $ref: '#/components/schemas/EventId'
                payload:
                    $ref: '#/components/schemas/HubReadyPayload'
                type:
                    const: ready
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HubReadyPayload:
            properties:
                lot_numbers:
                    items:
                        maxLength: 64
                        minLength: 1
                        type: string
                    maxItems: 100
                    type: array
                request_id:
                    $ref: '#/components/schemas/Id'
            required:
                - request_id
                - lot_numbers
            type: object
        HubRef:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
            required:
                - id
                - name
            type: object
        HubRequest:
            properties:
                accepted_by:
                    description: The staff member who accepted it, by name.
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/HubLine'
                    type: array
                lot_numbers:
                    description: The lots in the cassette so far.
                    items:
                        type: string
                    type: array
                rider_arrival_at:
                    description: When the rider is expected. It can change; the live channel sends it.
                    format: date-time
                    type:
                        - string
                        - "null"
                scooter_code:
                    description: The scooter the cassette goes to. No rider contact details are shown.
                    type: string
                seq:
                    description: Raised by every change; drop a live event older than what you show.
                    minimum: 1
                    type: integer
                shortfall:
                    oneOf:
                        - $ref: '#/components/schemas/HubShortfall'
                        - type: "null"
                slot_at:
                    description: When the cassette should be ready. Set on accept.
                    format: date-time
                    type:
                        - string
                        - "null"
                state:
                    $ref: '#/components/schemas/HubRequestState'
            required:
                - id
                - state
                - seq
                - scooter_code
                - items
                - lot_numbers
                - slot_at
                - rider_arrival_at
                - accepted_by
                - shortfall
                - created_at
            type: object
        HubRequestList:
            properties:
                requests:
                    items:
                        $ref: '#/components/schemas/HubRequest'
                    type: array
                seq:
                    description: The hub's seq at this moment. Compare live events and heartbeats against it.
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - requests
                - seq
                - server_time
            type: object
        HubRequestPayload:
            properties:
                request_id:
                    $ref: '#/components/schemas/Id'
            required:
                - request_id
            type: object
        HubRequestResponse:
            properties:
                request:
                    $ref: '#/components/schemas/HubRequest'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - request
                - server_time
            type: object
        HubRequestState:
            description: confirmed is new to the hub. hub_accepted is accepted, packing has a lot scanned, ready and partial are sealed, picked_up and received mean the rider took it. closed, expired and cancelled are ended.
            enum:
                - confirmed
                - hub_accepted
                - packing
                - ready
                - partial
                - picked_up
                - received
                - closed
                - expired
                - cancelled
            type: string
        HubScanEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    $ref: '#/components/schemas/EventId'
                payload:
                    $ref: '#/components/schemas/HubScanPayload'
                type:
                    const: scan
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HubScanPayload:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                lot_code:
                    maxLength: 64
                    minLength: 1
                    type: string
                request_id:
                    $ref: '#/components/schemas/Id'
                scanned_at:
                    format: date-time
                    type: string
            required:
                - request_id
                - lot_code
                - scanned_at
            type: object
        HubShortfall:
            properties:
                action:
                    enum:
                        - partial
                        - substitute
                        - other_hub
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/ShortLine'
                    minItems: 1
                    type: array
                other_hub:
                    oneOf:
                        - $ref: '#/components/schemas/HubRef'
                        - type: "null"
                status:
                    description: The rider's answer. The rider sees and answers it once the cassette is sealed (partial).
                    enum:
                        - open
                        - accepted
                        - refused
                    type: string
                substitute_item_id:
                    oneOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
            required:
                - action
                - lines
                - substitute_item_id
                - other_hub
                - status
            type: object
        HubShortfallEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    $ref: '#/components/schemas/EventId'
                payload:
                    $ref: '#/components/schemas/HubShortfallPayload'
                type:
                    const: shortfall
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HubShortfallPayload:
            properties:
                action:
                    enum:
                        - partial
                        - substitute
                        - other_hub
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/ShortLine'
                    maxItems: 20
                    minItems: 1
                    type: array
                other_hub_id:
                    $ref: '#/components/schemas/Id'
                reason:
                    maxLength: 200
                    type: string
                request_id:
                    $ref: '#/components/schemas/Id'
                substitute_item_id:
                    $ref: '#/components/schemas/Id'
            required:
                - request_id
                - action
                - lines
            type: object
        HubUnscanEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    $ref: '#/components/schemas/EventId'
                payload:
                    $ref: '#/components/schemas/HubUnscanPayload'
                type:
                    const: unscan
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HubUnscanPayload:
            properties:
                lot_code:
                    maxLength: 64
                    minLength: 1
                    type: string
                request_id:
                    $ref: '#/components/schemas/Id'
            required:
                - request_id
                - lot_code
            type: object
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        Label:
            properties:
                hub_name:
                    type: string
                items:
                    items:
                        properties:
                            name:
                                type: string
                            qty:
                                minimum: 0
                                type: integer
                        required:
                            - name
                            - qty
                        type: object
                    type: array
                lot_numbers:
                    items:
                        type: string
                    type: array
                ready_at:
                    format: date-time
                    type: string
                request_code:
                    description: A short code printed large, for matching the cassette to the request.
                    type: string
                scooter_code:
                    type: string
            required:
                - request_code
                - scooter_code
                - hub_name
                - lot_numbers
                - items
                - ready_at
            type: object
        LabelResponse:
            properties:
                label:
                    $ref: '#/components/schemas/Label'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - label
                - server_time
            type: object
        OtpRequestResult:
            properties:
                expires_in_s:
                    minimum: 1
                    type: integer
                request_id:
                    type: string
                resend_after_s:
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - request_id
                - expires_in_s
                - resend_after_s
                - server_time
            type: object
        PickLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                lots:
                    description: Soonest valid expiry first. Empty when the hub has none, which is a shortfall.
                    items:
                        $ref: '#/components/schemas/PickLot'
                    type: array
                name:
                    type: string
                picked_qty:
                    minimum: 0
                    type: integer
                qty:
                    minimum: 1
                    type: integer
                route_order:
                    description: The item's place on the shelf route, for lines with the same expiry.
                    minimum: 0
                    type: integer
            required:
                - item_id
                - name
                - qty
                - picked_qty
                - route_order
                - lots
            type: object
        PickList:
            properties:
                lines:
                    description: Lines still to pick, the line with the soonest expiring lot first.
                    items:
                        $ref: '#/components/schemas/PickLine'
                    type: array
                request_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - request_id
                - lines
                - server_time
            type: object
        PickLot:
            properties:
                expires_at:
                    format: date-time
                    type: string
                lot_code:
                    type: string
                lot_id:
                    $ref: '#/components/schemas/Id'
                qty:
                    minimum: 1
                    type: integer
                temp_status:
                    $ref: '#/components/schemas/TempStatus'
            required:
                - lot_id
                - lot_code
                - qty
                - expires_at
                - temp_status
            type: object
        RejectedEvent:
            properties:
                code:
                    description: The same codes as the endpoint, plus invalid_event and unknown_event_type.
                    type: string
                id:
                    description: The event_id.
                    type: string
                message:
                    type: string
                retryable:
                    type: boolean
            required:
                - id
                - code
                - message
                - retryable
            type: object
        ScanRejection:
            description: The shared error shape, plus the lot when it is known.
            properties:
                code:
                    type: string
                lot:
                    description: The scanned lot, with lot_id for quarantine. Null when the code is not a lot at this hub, and absent on idempotency_in_progress.
                    oneOf:
                        - $ref: '#/components/schemas/PickLot'
                        - type: "null"
                message:
                    type: string
                retryable:
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - code
                - message
                - retryable
                - server_time
            type: object
        ScanRequest:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                lot_code:
                    maxLength: 64
                    minLength: 1
                    type: string
                scanned_at:
                    description: The device's time. The server's time is the official one.
                    format: date-time
                    type: string
            required:
                - lot_code
                - scanned_at
            type: object
        ScanResult:
            properties:
                duplicate:
                    description: True when the lot was already in this cassette; nothing changed.
                    type: boolean
                lot:
                    $ref: '#/components/schemas/PickLot'
                request:
                    $ref: '#/components/schemas/HubRequest'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - lot
                - duplicate
                - request
                - server_time
            type: object
        ServerTime:
            description: Current server time in UTC. Clients use it to measure phone clock offset.
            example: "2026-11-04T10:15:30.250Z"
            format: date-time
            type: string
        ShortLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                qty_missing:
                    maximum: 500
                    minimum: 1
                    type: integer
            required:
                - item_id
                - qty_missing
            type: object
        ShortfallRequest:
            properties:
                action:
                    enum:
                        - partial
                        - substitute
                        - other_hub
                    type: string
                lines:
                    description: Every short line, each item once.
                    items:
                        $ref: '#/components/schemas/ShortLine'
                    maxItems: 20
                    minItems: 1
                    type: array
                other_hub_id:
                    $ref: '#/components/schemas/Id'
                reason:
                    maxLength: 200
                    type: string
                substitute_item_id:
                    $ref: '#/components/schemas/Id'
            required:
                - action
                - lines
            type: object
        Staff:
            properties:
                hub:
                    $ref: '#/components/schemas/HubRef'
                hub_open:
                    description: False while the hub is paused. Nothing new can be accepted then.
                    type: boolean
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type:
                        - string
                        - "null"
                role:
                    $ref: '#/components/schemas/StaffRole'
            required:
                - id
                - name
                - role
                - hub
                - hub_open
            type: object
        StaffResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                staff:
                    $ref: '#/components/schemas/Staff'
            required:
                - staff
                - server_time
            type: object
        StaffRole:
            description: hub_staff packs; hub_lead also quarantines lots.
            enum:
                - hub_staff
                - hub_lead
            type: string
        StaffSession:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    example: 900
                    minimum: 1
                    type: integer
                hub_id:
                    $ref: '#/components/schemas/Id'
                refresh_token:
                    type: string
                role:
                    $ref: '#/components/schemas/StaffRole'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                staff_id:
                    $ref: '#/components/schemas/Id'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - staff_id
                - role
                - hub_id
                - server_time
            type: object
        TempStatus:
            description: alert means the lot failed its temperature check. It cannot be picked or scanned; quarantine it.
            enum:
                - ok
                - alert
            type: string
        TokenPair:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    minimum: 1
                    type: integer
                refresh_token:
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - server_time
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: Short-lived access token from the sign-in endpoints.
            scheme: bearer
            type: http
info:
    contact:
        name: Ninzo backend
    description: The API behind the partner app that hub staff use to pack restocks for riders. The shared rules are in contracts/README.md. Each staff member belongs to one hub, and every hub path acts on that hub. Field names are final only after the contract review.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Ninzo partner (hub) API
    version: 0.1.0
openapi: 3.1.0
paths:
    /auth/otp/request:
        post:
            description: 'Indian mobile numbers only for now. The reply is the same whether or not the staff account exists, and no SMS is sent if it does not. Errors: invalid_request for a bad phone number, otp_resend_limit (429) when the resend limit is reached.'
            operationId: requestOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                phone:
                                    description: In E.164 format.
                                    example: "+919876543210"
                                    pattern: ^\+91[6-9][0-9]{9}$
                                    type: string
                            required:
                                - phone
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OtpRequestResult'
                    description: The code was sent.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Send a sign-in code
            tags:
                - auth
    /auth/otp/verify:
        post:
            description: 'Errors: invalid_otp and otp_expired (both 400), otp_attempts_exceeded (429). After a correct code, a blocked person or a staff account that is not active gets account_blocked (403).'
            operationId: verifyOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                otp:
                                    example: "123456"
                                    pattern: ^[0-9]{4,8}$
                                    type: string
                                request_id:
                                    type: string
                            required:
                                - request_id
                                - otp
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSession'
                    description: Signed in.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Sign in with the code
            tags:
                - auth
    /auth/refresh:
        post:
            description: Send only one refresh at a time. See Sign-in in contracts/README.md.
            operationId: refreshToken
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenPair'
                    description: A new pair. The old refresh token stops working.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            security: []
            summary: Get a new token pair
            tags:
                - auth
    /auth/signout:
        post:
            description: Ends this session. A shared hub tablet should sign out at the end of each staff member's shift.
            operationId: signOut
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Signed out.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Sign out on this device
            tags:
                - auth
    /hub/events:
        post:
            description: Applied in the order sent, each once by event_id; a repeat returns the same result. One rejected event never blocks the rest. A rejection is final unless retryable is true. See Hub offline sync in contracts/README.md.
            operationId: sendEventBatch
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                events:
                                    items:
                                        $ref: '#/components/schemas/HubEvent'
                                    maxItems: 200
                                    minItems: 1
                                    type: array
                            required:
                                - events
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventBatchResult'
                    description: What was applied and what was rejected.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Send queued scans and status changes
            tags:
                - sync
    /hub/lots:
        get:
            description: Soonest expiry first, at most 500. Includes quarantined and expired lots, marked by status, so staff can clear them.
            operationId: listHubLots
            parameters:
                - description: Only lots of this item.
                  in: query
                  name: item_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubLotList'
                    description: The lots.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List the lots at the hub
            tags:
                - lots
    /hub/lots/{lot_id}/quarantine:
        post:
            description: 'Hub lead only; hub staff get 403 forbidden. The app shows the reason and asks to confirm first. A quarantined lot can never be scanned again, and is taken out of any cassette still at the hub, sealed or not. Quarantining again changes nothing. Errors, all 409: lot_on_scooter (it already left the hub).'
            operationId: quarantineLot
            parameters:
                - description: The lot.
                  in: path
                  name: lot_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                note:
                                    description: What was seen, such as the temperature reading.
                                    maxLength: 500
                                    type: string
                                reason:
                                    enum:
                                        - temperature
                                        - damaged
                                        - expired
                                        - contamination
                                        - other
                                    type: string
                            required:
                                - reason
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubLotResponse'
                    description: Quarantined.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Quarantine a lot
            tags:
                - lots
    /hub/me:
        get:
            description: The role decides what the app shows. Only a hub lead can quarantine a lot.
            operationId: getStaff
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffResponse'
                    description: The staff member.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get the signed-in staff member and their hub
            tags:
                - staff
    /hub/restock:
        get:
            description: Open requests first, soonest rider arrival first. With no state, the list holds every request still in progress at the hub (confirmed, hub_accepted, packing, ready, partial, picked_up). The live channel sends new and changed requests.
            operationId: listHubRequests
            parameters:
                - description: Only requests in this state.
                  in: query
                  name: state
                  required: false
                  schema:
                    $ref: '#/components/schemas/HubRequestState'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubRequestList'
                    description: The queue.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List the hub's restock requests
            tags:
                - restock
    /hub/restock/{request_id}:
        get:
            description: One request at the signed-in staff member's hub. A request at another hub is 404.
            operationId: getHubRequest
            parameters:
                - $ref: '#/components/parameters/RequestId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubRequestResponse'
                    description: The request.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get one restock request
            tags:
                - restock
    /hub/restock/{request_id}/accept:
        post:
            description: 'One acceptance only: a second staff member gets request_taken, and the same staff member accepting again gets the request back. Sets slot_at and rider_arrival_at. Errors, all 409: request_taken, request_withdrawn (the rider cancelled it), hub_closed.'
            operationId: acceptHubRequest
            parameters:
                - $ref: '#/components/parameters/RequestId'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubRequestResponse'
                    description: Accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Accept a request and start packing
            tags:
                - restock
    /hub/restock/{request_id}/label:
        get:
            description: 'Only what the printer needs. The printer itself is set up on the device. Works once the cassette is sealed (ready or partial, and after). Errors: not_ready (409) before that.'
            operationId: getCassetteLabel
            parameters:
                - $ref: '#/components/parameters/RequestId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LabelResponse'
                    description: The label.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get the cassette label's fields
            tags:
                - restock
    /hub/restock/{request_id}/pick-list:
        get:
            description: 'One line per item still to pick. Each line lists the hub''s lots for that item, soonest valid expiry first. Expired, quarantined and temperature-alert lots are never listed. Lots are whole: pick lots until picked_qty reaches qty; picked_qty may pass qty, and scanning past it is allowed. Errors, all 409: not_accepted, request_closed.'
            operationId: getPickList
            parameters:
                - $ref: '#/components/parameters/RequestId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PickList'
                    description: The pick list.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get what to pick, soonest expiry first
            tags:
                - restock
    /hub/restock/{request_id}/ready:
        post:
            description: 'Send every lot number in the cassette; they must match the lots scanned. The request becomes ready, or partial when a shortfall is recorded, which the rider then answers. lot_numbers may be empty only when a shortfall is recorded. Sending ready again changes nothing and returns the request. Errors, all 409: lots_mismatch, nothing_packed (no lots and no shortfall), shortfall_needed (a line is short and no shortfall is recorded), lot_quarantined (take that lot out first), request_closed. With a shortfall, its lines become what is really short as packed. After the rider accepted a substitute, what is packed is sealed as it is.'
            operationId: markHubRequestReady
            parameters:
                - $ref: '#/components/parameters/RequestId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                lot_numbers:
                                    items:
                                        maxLength: 64
                                        minLength: 1
                                        type: string
                                    maxItems: 100
                                    minItems: 0
                                    type: array
                            required:
                                - lot_numbers
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubRequestResponse'
                    description: Ready.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Seal the cassette as ready for the rider
            tags:
                - restock
    /hub/restock/{request_id}/scan:
        post:
            description: 'The whole lot goes into the cassette, and the request moves to packing. A rejected scan leaves the request open. Scanning a lot already in this cassette changes nothing and returns duplicate true. Errors, all 409, with the lot when it is known so the app can act on it: not_accepted, wrong_lot (not at this hub, or not an item on the request), lot_expired, lot_quarantined, lot_already_packed (in another cassette), temp_alert (the lot failed its temperature check: open the quarantine prompt with lot.lot_id), request_closed. A 503 is retryable: keep the scan queued.'
            operationId: scanHubLot
            parameters:
                - $ref: '#/components/parameters/RequestId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ScanRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ScanResult'
                    description: Scanned.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ScanRejection'
                    description: The scan was refused. The request stays open.
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Scan a lot into the cassette
            tags:
                - restock
    /hub/restock/{request_id}/shortfall:
        post:
            description: 'Recorded once per request, for every short line: partial (send what is packed), substitute (offer substitute_item_id for the missing units) or other_hub (other_hub_id fills the whole request). substitute_item_id is required with substitute and other_hub_id with other_hub. Then send ready, even with nothing packed: the request becomes partial, and the rider answers it then. If the rider accepts a substitute, the request returns to packing with a new line for the substitute item: scan it and send ready again. If the rider accepts another hub, the request ends here and its lots go back on the shelf. A substitute is offered only if the hub holds enough of it. Errors, all 409: shortfall_already_recorded, not_accepted, request_closed, other_hub_unavailable, substitute_out_of_stock.'
            operationId: recordShortfall
            parameters:
                - $ref: '#/components/parameters/RequestId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ShortfallRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubRequestResponse'
                    description: Recorded.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Record what the hub cannot fill
            tags:
                - restock
    /hub/restock/{request_id}/unscan:
        post:
            description: 'For a lot scanned by mistake, before the cassette is ready. Errors, all 409: not_in_cassette, request_closed.'
            operationId: unscanHubLot
            parameters:
                - $ref: '#/components/parameters/RequestId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                lot_code:
                                    maxLength: 64
                                    minLength: 1
                                    type: string
                            required:
                                - lot_code
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubRequestResponse'
                    description: Taken out.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Take a lot back out of the cassette
            tags:
                - restock
security:
    - bearerAuth: []
servers:
    - description: Placeholder. Real URLs are published with the mock server.
      url: https://partner-api.example.invalid/v1
tags:
    - description: Sign-in and tokens.
      name: auth
    - description: The signed-in staff member and their hub.
      name: staff
    - description: The hub's restock queue, packing and the cassette.
      name: restock
    - description: Lots at the hub, and quarantine.
      name: lots
    - description: Offline sync.
      name: sync
