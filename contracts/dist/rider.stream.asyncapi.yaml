# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
asyncapi: 2.6.0
channels:
    /v1/riders/me/stream:
        description: One rider's offers, orders and restock changes.
        publish:
            description: The first frame must be auth, within 5 seconds. Send it again with a new token before the current one expires.
            message:
                $ref: '#/components/messages/Auth'
            operationId: sendRiderStreamFrame
            summary: Frames the app sends
            tags:
                - name: rider
        subscribe:
            description: Apply events by the seq rules in contracts/README.md.
            message:
                oneOf:
                    - $ref: '#/components/messages/AuthOk'
                    - $ref: '#/components/messages/Heartbeat'
                    - $ref: '#/components/messages/Offer'
                    - $ref: '#/components/messages/OrderState'
                    - $ref: '#/components/messages/Restock'
            operationId: receiveRiderStreamEvent
            summary: Events the app receives
            tags:
                - name: rider
components:
    messages:
        Auth:
            name: auth
            payload:
                properties:
                    token:
                        type: string
                    type:
                        const: auth
                        type: string
                required:
                    - type
                    - token
                type: object
            summary: Sends a current access token.
            title: Sign in to the stream
        AuthOk:
            name: auth_ok
            payload:
                properties:
                    data:
                        type: object
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: auth_ok
                        type: string
                required:
                    - type
                    - server_time
                    - data
                type: object
            summary: The first event. Fetch the rider's state next if the app has not already.
            title: Signed in
        Heartbeat:
            name: heartbeat
            payload:
                properties:
                    data:
                        type: object
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: heartbeat
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: Sent every 15 seconds with the current seq. If its seq is higher than the app has, fetch the rider's state.
            title: Heartbeat
        Offer:
            name: offer
            payload:
                properties:
                    data:
                        $ref: '#/components/schemas/Offer'
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: offer
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: A new offer, or an offer that expired, was taken or was cancelled.
            title: Offer changed
        OrderState:
            name: order_state
            payload:
                properties:
                    data:
                        $ref: '#/components/schemas/RiderOrder'
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: order_state
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: The order changed, including a cancel during packing or arrival at the perimeter.
            title: Order changed
        Restock:
            name: restock
            payload:
                properties:
                    data:
                        $ref: '#/components/schemas/RestockRequest'
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: restock
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: The hub or system changed the rider's restock request.
            title: Restock changed
    schemas:
        HubRef:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                lat:
                    type: number
                lng:
                    type: number
                name:
                    type: string
            required:
                - id
                - name
                - lat
                - lng
            type: object
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        Offer:
            properties:
                expires_at:
                    format: date-time
                    type: string
                fencing_token:
                    description: Fixed for the life of the offer. Send with accept, decline and Ready. A device holding a token from another offer is rejected with stale_fencing_token.
                    type: string
                gate:
                    description: Where the rider is going.
                    properties:
                        entry_notes:
                            type:
                                - string
                                - "null"
                        id:
                            $ref: '#/components/schemas/Id'
                        label:
                            type: string
                        lat:
                            type: number
                        lng:
                            type: number
                    required:
                        - id
                        - label
                        - lat
                        - lng
                        - entry_notes
                    type: object
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/OrderLine'
                    type: array
                order_id:
                    description: Set once accepted.
                    type:
                        - string
                        - "null"
                order_number:
                    description: Readable order number, a letter and four digits such as A2931.
                    pattern: ^[A-Z][0-9]{4}$
                    type: string
                state:
                    enum:
                        - open
                        - accepted
                        - declined
                        - expired
                        - taken
                        - cancelled
                    type: string
            required:
                - id
                - order_id
                - items
                - gate
                - expires_at
                - state
                - fencing_token
                - order_number
            type: object
        OrderLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                qty:
                    minimum: 1
                    type: integer
            required:
                - item_id
                - name
                - qty
            type: object
        OrderState:
            description: The true order state. Only rider and console contracts expose it. The customer contract must use CustomerStage instead.
            enum:
                - CREATED
                - PAYMENT_PENDING
                - PAYMENT_SECURED
                - OFFERED
                - RIDER_ACCEPTED
                - PACKED
                - TIMER_RUNNING
                - ARRIVED
                - HANDED_OVER
                - COMPLETED
                - CANCELLED
                - PAYMENT_FAILED
                - NO_SCOOTER
                - TIMED_OUT
                - FAILED
            type: string
        RestockLine:
            properties:
                filled_qty:
                    description: Set once the hub has packed. Below qty means a short fill.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    example: Burger
                    type: string
                qty:
                    minimum: 1
                    type: integer
            required:
                - item_id
                - name
                - qty
                - filled_qty
            type: object
        RestockOption:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
            required:
                - item_id
                - name
            type: object
        RestockRequest:
            properties:
                arrive_by:
                    description: When the rider should arrive.
                    format: date-time
                    type:
                        - string
                        - "null"
                hub:
                    $ref: '#/components/schemas/HubRef'
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/RestockLine'
                    type: array
                lot_numbers:
                    description: The lots in the cassette, set at ready. The rider's scan is checked against these.
                    items:
                        type: string
                    type: array
                ready_in_s:
                    description: Seconds from now to the hub slot, never below 0. Null without a slot.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                shortfall:
                    oneOf:
                        - $ref: '#/components/schemas/RestockShortfall'
                        - type: "null"
                slot_at:
                    description: The hub's queue slot.
                    format: date-time
                    type:
                        - string
                        - "null"
                state:
                    enum:
                        - suggested
                        - confirmed
                        - hub_accepted
                        - packing
                        - ready
                        - picked_up
                        - received
                        - closed
                        - expired
                        - cancelled
                        - partial
                    type: string
            required:
                - id
                - state
                - hub
                - items
                - slot_at
                - arrive_by
                - lot_numbers
                - shortfall
                - ready_in_s
            type: object
        RestockShortfall:
            description: What the hub could not fill, and what it offers instead.
            properties:
                action:
                    enum:
                        - partial
                        - substitute
                        - other_hub
                    type: string
                other_hub:
                    oneOf:
                        - allOf:
                            - $ref: '#/components/schemas/HubRef'
                            - properties:
                                distance_m:
                                    description: Straight-line metres from the rider's node to this hub. Null if it cannot be worked out.
                                    minimum: 0
                                    type:
                                        - integer
                                        - "null"
                              required:
                                - distance_m
                              type: object
                        - type: "null"
                substitute:
                    oneOf:
                        - $ref: '#/components/schemas/RestockOption'
                        - type: "null"
            required:
                - action
                - substitute
                - other_hub
            type: object
        RiderOrder:
            description: What the rider sees of an order. It has no countdown fields. The rider sees a calm fixed label, so the clock never pressures the rider.
            properties:
                ended_reason:
                    description: Set when this rider no longer has the order. Open list, including cancelled, reassigned, failed, timed_out.
                    type:
                        - string
                        - "null"
                fencing_token:
                    description: Send with Ready, including after a restart.
                    type: string
                gate:
                    description: Where the rider is going.
                    properties:
                        entry_notes:
                            type:
                                - string
                                - "null"
                        id:
                            $ref: '#/components/schemas/Id'
                        label:
                            type: string
                        lat:
                            type: number
                        lng:
                            type: number
                    required:
                        - id
                        - label
                        - lat
                        - lng
                        - entry_notes
                    type: object
                handed_over_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/OrderLine'
                    type: array
                offer_id:
                    $ref: '#/components/schemas/Id'
                order_number:
                    description: Readable order number, a letter and four digits such as A2931.
                    pattern: ^[A-Z][0-9]{4}$
                    type: string
                otp_available:
                    description: True once the customer has the OTP to show. Offline, this value may be stale, so the app must still allow the rider to enter an OTP.
                    type: boolean
                rider_accepted_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                seq:
                    description: The rider's current seq when this was read.
                    minimum: 1
                    type: integer
                state:
                    $ref: '#/components/schemas/OrderState'
                timer_label:
                    description: A fixed label built from this order's timer length. It does not count down.
                    example: 1.5 mins
                    type: string
            required:
                - id
                - offer_id
                - fencing_token
                - state
                - seq
                - ended_reason
                - items
                - gate
                - timer_label
                - rider_accepted_at
                - otp_available
                - handed_over_at
                - order_number
            type: object
defaultContentType: application/json
id: urn:ninzo:rider:stream
info:
    contact:
        name: Ninzo backend
    description: The live stream for one rider. Sign-in, seq, heartbeat and close code rules are in contracts/README.md. GET /v1/riders/me/state stays the authority. The token must be renewed on the same connection, because this stream lasts a whole shift.
    license:
        name: Apache-2.0
    title: Ninzo rider stream
    version: 0.1.0
servers:
    placeholder:
        description: Placeholder. Real URLs are published with the mock server.
        protocol: wss
        url: rider-api.example.invalid
tags:
    - description: Following a rider's work live.
      name: rider
