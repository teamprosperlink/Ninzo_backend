# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
asyncapi: 2.6.0
channels:
    /v1/orders/{order_id}/stream:
        description: One customer order.
        parameters:
            order_id:
                description: The order.
                schema:
                    type: string
        publish:
            description: The first frame must be auth, within 5 seconds. Send it again with a new token before the current one expires.
            message:
                $ref: '#/components/messages/Auth'
            operationId: sendCustomerStreamFrame
            summary: Frames the app sends
            tags:
                - name: orders
        subscribe:
            description: Apply events by the seq rules in contracts/README.md.
            message:
                oneOf:
                    - $ref: '#/components/messages/AuthOk'
                    - $ref: '#/components/messages/Heartbeat'
                    - $ref: '#/components/messages/OrderUpdate'
                    - $ref: '#/components/messages/RiderPosition'
            operationId: receiveCustomerStreamEvent
            summary: Events the app receives
            tags:
                - name: orders
components:
    messages:
        Auth:
            name: auth
            payload:
                properties:
                    token:
                        type: string
                    type:
                        const: auth
                        type: string
                required:
                    - type
                    - token
                type: object
            summary: Sends a current access token.
            title: Sign in to the stream
        AuthOk:
            name: auth_ok
            payload:
                properties:
                    data:
                        type: object
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: auth_ok
                        type: string
                required:
                    - type
                    - server_time
                    - data
                type: object
            summary: The first event. Fetch the order next if the app has not already.
            title: Signed in
        Heartbeat:
            name: heartbeat
            payload:
                properties:
                    data:
                        type: object
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: heartbeat
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: Sent every 15 seconds with the current seq. If its seq is higher than the app has, fetch the order.
            title: Heartbeat
        OrderUpdate:
            name: order_update
            payload:
                properties:
                    data:
                        $ref: '#/components/schemas/Order'
                    seq:
                        minimum: 1
                        type: integer
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: order_update
                        type: string
                required:
                    - type
                    - seq
                    - server_time
                    - data
                type: object
            summary: Sent whenever something the customer can see changes. data is the same order GET returns.
            title: Order changed
        RiderPosition:
            name: rider_position
            payload:
                properties:
                    data:
                        properties:
                            lat:
                                type: number
                            lng:
                                type: number
                            recorded_at:
                                format: date-time
                                type: string
                        required:
                            - lat
                            - lng
                            - recorded_at
                        type: object
                    server_time:
                        format: date-time
                        type: string
                    type:
                        const: rider_position
                        type: string
                required:
                    - type
                    - server_time
                    - data
                type: object
            summary: A passing update with no seq. Sent only from the rider_accepted stage until handover.
            title: Rider position
    schemas:
        CustomerStage:
            description: What the customer is shown. The mapping is in contracts/README.md.
            enum:
                - payment
                - payment_failed
                - looking_for_rider
                - no_scooter
                - rider_accepted
                - timer_running
                - arrived
                - handed_over
                - ended
            type: string
        EtaOffer:
            description: A longer ETA the customer may accept at the no_scooter stage. Offered only when the time is measured, because the customer must see it to agree.
            properties:
                eta_s:
                    example: 600
                    minimum: 1
                    type: integer
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
            required:
                - id
                - eta_s
                - expires_at
            type: object
        EtaSource:
            description: Show a time only when this is measured.
            enum:
                - measured
                - placeholder
                - unavailable
            type: string
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        Money:
            description: An amount in minor units, such as paise. Never a decimal.
            properties:
                amount_minor:
                    example: 14900
                    minimum: 0
                    type: integer
                currency:
                    example: INR
                    pattern: ^[A-Z]{3}$
                    type: string
            required:
                - amount_minor
                - currency
            type: object
        Order:
            description: What the customer may see of an order. It never includes the true order state or rider_accepted_at. See Order states and customer stages in contracts/README.md.
            properties:
                cancel_until:
                    description: The end of the 5-second window after payment is confirmed. Null before that.
                    format: date-time
                    type:
                        - string
                        - "null"
                cancellable:
                    description: True if the customer can cancel right now. See Cancels and refunds in contracts/README.md.
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                customer_stage:
                    $ref: '#/components/schemas/CustomerStage'
                ended_reason:
                    description: Set only at the ended stage. Open list, including cancelled, timed_out, failed. failed appears only after the customer has seen rider_accepted.
                    type:
                        - string
                        - "null"
                eta_offer:
                    description: Set only at the no_scooter stage, when a longer ETA is on offer.
                    oneOf:
                        - $ref: '#/components/schemas/EtaOffer'
                        - type: "null"
                eta_s:
                    description: Null before the rider_accepted stage, and unless eta_source is measured.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                eta_source:
                    $ref: '#/components/schemas/EtaSource'
                gate:
                    $ref: '#/components/schemas/OrderGate'
                handover_otp:
                    description: Set at the arrived stage, or in the signal-lost case in contracts/README.md. The customer shows it, and the rider submits it. Null in a replayed response, because the code is never stored, so get it from GET or the stream.
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                order_number:
                    description: Readable order number, a letter and four digits such as A2931.
                    pattern: ^[A-Z][0-9]{4}$
                    type: string
                payment_request:
                    description: Set only at the payment stage, so checkout can resume after the app was closed.
                    oneOf:
                        - $ref: '#/components/schemas/PaymentRequest'
                        - type: "null"
                payment_status:
                    $ref: '#/components/schemas/PaymentStatus'
                remedy:
                    description: Set when a miss or failure earned the customer a remedy.
                    oneOf:
                        - $ref: '#/components/schemas/Remedy'
                        - type: "null"
                rider:
                    description: Null until the rider_accepted stage.
                    oneOf:
                        - $ref: '#/components/schemas/OrderRider'
                        - type: "null"
                seq:
                    description: The customer-visible version. Compare it with seq on the live stream.
                    example: 3
                    minimum: 1
                    type: integer
                timer:
                    $ref: '#/components/schemas/OrderTimer'
                total:
                    $ref: '#/components/schemas/Money'
                wait_deadline:
                    description: The clear time shown while waiting. See the stage table in contracts/README.md. It does not change when a rider accepts.
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - id
                - seq
                - customer_stage
                - ended_reason
                - gate
                - items
                - total
                - payment_status
                - payment_request
                - cancellable
                - cancel_until
                - wait_deadline
                - eta_source
                - eta_s
                - eta_offer
                - rider
                - timer
                - remedy
                - handover_otp
                - created_at
                - order_number
            type: object
        OrderGate:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                label:
                    type: string
            required:
                - id
                - label
            type: object
        OrderItem:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                qty:
                    minimum: 1
                    type: integer
                unit_price:
                    $ref: '#/components/schemas/Money'
            required:
                - item_id
                - name
                - qty
                - unit_price
            type: object
        OrderRider:
            description: Null on the order until the rider_accepted stage.
            properties:
                first_name:
                    example: Ravi
                    type: string
            required:
                - first_name
            type: object
        OrderTimer:
            description: The order's timer, set only by the server. The countdown ends at timer_started_at + timer_duration_s, corrected for phone clock offset.
            properties:
                timer_duration_s:
                    description: The length this order was fixed with. Null until the timer starts.
                    example: 90
                    minimum: 1
                    type:
                        - integer
                        - "null"
                timer_missed:
                    description: Becomes true, once, if the timer ended before the rider reached the arrival perimeter.
                    example: false
                    type: boolean
                timer_started_at:
                    description: Null until the timer starts, and stays null if no timer runs.
                    format: date-time
                    type:
                        - string
                        - "null"
                timer_stopped_at:
                    description: Set when the rider enters the arrival perimeter.
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - timer_started_at
                - timer_duration_s
                - timer_stopped_at
                - timer_missed
            type: object
        PaymentRequest:
            description: What the app needs to open Razorpay checkout.
            properties:
                amount:
                    $ref: '#/components/schemas/Money'
                razorpay_key_id:
                    description: Razorpay's public key ID. Not a secret.
                    type: string
                razorpay_order_id:
                    type: string
            required:
                - razorpay_key_id
                - razorpay_order_id
                - amount
            type: object
        PaymentStatus:
            description: Only the server sets this, from the Razorpay webhook. Payment is charged up front. not_paid means the order ended with no payment. refunded means money taken was returned.
            enum:
                - pending
                - paid
                - failed
                - not_paid
                - refunded
            type: string
        Remedy:
            properties:
                amount:
                    oneOf:
                        - $ref: '#/components/schemas/Money'
                        - type: "null"
                type:
                    description: Open list, including credit, refund, replacement.
                    example: credit
                    type: string
            required:
                - type
                - amount
            type: object
defaultContentType: application/json
id: urn:ninzo:customer:stream
info:
    contact:
        name: Ninzo backend
    description: The live stream for one order. Sign-in, seq, heartbeat and close code rules are in contracts/README.md. GET /v1/orders/{order_id} stays the authority.
    license:
        name: Apache-2.0
    title: Ninzo customer order stream
    version: 0.1.0
servers:
    placeholder:
        description: Placeholder. Real URLs are published with the mock server.
        protocol: wss
        url: customer-api.example.invalid
tags:
    - description: Following an order live.
      name: orders
