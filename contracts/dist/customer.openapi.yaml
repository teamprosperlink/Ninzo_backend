    /me/phone/otp:
        post:
            description: 'Errors: invalid_request for a bad phone number, otp_resend_limit (429) when the resend limit is reached.'
            operationId: requestPhoneOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                phone:
                                    description: In E.164 format.
                                    example: "+919876543210"
                                    pattern: ^\+91[6-9][0-9]{9}$
                                    type: string
                            required:
                                - phone
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OtpRequestResult'
                    description: The code was sent.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Send a code to verify a phone
            tags:
                - auth
    /me/phone/verify:
        post:
            description: 'Use the request_id from requestPhoneOtp in this same session. Ask for this when the customer goes to order. Returns a new session, and the old tokens stop working, so replace them. customer_id stays the same, and this does not change how the customer signs in. Verifying the phone already on this account with a new code returns 200. If the reply is lost, a retry returns 401 or invalid_otp, because the code is used, so sign in again. Errors: invalid_otp and otp_expired (both 400), otp_attempts_exceeded (429), account_blocked (403). Both 409: phone_already_set if this account has a different verified phone, phone_already_registered if another account holds that number. Tell them to log in with phone and OTP.'
            operationId: verifyPhone
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                otp:
                                    example: "123456"
                                    pattern: ^[0-9]{4,8}$
                                    type: string
                                request_id:
                                    type: string
                            required:
                                - request_id
                                - otp
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerSession'
                    description: Verified, with a new session.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Verify a phone
            tags:
                - auth
    /me/sign-in-method:
        post:
            description: 'For the settings screen. A customer has one sign-in method at a time. For google, send id_token. For phone, send request_id from requestPhoneOtp, for the phone already verified on this account, and otp. Returns a new session, and every other session ends, so replace the tokens. Errors: invalid_otp and otp_expired (both 400), invalid_google_token (401), account_blocked (403), otp_attempts_exceeded (429). All 409: sign_in_method_unchanged, google_account_in_use, phone_required, phone_already_set. An ended session gets 401, even if the access token has not expired. If the reply is lost, a retry returns 401 or sign_in_method_unchanged, because the change was made, so sign in again the new way.'
            operationId: changeSignInMethod
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - properties:
                                    method:
                                        const: google
                                  required:
                                    - id_token
                                - properties:
                                    method:
                                        const: phone
                                  required:
                                    - request_id
                                    - otp
                            properties:
                                id_token:
                                    type: string
                                method:
                                    enum:
                                        - google
                                        - phone
                                    type: string
                                otp:
                                    example: "123456"
                                    pattern: ^[0-9]{4,8}$
                                    type: string
                                request_id:
                                    type: string
                            required:
                                - method
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerSession'
                    description: Changed, with a new session.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Change how this customer signs in
            tags:
                - auth
