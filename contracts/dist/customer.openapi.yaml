# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
components:
    headers:
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                minimum: 0
                type: integer
    parameters:
        Cursor:
            description: Value of next_cursor from the previous page. Treat it as opaque.
            in: query
            name: cursor
            required: false
            schema:
                type: string
        DeviceId:
            description: The device.
            in: path
            name: device_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        IdempotencyKey:
            description: Unique per intended action. Send the same key when retrying. Kept for 24 hours, per signed-in user, method and exact path.
            example: 7f3c1e9a-2b4d-4c8e-9a10-5d6e7f8a9b0c
            in: header
            name: Idempotency-Key
            required: true
            schema:
                maxLength: 128
                minLength: 8
                pattern: ^[A-Za-z0-9_-]+$
                type: string
        ItemId:
            description: The menu item.
            in: path
            name: item_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        Limit:
            description: Page size.
            in: query
            name: limit
            required: false
            schema:
                default: 20
                maximum: 100
                minimum: 1
                type: integer
        OrderId:
            description: The order.
            in: path
            name: order_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The request is invalid, or a required Idempotency-Key is missing.
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The action no longer fits the current state, or the same Idempotency-Key is still being processed. In that second case, retryable is true and Retry-After is set.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The caller lacks a permission, named in missing_permission.
        IdempotencyKeyReused:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: This Idempotency-Key was already used with a different request body.
        InternalError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: An unexpected server error.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The resource does not exist, or the caller cannot see it.
        ServiceUnavailable:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: A dependency is down. Retry later.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        TooManyRequests:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Rate limited.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The token is missing, invalid or expired.
    schemas:
        Availability:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AvailableItem'
                    type: array
                offer_available:
                    description: False when the checks fail. The promise is withdrawn, not stretched.
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                stale_at:
                    description: Fetch again after this time.
                    format: date-time
                    type: string
                unavailable_reason:
                    description: Set when offer_available is false. Open list, including out_of_service_area, zone_off, gate_not_verified, no_coverage and sold_out.
                    type:
                        - string
                        - "null"
            required:
                - offer_available
                - items
                - stale_at
                - server_time
            type: object
        AvailableItem:
            properties:
                item:
                    $ref: '#/components/schemas/MenuItem'
                qty_left:
                    example: 4
                    minimum: 1
                    type: integer
            required:
                - item
                - qty_left
            type: object
        CreateOrderResult:
            properties:
                order:
                    $ref: '#/components/schemas/Order'
                payment:
                    $ref: '#/components/schemas/PaymentRequest'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - order
                - payment
                - server_time
            type: object
        Customer:
            properties:
                email:
                    description: Contact details only. Null until the customer adds it.
                    example: asha@example.com
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type:
                        - string
                        - "null"
                phone:
                    description: Null until a phone is verified.
                    example: "+919876543210"
                    type:
                        - string
                        - "null"
                sign_in_method:
                    description: How this customer logs in. For the settings screen.
                    enum:
                        - phone
                        - google
                        - apple
                    type: string
            required:
                - id
                - phone
                - name
                - email
                - sign_in_method
            type: object
        CustomerResponse:
            properties:
                customer:
                    $ref: '#/components/schemas/Customer'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - customer
                - server_time
            type: object
        CustomerSession:
            properties:
                access_token:
                    type: string
                customer_id:
                    $ref: '#/components/schemas/Id'
                expires_in_s:
                    example: 900
                    minimum: 1
                    type: integer
                phone_verified:
                    description: False means the customer must verify a phone before doing anything but viewing the menu.
                    type: boolean
                refresh_token:
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - customer_id
                - phone_verified
                - server_time
            type: object
        CustomerStage:
            description: What the customer is shown. The mapping is in contracts/README.md.
            enum:
                - payment
                - payment_failed
                - looking_for_rider
                - no_scooter
                - rider_accepted
                - timer_running
                - arrived
                - handed_over
                - ended
            type: string
        DeviceResponse:
            properties:
                device_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - device_id
                - server_time
            type: object
        Done:
            description: A successful result with nothing else to return.
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - server_time
            type: object
        Error:
            description: The one error shape, used by every endpoint.
            properties:
                code:
                    description: 'Stable code for app logic. This is an open list: contracts add codes for their own endpoints. If a client does not know a code, it follows retryable. Shared codes are listed in contracts/README.md.'
                    example: token_expired
                    type: string
                message:
                    description: For developers and logs. App wording comes from the copy deck.
                    example: The access token has expired.
                    type: string
                missing_permission:
                    description: Only on 403. The permission the caller lacks.
                    example: orders.read
                    type: string
                retryable:
                    description: True if the same request may succeed later without changes.
                    example: false
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                sign_in_method:
                    description: Only on sign_in_method_mismatch. How this account signs in.
                    example: google
                    type: string
            required:
                - code
                - message
                - retryable
                - server_time
            type: object
        EtaOffer:
            description: A longer ETA the customer may accept at the no_scooter stage. Offered only when the time is measured, because the customer must see it to agree.
            properties:
                eta_s:
                    example: 600
                    minimum: 1
                    type: integer
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
            required:
                - id
                - eta_s
                - expires_at
            type: object
        EtaSource:
            description: Show a time only when this is measured.
            enum:
                - measured
                - placeholder
                - unavailable
            type: string
        Gate:
            properties:
                entry_notes:
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                label:
                    type: string
                lat:
                    type: number
                lng:
                    type: number
                verified:
                    description: Orders can be placed only at verified gates. Proposed, until the owner settles the gate policy.
                    type: boolean
            required:
                - id
                - label
                - lat
                - lng
                - verified
            type: object
        GateList:
            properties:
                gates:
                    items:
                        $ref: '#/components/schemas/Gate'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - gates
                - server_time
            type: object
        GateResponse:
            properties:
                gate:
                    $ref: '#/components/schemas/Gate'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - gate
                - server_time
            type: object
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        LocationCheck:
            properties:
                in_service_area:
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                zone_id:
                    anyOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
                    description: Null outside every service area.
            required:
                - in_service_area
                - zone_id
                - server_time
            type: object
        MaskedCall:
            properties:
                expires_at:
                    format: date-time
                    type: string
                phone:
                    description: A masked number, not the rider's own.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - phone
                - expires_at
                - server_time
            type: object
        MenuItem:
            properties:
                allergens:
                    items:
                        type: string
                    type: array
                description:
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                photo_url:
                    format: uri
                    type:
                        - string
                        - "null"
                price:
                    $ref: '#/components/schemas/Money'
            required:
                - id
                - name
                - price
                - allergens
            type: object
        MenuItemList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/MenuItem'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - items
                - server_time
            type: object
        MenuItemResponse:
            properties:
                item:
                    $ref: '#/components/schemas/MenuItem'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - item
                - server_time
            type: object
        Money:
            description: An amount in minor units, such as paise. Never a decimal.
            properties:
                amount_minor:
                    example: 14900
                    minimum: 0
                    type: integer
                currency:
                    example: INR
                    pattern: ^[A-Z]{3}$
                    type: string
            required:
                - amount_minor
                - currency
            type: object
        Order:
            description: What the customer may see of an order. It never includes the true order state or rider_accepted_at. See Order states and customer stages in contracts/README.md.
            properties:
                cancel_until:
                    description: The end of the 5-second window after payment is confirmed. Null before that.
                    format: date-time
                    type:
                        - string
                        - "null"
                cancellable:
                    description: True if the customer can cancel right now. See Cancels and refunds in contracts/README.md.
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                customer_stage:
                    $ref: '#/components/schemas/CustomerStage'
                ended_reason:
                    description: Set only at the ended stage. Open list, including cancelled, timed_out, failed. failed appears only after the customer has seen rider_accepted.
                    type:
                        - string
                        - "null"
                eta_offer:
                    description: Set only at the no_scooter stage, when a longer ETA is on offer.
                    oneOf:
                        - $ref: '#/components/schemas/EtaOffer'
                        - type: "null"
                eta_s:
                    description: Null before the rider_accepted stage, and unless eta_source is measured.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                eta_source:
                    $ref: '#/components/schemas/EtaSource'
                gate:
                    $ref: '#/components/schemas/OrderGate'
                handover_otp:
                    description: Set at the arrived stage, or in the signal-lost case in contracts/README.md. The customer shows it, and the rider submits it. Null in a replayed response, because the code is never stored, so get it from GET or the stream.
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                order_number:
                    description: Readable order number, a letter and four digits such as A2931.
                    pattern: ^[A-Z][0-9]{4}$
                    type: string
                payment_request:
                    description: Set only at the payment stage, so checkout can resume after the app was closed.
                    oneOf:
                        - $ref: '#/components/schemas/PaymentRequest'
                        - type: "null"
                payment_status:
                    $ref: '#/components/schemas/PaymentStatus'
                remedy:
                    description: Set when a miss or failure earned the customer a remedy.
                    oneOf:
                        - $ref: '#/components/schemas/Remedy'
                        - type: "null"
                rider:
                    description: Null until the rider_accepted stage.
                    oneOf:
                        - $ref: '#/components/schemas/OrderRider'
                        - type: "null"
                seq:
                    description: The customer-visible version. Compare it with seq on the live stream.
                    example: 3
                    minimum: 1
                    type: integer
                timer:
                    $ref: '#/components/schemas/OrderTimer'
                total:
                    $ref: '#/components/schemas/Money'
                wait_deadline:
                    description: The clear time shown while waiting. See the stage table in contracts/README.md. It does not change when a rider accepts.
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - id
                - seq
                - customer_stage
                - ended_reason
                - gate
                - items
                - total
                - payment_status
                - payment_request
                - cancellable
                - cancel_until
                - wait_deadline
                - eta_source
                - eta_s
                - eta_offer
                - rider
                - timer
                - remedy
                - handover_otp
                - created_at
                - order_number
            type: object
        OrderGate:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                label:
                    type: string
            required:
                - id
                - label
            type: object
        OrderItem:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                qty:
                    minimum: 1
                    type: integer
                unit_price:
                    $ref: '#/components/schemas/Money'
            required:
                - item_id
                - name
                - qty
                - unit_price
            type: object
        OrderItemRequest:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                qty:
                    example: 1
                    minimum: 1
                    type: integer
            required:
                - item_id
                - qty
            type: object
        OrderList:
            properties:
                next_cursor:
                    description: Pass as cursor to get the next page. Null on the last page.
                    type:
                        - string
                        - "null"
                orders:
                    items:
                        $ref: '#/components/schemas/Order'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - orders
                - next_cursor
                - server_time
            type: object
        OrderResponse:
            properties:
                order:
                    $ref: '#/components/schemas/Order'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - order
                - server_time
            type: object
        OrderRider:
            description: Null on the order until the rider_accepted stage.
            properties:
                first_name:
                    example: Ravi
                    type: string
            required:
                - first_name
            type: object
        OrderTimer:
            description: The order's timer, set only by the server. The countdown ends at timer_started_at + timer_duration_s, corrected for phone clock offset.
            properties:
                timer_duration_s:
                    description: The length this order was fixed with. Null until the timer starts.
                    example: 90
                    minimum: 1
                    type:
                        - integer
                        - "null"
                timer_missed:
                    description: Becomes true, once, if the timer ended before the rider reached the arrival perimeter.
                    example: false
                    type: boolean
                timer_started_at:
                    description: Null until the timer starts, and stays null if no timer runs.
                    format: date-time
                    type:
                        - string
                        - "null"
                timer_stopped_at:
                    description: Set when the rider enters the arrival perimeter.
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - timer_started_at
                - timer_duration_s
                - timer_stopped_at
                - timer_missed
            type: object
        OtpRequestResult:
            properties:
                expires_in_s:
                    example: 300
                    minimum: 1
                    type: integer
                request_id:
                    type: string
                resend_after_s:
                    description: Seconds before a new code can be requested.
                    example: 30
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - request_id
                - expires_in_s
                - resend_after_s
                - server_time
            type: object
        PaymentRequest:
            description: What the app needs to open Razorpay checkout.
            properties:
                amount:
                    $ref: '#/components/schemas/Money'
                razorpay_key_id:
                    description: Razorpay's public key ID. Not a secret.
                    type: string
                razorpay_order_id:
                    type: string
            required:
                - razorpay_key_id
                - razorpay_order_id
                - amount
            type: object
        PaymentStatus:
            description: Only the server sets this, from the Razorpay webhook. Payment is charged up front. not_paid means the order ended with no payment. refunded means money taken was returned.
            enum:
                - pending
                - paid
                - failed
                - not_paid
                - refunded
            type: string
        Refund:
            properties:
                amount:
                    $ref: '#/components/schemas/Money'
                expected_by:
                    format: date-time
                    type:
                        - string
                        - "null"
                method:
                    description: How. Open list, currently original_payment_method.
                    example: original_payment_method
                    type: string
                reason_code:
                    description: Why, for the copy deck's wording. Open list. See Reason codes for refunds in contracts/README.md.
                    example: no_rider_found
                    type: string
                status:
                    enum:
                        - pending
                        - processed
                        - failed
                    type: string
            required:
                - reason_code
                - method
                - status
                - amount
                - expected_by
            type: object
        RefundResponse:
            properties:
                refund:
                    $ref: '#/components/schemas/Refund'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - refund
                - server_time
            type: object
        Remedy:
            properties:
                amount:
                    oneOf:
                        - $ref: '#/components/schemas/Money'
                        - type: "null"
                type:
                    description: Open list, including credit, refund, replacement.
                    example: credit
                    type: string
            required:
                - type
                - amount
            type: object
        ServerTime:
            description: Current server time in UTC. Clients use it to measure phone clock offset.
            example: "2026-11-04T10:15:30.250Z"
            format: date-time
            type: string
        Ticket:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                messages:
                    items:
                        $ref: '#/components/schemas/TicketMessage'
                    type: array
                order_id:
                    type:
                        - string
                        - "null"
                status:
                    enum:
                        - open
                        - resolved
                    type: string
            required:
                - id
                - status
                - messages
            type: object
        TicketMessage:
            properties:
                from:
                    enum:
                        - customer
                        - support
                    type: string
                sent_at:
                    format: date-time
                    type: string
                text:
                    type: string
            required:
                - from
                - text
                - sent_at
            type: object
        TicketResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                ticket:
                    $ref: '#/components/schemas/Ticket'
            required:
                - ticket
                - server_time
            type: object
        TokenPair:
            description: Sign-in responses add the signed-in user's ID to these fields.
            properties:
                access_token:
                    type: string
                expires_in_s:
                    description: Access token lifetime in seconds.
                    example: 900
                    minimum: 1
                    type: integer
                refresh_token:
                    description: Single use. Each refresh returns a new one. See contracts/README.md.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - server_time
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: Short-lived access token from the sign-in endpoints.
            scheme: bearer
            type: http
info:
    contact:
        name: Ninzo backend
    description: The API behind the customer app. The shared rules are in contracts/README.md. Field names are final only after the contract review.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Ninzo customer API
    version: 0.1.0
openapi: 3.1.0
paths:
    /auth/google:
        post:
            description: 'The app gets an ID token from Google, requested for Ninzo''s Google web client ID, and sends it here. That ID is in the shared Doc once created. The server checks the token''s audience against it. The first sign-in creates the account. Check phone_verified in the reply, because a phone must be verified before anything but viewing the menu. Errors: invalid_google_token (401). A blocked person gets account_blocked (403).'
            operationId: signInWithGoogle
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                id_token:
                                    description: The ID token from Google. It is checked on the server.
                                    type: string
                            required:
                                - id_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerSession'
                    description: Signed in.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Sign in with Google
            tags:
                - auth
    /auth/otp/request:
        post:
            description: 'Indian mobile numbers only for now. Errors: invalid_request for a bad phone number, otp_resend_limit (429) when the resend limit is reached.'
            operationId: requestOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                phone:
                                    description: In E.164 format.
                                    example: "+919876543210"
                                    pattern: ^\+91[6-9][0-9]{9}$
                                    type: string
                            required:
                                - phone
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OtpRequestResult'
                    description: The code was sent.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Send a sign-in code
            tags:
                - auth
    /auth/otp/verify:
        post:
            description: 'Errors: invalid_otp and otp_expired (both 400), otp_attempts_exceeded (429). A blocked person gets account_blocked (403). A customer who signed up another way gets sign_in_method_mismatch (409), with sign_in_method saying which. The code is not used up, so the app can offer to switch and, if they agree, send the same code with switch_to_phone true. Switching keeps the account, removes the Google account from it, and ends every other session.'
            operationId: verifyOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                otp:
                                    example: "123456"
                                    pattern: ^[0-9]{4,8}$
                                    type: string
                                request_id:
                                    type: string
                                switch_to_phone:
                                    description: Log in by phone from now on. Send only after the customer agrees.
                                    type: boolean
                            required:
                                - request_id
                                - otp
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerSession'
                    description: Signed in.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Sign in with the code
            tags:
                - auth
    /auth/refresh:
        post:
            description: Send only one refresh at a time. See Sign-in in contracts/README.md.
            operationId: refreshToken
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenPair'
                    description: A new pair.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Get a new token pair
            tags:
                - auth
    /auth/signout:
        post:
            description: Ends this device's session, so its refresh token stops working. An access token already issued can work for up to 15 minutes more. Other devices stay signed in.
            operationId: signOut
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Signed out. Doing it twice is fine.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Sign out on this device
            tags:
                - auth
    /availability:
        get:
            description: 'Returns only items truly in reach, with the most one scooter can deliver: on a scooter whose rider is on shift, within reach under the zone''s settings, and on sale at this hour. Send gate_id for a saved gate, or lat and lng for a pin, which needs no saved gate and no verified phone (decision 0011). Not both. A gate of another customer gets 404. An ended session gets 401. unavailable_reason is one of out_of_service_area, zone_off, gate_not_verified, no_coverage and sold_out, and the list can grow.'
            operationId: getAvailability
            parameters:
                - description: A saved gate.
                  in: query
                  name: gate_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
                - description: With lng, a pin instead of a gate.
                  in: query
                  name: lat
                  required: false
                  schema:
                    maximum: 90
                    minimum: -90
                    type: number
                - in: query
                  name: lng
                  required: false
                  schema:
                    maximum: 180
                    minimum: -180
                    type: number
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Availability'
                    description: What is in reach. Items is empty when no offer is available.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: See what is in reach of a gate or a pin
            tags:
                - menu
