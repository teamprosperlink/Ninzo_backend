                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Accept a longer ETA
            tags:
                - orders
    /orders/{order_id}/call:
        post:
            description: Available from the rider_accepted stage. Otherwise rejected with call_not_available (409). Priority P2.
            operationId: startMaskedCall
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MaskedCall'
                    description: The number to call.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Call the rider through a masked number
            tags:
                - orders
    /orders/{order_id}/cancel:
        post:
            description: Allowed before payment is confirmed, for 5 seconds after (cancel_until), at no_scooter, and once wait_deadline has passed and before the timer starts. Otherwise rejected with cancel_not_allowed (409), with no refund. Cancelling an order already cancelled returns it, unchanged. The reason is not kept. Order.cancellable says which applies now. See Cancels and refunds in contracts/README.md.
            operationId: cancelOrder
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                reason:
                                    maxLength: 200
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: Cancelled.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Cancel an order
            tags:
                - orders
    /orders/{order_id}/gate:
        patch:
            description: 'Allowed only at the payment stage. After payment the address cannot change. The customer can only cancel within the 5-second window. Returns the payment to complete. The stock is held again on one scooter that reaches the new gate; if none can, nothing changes. Another customer''s gate gets 404. Errors: gate_change_not_allowed, gate_not_verified, no_offer, sold_out (all 409).'
            operationId: changeOrderGate
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                gate_id:
                                    $ref: '#/components/schemas/Id'
                            required:
                                - gate_id
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateOrderResult'
                    description: Changed.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change the gate before paying
            tags:
                - orders
    /orders/{order_id}/payment/retry:
        post:
            description: Allowed at the payment_failed stage. Errors, both 409, payment_retry_not_allowed at any other stage, and sold_out if the stock has gone. To resume after the app was closed during checkout, use payment_request on the order.
            operationId: retryPayment
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateOrderResult'
                    description: A new payment to complete.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Try payment again
            tags:
                - orders
    /orders/{order_id}/refund:
        get:
            description: Says why and how the customer is refunded. 404 if the order has no refund.
            operationId: getOrderRefund
            parameters:
                - $ref: '#/components/parameters/OrderId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundResponse'
                    description: The refund.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get an order's refund status
            tags:
                - support
    /support/tickets:
        post:
            description: 'For example, missing or cold food. Needs a verified phone. Errors: phone_required (409).'
            operationId: createTicket
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                order_id:
                                    $ref: '#/components/schemas/Id'
                                text:
                                    maxLength: 2000
                                    minLength: 1
                                    type: string
                                type:
                                    enum:
                                        - missing_item
                                        - cold_food
                                        - wrong_item
                                        - payment
                                        - other
                                    type: string
                            required:
                                - type
                                - text
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketResponse'
                    description: Created.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Report a problem
            tags:
                - support
    /support/tickets/{ticket_id}:
        get:
            description: Returns the ticket and its messages.
            operationId: getTicket
            parameters:
                - description: The ticket.
                  in: path
                  name: ticket_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TicketResponse'
                    description: The ticket.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get a ticket
            tags:
                - support
    /test/payments/{order_id}:
        post:
            description: 'Stands in for Razorpay until it is connected (decision 0013). It does what Razorpay''s webhook will: paid moves the order to looking_for_rider, with the 5-second cancel window, and failed moves it to payment_failed. A repeat changes nothing. Production does not have this endpoint. Only the customer who placed the order can use it.'
            operationId: confirmTestPayment
            parameters:
                - $ref: '#/components/parameters/OrderId'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                result:
                                    enum:
                                        - paid
                                        - failed
                                    type: string
                            required:
                                - result
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: The order after the result.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Mark a test payment paid or failed, on staging only
            tags:
                - orders
    /webhooks/razorpay:
        post:
            description: Called by Razorpay, not by the app. Verified by signature, and deduplicated by Razorpay's event ID.
            operationId: razorpayWebhook
            parameters:
                - description: Signature of the raw request body, as lowercase hex.
                  in: header
                  name: X-Razorpay-Signature
                  required: true
                  schema:
                    minLength: 1
                    pattern: ^[0-9a-f]+$
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            description: Defined by Razorpay.
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Received.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "500":
                    $ref: '#/components/responses/InternalError'
            security: []
            summary: Receive a Razorpay event
            tags:
                - webhooks
security:
    - bearerAuth: []
servers:
    - description: Placeholder. Real URLs are published with the mock server.
      url: https://customer-api.example.invalid/v1
tags:
    - description: Sign-in and tokens.
      name: auth
    - description: The customer's profile and devices.
      name: profile
    - description: The customer's saved delivery gates.
      name: gates
    - description: Items and what is in reach.
      name: menu
    - description: Creating and following orders.
      name: orders
    - description: Help and refund status.
      name: support
    - description: Called by payment providers, not by the app.
      name: webhooks
