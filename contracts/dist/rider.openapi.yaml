                - shift
    /riders/me/shifts/break:
        post:
            description: 'Alias for the rider app (Issue 235). startBreak at /riders/me/breaks/start is our own form, without a length. A rider on a break gets no offers until it ends. length_s counts from the break''s start, so sending a longer one extends the break under way. The break never lasts longer than the console''s max_break_s: a length_s above it is not an error, the break simply ends at max_break_s, and break_ends_at on the shift (and break.ends_at) says when. The shift''s break is sent in both forms, break_started_at and break_ends_at, and break with started_at and ends_at. Errors, all 409: no_open_shift, order_in_progress, offer_open. A rider already on a break is not an error here, the break is extended. A break start, extension or end raises the rider seq. Direct only.'
            operationId: takeBreak
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            example:
                                length_s: 900
                            properties:
                                length_s:
                                    description: How long the rider asks to rest, in seconds. The break is capped by max_break_s.
                                    maximum: 3600
                                    minimum: 60
                                    type: integer
                            required:
                                - length_s
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShiftResponse'
                    description: On a break.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Alias. Take a break of a length the rider picks, or make the current one longer
            tags:
                - shift
    /riders/me/shifts/break/end:
