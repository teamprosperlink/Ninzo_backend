    /riders/me/stock/{lot_id}/quarantine:
        post:
            description: 'For the rider app''s prompt after a temperature alert, or food the rider finds damaged (Issue 235). The lot leaves the scooter''s stock and can never be scanned again. Errors, all 409: no_open_shift, lot_not_on_scooter, lot_reserved (part of it is held for an order). With lot_reserved the lot is still quarantined and the units no order holds are taken out of sale and off the scooter at once; the units an order holds stay with that order, so that order is not broken. If those held units are bad, the rider reports a problem on that order. Asking again changes nothing while the order holds them, and takes out what the order gives back. A lot already quarantined by this rider answers 200 again, wherever the lot is now. A lot of another rider''s scooter, on no scooter, or that does not exist gets 404.'
