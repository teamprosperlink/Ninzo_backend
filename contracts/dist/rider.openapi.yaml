    /riders/me/shifts/start:
        post:
            description: 'A suspended rider gets 403. Errors, all 409: rider_not_approved, rider_not_verified, shift_already_open, shift_limit_reached, no_scooter_at_node. A free scooter waiting at the node becomes the rider''s for the shift. A node outside the rider''s zone gets 404. device_id must be one this rider registered with registerRiderDevice, or the call gets 400 unknown_device. A rider whose open shift shows another device (a reinstall, or a new phone) sends take_over: true: the open shift of this rider then gets the new device_id and is returned (200) instead of shift_already_open. take_over needs device_id. endShift works from any of the rider''s phones.'
            operationId: startShift
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                checklist:
                                    description: The Before you start items the rider ticked, each once (a repeated or empty code is 400 invalid_request). Kept with the shift. The rider app (Issue 235) sends it. Only codes listed in the checklist of getRiderSettings are stored; any other code is ignored, not an error. It is stored only when the shift is started by this call. When the reply is a take_over or a 409 shift_already_open, the checklist is not stored.
                                    items:
                                        minLength: 1
                                        type: string
                                    maxItems: 20
                                    type: array
                                device_id:
                                    $ref: '#/components/schemas/Id'
                                    description: The id from registerRiderDevice for this phone, which must be one this rider registered (400 unknown_device otherwise). It is kept on the shift, so the app can tell when the shift is open on another phone.
                                node_id:
                                    $ref: '#/components/schemas/Id'
                                take_over:
                                    default: false
                                    description: Send true to move this rider's open shift to this phone. The shift gets the new device_id and is returned instead of shift_already_open. Needs device_id.
                                    type: boolean
                            required:
                                - node_id
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShiftResponse'
                    description: Started.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Start a shift
            tags:
                - shift
