# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
components:
    headers:
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                minimum: 0
                type: integer
    parameters:
        Cursor:
            description: Value of next_cursor from the previous page. Treat it as opaque.
            in: query
            name: cursor
            required: false
            schema:
                type: string
        IdempotencyKey:
            description: Unique per intended action. Send the same key when retrying. Kept for 24 hours, per signed-in user, method and exact path.
            example: 7f3c1e9a-2b4d-4c8e-9a10-5d6e7f8a9b0c
            in: header
            name: Idempotency-Key
            required: true
            schema:
                maxLength: 128
                minLength: 8
                pattern: ^[A-Za-z0-9_-]+$
                type: string
        Limit:
            description: Page size.
            in: query
            name: limit
            required: false
            schema:
                default: 20
                maximum: 100
                minimum: 1
                type: integer
        LotId:
            description: The lot, as getStock lists it.
            in: path
            name: lot_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        OfferId:
            description: The offer.
            in: path
            name: offer_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        OrderId:
            description: The order.
            in: path
            name: order_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        RestockRequestId:
            description: The restock request or suggestion.
            in: path
            name: request_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
        ShiftId:
            description: The shift.
            in: path
            name: shift_id
            required: true
            schema:
                $ref: '#/components/schemas/Id'
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The request is invalid, or a required Idempotency-Key is missing.
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The action no longer fits the current state, or the same Idempotency-Key is still being processed. In that second case, retryable is true and Retry-After is set.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The caller lacks a permission, named in missing_permission.
        IdempotencyKeyReused:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: This Idempotency-Key was already used with a different request body.
        InternalError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: An unexpected server error.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The resource does not exist, or the caller cannot see it.
        ServiceUnavailable:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: A dependency is down. Retry later.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        TooManyRequests:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Rate limited.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The token is missing, invalid or expired.
    schemas:
        DeviceResponse:
            properties:
                device_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - device_id
                - server_time
            type: object
        DocumentKind:
            description: The names the rider app sends. They are not the names verification lists, so the server maps them.
            enum:
                - aadhaar
                - drivingLicence
                - vehicleRc
                - selfie
                - bank
            type: string
        DocumentSide:
            enum:
                - front
                - back
                - photo
            type: string
        Done:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - server_time
            type: object
        Earnings:
            properties:
                date:
                    format: date
                    type: string
                incentives:
                    $ref: '#/components/schemas/Money'
                order_earnings:
                    items:
                        $ref: '#/components/schemas/OrderEarning'
                    type: array
                orders:
                    description: How many orders.
                    minimum: 0
                    type: integer
                repositioning:
                    $ref: '#/components/schemas/Money'
                    description: Pay for repositioning time. total is the order earnings, incentives and this.
                repositioning_seconds:
                    description: Repositioning is paid time.
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                total:
                    $ref: '#/components/schemas/Money'
            required:
                - date
                - orders
                - order_earnings
                - incentives
                - total
                - repositioning
                - repositioning_seconds
                - server_time
            type: object
        Error:
            description: The one error shape, used by every endpoint.
            properties:
                code:
                    description: 'Stable code for app logic. This is an open list: contracts add codes for their own endpoints. If a client does not know a code, it follows retryable. Shared codes are listed in contracts/README.md.'
                    example: token_expired
                    type: string
                message:
                    description: For developers and logs. App wording comes from the copy deck.
                    example: The access token has expired.
                    type: string
                missing_permission:
                    description: Only on 403. The permission the caller lacks.
                    example: orders.read
                    type: string
                retryable:
                    description: True if the same request may succeed later without changes.
                    example: false
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                sign_in_method:
                    description: Only on sign_in_method_mismatch. How this account signs in.
                    example: google
                    type: string
            required:
                - code
                - message
                - retryable
                - server_time
            type: object
        EtaSource:
            description: Show a time only when this is measured.
            enum:
                - measured
                - placeholder
                - unavailable
            type: string
        EventBatchResult:
            properties:
                accepted_ids:
                    items:
                        type: string
                    type: array
                rejected:
                    items:
                        $ref: '#/components/schemas/RejectedEvent'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - accepted_ids
                - rejected
                - server_time
            type: object
        FeedbackResponse:
            properties:
                feedback_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - feedback_id
                - server_time
            type: object
        GateCheck:
            properties:
                checked:
                    description: False when there is nothing to check against (a typed code, which no gate has). True for a scanned QR. Arrival is by location either way.
                    type: boolean
                matched:
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - checked
                - matched
                - server_time
            type: object
        HandoverEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    description: Unique, and created when the event is queued.
                    maxLength: 128
                    minLength: 8
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                payload:
                    $ref: '#/components/schemas/HandoverEventPayload'
                type:
                    const: handover
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        HandoverEventPayload:
            description: For type handover.
            properties:
                order_id:
                    $ref: '#/components/schemas/Id'
                otp:
                    pattern: ^[0-9]{4,8}$
                    type: string
                quantities:
                    items:
                        $ref: '#/components/schemas/HandoverQuantity'
                    minItems: 1
                    type: array
            required:
                - order_id
                - otp
                - quantities
            type: object
        HandoverQuantity:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                qty:
                    description: Below the ordered quantity means a partial handover.
                    minimum: 0
                    type: integer
            required:
                - item_id
                - qty
            type: object
        HubRef:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                lat:
                    type: number
                lng:
                    type: number
                name:
                    type: string
            required:
                - id
                - name
                - lat
                - lng
            type: object
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        LocationAccepted:
            properties:
                next_ping_s:
                    description: Seconds until the next ping. About 2 to 3 from packed to arrived, and slower otherwise.
                    example: 3
                    minimum: 1
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - next_ping_s
                - server_time
            type: object
        LocationEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    description: Unique, and created when the event is queued.
                    maxLength: 128
                    minLength: 8
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                payload:
                    $ref: '#/components/schemas/LocationEventPayload'
                type:
                    const: location
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        LocationEventPayload:
            description: For type location.
            properties:
                accuracy_m:
                    minimum: 0
                    type: number
                lat:
                    type: number
                lng:
                    type: number
                speed_mps:
                    minimum: 0
                    type: number
            required:
                - lat
                - lng
                - speed_mps
                - accuracy_m
            type: object
        MaskedCall:
            properties:
                expires_at:
                    format: date-time
                    type: string
                phone:
                    description: A masked number, not the customer's own.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - phone
                - expires_at
                - server_time
            type: object
        Money:
            description: An amount in minor units, such as paise. Never a decimal.
            properties:
                amount_minor:
                    example: 14900
                    minimum: 0
                    type: integer
                currency:
                    example: INR
                    pattern: ^[A-Z]{3}$
                    type: string
            required:
                - amount_minor
                - currency
            type: object
        Node:
            properties:
                fullness_pct:
                    maximum: 100
                    minimum: 0
                    type: integer
                hub_distance_m:
                    description: Straight-line metres to the nearest active hub in the zone. Null if the zone has no active hub.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                lat:
                    type: number
                lng:
                    type: number
                name:
                    type: string
            required:
                - id
                - name
                - fullness_pct
                - lat
                - lng
                - hub_distance_m
            type: object
        NodeList:
            properties:
                assigned_node_id:
                    description: The node this rider is told to wait at.
                    type:
                        - string
                        - "null"
                nodes:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
                relocation:
                    description: A suggestion only. It never blocks the screen.
                    oneOf:
                        - $ref: '#/components/schemas/RelocationSuggestion'
                        - type: "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - nodes
                - assigned_node_id
                - relocation
                - server_time
            type: object
        Offer:
            properties:
                expires_at:
                    format: date-time
                    type: string
                fencing_token:
                    description: Fixed for the life of the offer. Send with accept, decline and Ready. A device holding a token from another offer is rejected with stale_fencing_token.
                    type: string
                gate:
                    description: Where the rider is going.
                    properties:
                        entry_notes:
                            type:
                                - string
                                - "null"
                        id:
                            $ref: '#/components/schemas/Id'
                        label:
                            type: string
                        lat:
                            type: number
                        lng:
                            type: number
                    required:
                        - id
                        - label
                        - lat
                        - lng
                        - entry_notes
                    type: object
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/OrderLine'
                    type: array
                order_id:
                    description: Set once accepted.
                    type:
                        - string
                        - "null"
                order_number:
                    description: Readable order number, a letter and four digits such as A2931.
                    pattern: ^[A-Z][0-9]{4}$
                    type: string
                payment_method:
                    $ref: '#/components/schemas/PaymentMethod'
                    description: For the rider app (Issue 235). Always sent.
                state:
                    enum:
                        - open
                        - accepted
                        - declined
                        - expired
                        - taken
                        - cancelled
                    type: string
                total:
                    $ref: '#/components/schemas/Money'
                    description: What the customer paid for the order. For the rider app (Issue 235). Always sent.
            required:
                - id
                - order_id
                - items
                - gate
                - expires_at
                - state
                - fencing_token
                - order_number
                - total
                - payment_method
            type: object
        OfferList:
            properties:
                offers:
                    items:
                        $ref: '#/components/schemas/Offer'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - offers
                - server_time
            type: object
        OfflineEvent:
            description: One queued action. Each type has its own payload.
            discriminator:
                mapping:
                    handover: '#/components/schemas/HandoverEvent'
                    location: '#/components/schemas/LocationEvent'
                    problem: '#/components/schemas/ProblemEvent'
                    restock_confirm: '#/components/schemas/RestockConfirmEvent'
                    restock_decline: '#/components/schemas/RestockDeclineEvent'
                    stock_scan: '#/components/schemas/StockScanEvent'
                propertyName: type
            oneOf:
                - $ref: '#/components/schemas/LocationEvent'
                - $ref: '#/components/schemas/HandoverEvent'
                - $ref: '#/components/schemas/ProblemEvent'
                - $ref: '#/components/schemas/RestockConfirmEvent'
                - $ref: '#/components/schemas/RestockDeclineEvent'
                - $ref: '#/components/schemas/StockScanEvent'
        OrderEarning:
            properties:
                amount:
                    $ref: '#/components/schemas/Money'
                order_id:
                    $ref: '#/components/schemas/Id'
            required:
                - order_id
                - amount
            type: object
        OrderLine:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                qty:
                    minimum: 1
                    type: integer
            required:
                - item_id
                - name
                - qty
            type: object
        OrderResponse:
            properties:
                order:
                    $ref: '#/components/schemas/RiderOrder'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - order
                - server_time
            type: object
        OrderState:
            description: The true order state. Only rider and console contracts expose it. The customer contract must use CustomerStage instead.
            enum:
                - CREATED
                - PAYMENT_PENDING
                - PAYMENT_SECURED
                - OFFERED
                - RIDER_ACCEPTED
                - PACKED
                - TIMER_RUNNING
                - ARRIVED
                - HANDED_OVER
                - COMPLETED
                - CANCELLED
                - PAYMENT_FAILED
                - NO_SCOOTER
                - TIMED_OUT
                - FAILED
            type: string
        OtpRequestResult:
            properties:
                expires_in_s:
                    example: 300
                    minimum: 1
                    type: integer
                request_id:
                    type: string
                resend_after_s:
                    example: 30
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - request_id
                - expires_in_s
                - resend_after_s
                - server_time
            type: object
        PaymentMethod:
            description: 'How the order was paid. A closed list, with prepaid the only value today, so a new value needs a contract change. prepaid: paid online before the order was offered, so the rider collects nothing and the handover takes the customer''s OTP.'
            enum:
                - prepaid
            type: string
        ProblemEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    description: Unique, and created when the event is queued.
                    maxLength: 128
                    minLength: 8
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                payload:
                    $ref: '#/components/schemas/ProblemEventPayload'
                type:
                    const: problem
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        ProblemEventPayload:
            description: For type problem.
            properties:
                note:
                    maxLength: 1000
                    type: string
                order_id:
                    $ref: '#/components/schemas/Id'
                problem_type:
                    enum:
                        - breakdown
                        - accident
                        - gate_closed
                        - customer_absent
                        - unsafe_route
                    type: string
            required:
                - problem_type
            type: object
        ProblemResponse:
            properties:
                report_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - report_id
                - server_time
            type: object
        QuarantineResponse:
            properties:
                lot_id:
                    $ref: '#/components/schemas/Id'
                quarantined_at:
                    format: date-time
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - lot_id
                - quarantined_at
                - server_time
            type: object
        RejectedEvent:
            properties:
                code:
                    description: Open list. See Rider offline events in contracts/README.md.
                    type: string
                id:
                    type: string
                message:
                    type: string
                retryable:
                    type: boolean
            required:
                - id
                - code
                - message
                - retryable
            type: object
        RelocationSuggestion:
            properties:
                expires_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                node_id:
                    $ref: '#/components/schemas/Id'
                orders_waiting:
                    description: Orders expected near the node when this was made. Null for older suggestions.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                reason:
                    description: Short text, such as how many orders are expected.
                    example: 3 orders expected, nobody nearby
                    type: string
            required:
                - id
                - node_id
                - reason
                - expires_at
                - orders_waiting
            type: object
        RestockConfirmEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    description: Unique, and created when the event is queued.
                    maxLength: 128
                    minLength: 8
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                payload:
                    $ref: '#/components/schemas/RestockEventPayload'
                type:
                    const: restock_confirm
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        RestockDeclineEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    description: Unique, and created when the event is queued.
                    maxLength: 128
                    minLength: 8
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                payload:
                    $ref: '#/components/schemas/RestockEventPayload'
                type:
                    const: restock_decline
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        RestockEventPayload:
            description: For types restock_confirm and restock_decline.
            properties:
                quantity_override:
                    items:
                        $ref: '#/components/schemas/RestockLineRequest'
                    type: array
                reason:
                    maxLength: 200
                    type: string
                request_id:
                    $ref: '#/components/schemas/Id'
            required:
                - request_id
            type: object
        RestockLine:
            properties:
                filled_qty:
                    description: Set once the hub has packed. Below qty means a short fill.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    example: Burger
                    type: string
                qty:
                    minimum: 1
                    type: integer
            required:
                - item_id
                - name
                - qty
                - filled_qty
            type: object
        RestockLineRequest:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                qty:
                    maximum: 500
                    minimum: 1
                    type: integer
            required:
                - item_id
                - qty
            type: object
        RestockOption:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
            required:
                - item_id
                - name
            type: object
        RestockOptionHub:
            allOf:
                - $ref: '#/components/schemas/HubRef'
                - properties:
                    manager_phone:
                        description: The hub manager's number, for Call hub manager in the rider app. Null until the hub has one. Always sent.
                        pattern: ^\+[1-9][0-9]{7,14}$
                        type:
                            - string
                            - "null"
                  required:
                    - manager_phone
                  type: object
            description: A hub the rider can order from, with the number for Call hub manager.
        RestockOptions:
            properties:
                hubs:
                    items:
                        $ref: '#/components/schemas/RestockOptionHub'
                    type: array
                items:
                    items:
                        $ref: '#/components/schemas/RestockOption'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - hubs
                - items
                - server_time
            type: object
        RestockRequest:
            properties:
                arrive_by:
                    description: When the rider should arrive.
                    format: date-time
                    type:
                        - string
                        - "null"
                hub:
                    $ref: '#/components/schemas/HubRef'
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/RestockLine'
                    type: array
                lot_numbers:
                    description: The lots in the cassette, set at ready. The rider's scan is checked against these.
                    items:
                        type: string
                    type: array
                ready_in_s:
                    description: Seconds from now to the hub slot, never below 0. Null without a slot.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                shortfall:
                    oneOf:
                        - $ref: '#/components/schemas/RestockShortfall'
                        - type: "null"
                slot_at:
                    description: The hub's queue slot.
                    format: date-time
                    type:
                        - string
                        - "null"
                state:
                    enum:
                        - suggested
                        - confirmed
                        - hub_accepted
                        - packing
                        - ready
                        - picked_up
                        - received
                        - closed
                        - expired
                        - cancelled
                        - partial
                    type: string
            required:
                - id
                - state
                - hub
                - items
                - slot_at
                - arrive_by
                - lot_numbers
                - shortfall
                - ready_in_s
            type: object
        RestockResponse:
            properties:
                request:
                    $ref: '#/components/schemas/RestockRequest'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - request
                - server_time
            type: object
        RestockShortfall:
            description: What the hub could not fill, and what it offers instead.
            properties:
                action:
                    enum:
                        - partial
                        - substitute
                        - other_hub
                    type: string
                other_hub:
                    oneOf:
                        - allOf:
                            - $ref: '#/components/schemas/HubRef'
                            - properties:
                                distance_m:
                                    description: Straight-line metres from the rider's node to this hub. Null if it cannot be worked out.
                                    minimum: 0
                                    type:
                                        - integer
                                        - "null"
                              required:
                                - distance_m
                              type: object
                        - type: "null"
                substitute:
                    oneOf:
                        - $ref: '#/components/schemas/RestockOption'
                        - type: "null"
            required:
                - action
                - substitute
                - other_hub
            type: object
        RestockSuggestion:
            properties:
                expires_at:
                    format: date-time
                    type: string
                hub:
                    $ref: '#/components/schemas/HubRef'
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/RestockLine'
                    type: array
            required:
                - id
                - hub
                - items
                - expires_at
            type: object
        RestockSuggestionList:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                suggestions:
                    items:
                        $ref: '#/components/schemas/RestockSuggestion'
                    type: array
            required:
                - suggestions
                - server_time
            type: object
        Rider:
            properties:
                approved_at:
                    description: When the rider was approved. Null before approval.
                    format: date-time
                    type:
                        - string
                        - "null"
                area:
                    description: Where the rider wants to work, as the rider app sends it while applying. Null when not given. The server keeps the place's name as preferred_area. Always sent.
                    oneOf:
                        - $ref: '#/components/schemas/RiderArea'
                        - type: "null"
                created_at:
                    description: When the account was made.
                    format: date-time
                    type: string
                email:
                    description: Contact only. It never signs anyone in. Null when not given. Always sent.
                    format: email
                    maxLength: 254
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    description: Null until an applicant fills it in.
                    type:
                        - string
                        - "null"
                phone:
                    description: The number the rider signs in with. Left out only if the account has no number.
                    pattern: ^\+[1-9][0-9]{7,14}$
                    type: string
                preferred_area:
                    description: The area the rider says they want to work in, free text up to 80 characters. Null until set. The zone itself is an ops decision.
                    maxLength: 80
                    type:
                        - string
                        - "null"
                rating:
                    $ref: '#/components/schemas/RiderRating'
                    description: How customers rate this rider (Issue 265). Optional until the server builds it in part B, then always sent. It holds only the average and the count, never who rated or which order.
                status:
                    description: Open list, including applicant, active, suspended.
                    type: string
                zone_id:
                    anyOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
                    description: Null until a zone is set.
            required:
                - id
                - name
                - status
                - zone_id
                - created_at
                - approved_at
                - preferred_area
                - email
                - area
            type: object
        RiderArea:
            description: A place the rider picked, such as a town or a junction.
            properties:
                city:
                    maxLength: 80
                    type: string
                lat:
                    maximum: 90
                    minimum: -90
                    type: number
                lng:
                    maximum: 180
                    minimum: -180
                    type: number
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
            required:
                - name
                - city
                - lat
                - lng
            type: object
        RiderChoice:
            properties:
                check:
                    description: Checklist items only. What the app checks itself. manual is the rider's tick, and phone_battery, scooter_battery and location are checked by the app.
                    type: string
                code:
                    type: string
                hint:
                    type: string
                label:
                    type: string
            required:
                - code
                - label
            type: object
        RiderDocumentInfo:
            description: What is known of one uploaded photo. The photo itself is in file storage and is never sent back.
            properties:
                content_type:
                    type: string
                document:
                    $ref: '#/components/schemas/DocumentKind'
                side:
                    $ref: '#/components/schemas/DocumentSide'
                size_bytes:
                    minimum: 1
                    type: integer
                uploaded_at:
                    format: date-time
                    type: string
            required:
                - document
                - side
                - content_type
                - size_bytes
                - uploaded_at
            type: object
        RiderDocumentList:
            properties:
                documents:
                    items:
                        $ref: '#/components/schemas/RiderDocumentInfo'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - documents
                - server_time
            type: object
        RiderDocumentResponse:
            properties:
                document:
                    $ref: '#/components/schemas/RiderDocumentInfo'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - document
                - server_time
            type: object
        RiderHelp:
            properties:
                faq:
                    items:
                        properties:
                            answer:
                                type: string
                            id:
                                $ref: '#/components/schemas/Id'
                            question:
                                type: string
                        required:
                            - id
                            - question
                            - answer
                        type: object
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - faq
                - server_time
            type: object
        RiderNotification:
            properties:
                body:
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    description: Open list, including offer, restock, relocation, shift, support.
                    type: string
                order_id:
                    anyOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
                    description: The order this is about. Null when it is not about an order.
                title:
                    type: string
            required:
                - id
                - kind
                - title
                - body
                - order_id
                - created_at
            type: object
        RiderNotificationList:
            properties:
                next_cursor:
                    description: Pass as cursor to get the next page. Null on the last page.
                    type:
                        - string
                        - "null"
                notifications:
                    items:
                        $ref: '#/components/schemas/RiderNotification'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - notifications
                - next_cursor
                - server_time
            type: object
        RiderOrder:
            description: What the rider sees of an order. It has no countdown fields. The rider sees a calm fixed label, so the clock never pressures the rider.
            properties:
                ended_reason:
                    description: Set when this rider no longer has the order. Open list, including cancelled, reassigned, failed, timed_out.
                    type:
                        - string
                        - "null"
                fencing_token:
                    description: Send with Ready, including after a restart.
                    type: string
                gate:
                    description: Where the rider is going.
                    properties:
                        entry_notes:
                            type:
                                - string
                                - "null"
                        id:
                            $ref: '#/components/schemas/Id'
                        label:
                            type: string
                        lat:
                            type: number
                        lng:
                            type: number
                    required:
                        - id
                        - label
                        - lat
                        - lng
                        - entry_notes
                    type: object
                handed_over_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                items:
                    items:
                        $ref: '#/components/schemas/OrderLine'
                    type: array
                offer_id:
                    $ref: '#/components/schemas/Id'
                order_number:
                    description: Readable order number, a letter and four digits such as A2931.
                    pattern: ^[A-Z][0-9]{4}$
                    type: string
                otp_available:
                    description: True once the customer has the OTP to show. Offline, this value may be stale, so the app must still allow the rider to enter an OTP.
                    type: boolean
                payment_method:
                    $ref: '#/components/schemas/PaymentMethod'
                    description: For the rider app (Issue 235). Always sent.
                rider_accepted_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                seq:
                    description: The rider's current seq when this was read.
                    minimum: 1
                    type: integer
                state:
                    $ref: '#/components/schemas/OrderState'
                timer_label:
                    description: A fixed label built from this order's timer length. It does not count down.
                    example: 1.5 mins
                    type: string
                total:
                    $ref: '#/components/schemas/Money'
                    description: What the customer paid for the order. For the rider app (Issue 235). Always sent.
                waiting_since:
                    description: When the rider said they were waiting at the gate (markWaitingAtGate). Null until then.
                    format: date-time
                    type:
                        - string
                        - "null"
            required:
                - id
                - offer_id
                - fencing_token
                - state
                - seq
                - ended_reason
                - items
                - gate
                - timer_label
                - rider_accepted_at
                - otp_available
                - handed_over_at
                - order_number
                - waiting_since
                - total
                - payment_method
            type: object
        RiderRating:
            properties:
                average:
                    description: The mean of all ratings, to one decimal such as 4.6. Null while count is 0.
                    maximum: 5
                    minimum: 1
                    type:
                        - number
                        - "null"
                count:
                    description: How many ratings the average is from.
                    minimum: 0
                    type: integer
            required:
                - average
                - count
            type: object
        RiderResponse:
            properties:
                rider:
                    $ref: '#/components/schemas/Rider'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - rider
                - server_time
            type: object
        RiderSession:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    example: 900
                    minimum: 1
                    type: integer
                refresh_token:
                    type: string
                rider_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                status:
                    description: Open list, including applicant and active. A suspended rider gets account_blocked instead of a session. An applicant can only apply and see progress.
                    type: string
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - rider_id
                - status
                - server_time
            type: object
        RiderSettings:
            description: What the rider app works by, from the rider's zone settings in the console. Null where the zone has no value.
            properties:
                add_time_options_s:
                    items:
                        type: integer
                    type: array
                almost_there_m:
                    type:
                        - integer
                        - "null"
                arrive_m:
                    description: How close to the hub, the spot or the gate counts as there.
                    type:
                        - integer
                        - "null"
                away_from_spot_m:
                    type:
                        - integer
                        - "null"
                break_extension_s:
                    description: What "+15 min" adds to a break.
                    type: integer
                break_options_s:
                    items:
                        type: integer
                    type: array
                cancel_pay_cap:
                    $ref: '#/components/schemas/Money'
                    description: The most a cancelled prepaid order pays for the trip. Under it, the order's price. It is paid only when the rider had already started moving toward the gate.
                checklist:
                    description: The Before you start items. Each code can be sent in startShift checklist.
                    items:
                        $ref: '#/components/schemas/RiderChoice'
                    type: array
                handover_code_length:
                    description: Digits in the customer's handover code.
                    type: integer
                low_scooter_battery_pct:
                    type:
                        - integer
                        - "null"
                low_stock_qty:
                    description: Fewer portions of an item than this suggests a refill.
                    type:
                        - integer
                        - "null"
                max_break_s:
                    description: The console's longest break. No break option is longer, and takeBreak is capped by it.
                    type:
                        - integer
                        - "null"
                min_phone_battery_pct:
                    type:
                        - integer
                        - "null"
                min_scooter_battery_pct:
                    type:
                        - integer
                        - "null"
                not_at_gate_after_s:
                    description: How long the handover's code step waits, empty, before offering "Customer not at the gate?".
                    type: integer
                problem_types:
                    description: Each code must be one of the reportProblem type values (breakdown, accident, gate_closed, customer_absent, unsafe_route), because the app sends the code straight into reportProblem. The settings never offer any other.
                    items:
                        $ref: '#/components/schemas/RiderChoice'
                    type: array
                ride_speed_kmh:
                    description: The straight-line speed used for ride times, until real road times.
                    type:
                        - integer
                        - "null"
                scooter_capacity_qty:
                    type:
                        - integer
                        - "null"
                shift_ending_soon_before_s:
                    type: integer
                skip_reasons:
                    items:
                        $ref: '#/components/schemas/RiderChoice'
                    type: array
                stock_request_ask_before_s:
                    description: How long before the planned start the app asks if the rider is coming.
                    type: integer
                stock_request_reminder_before_s:
                    description: When a rider who has not answered is reminded.
                    type: integer
                timer_length_s:
                    description: The console's timer length, 90 seconds by default. The rider never sees a countdown, only a fixed label.
                    type:
                        - integer
                        - "null"
                verification_within_s:
                    description: How soon operations usually check a rider's documents.
                    type: integer
            required:
                - stock_request_ask_before_s
                - stock_request_reminder_before_s
                - shift_ending_soon_before_s
                - break_extension_s
                - not_at_gate_after_s
                - handover_code_length
                - cancel_pay_cap
                - verification_within_s
                - timer_length_s
                - max_break_s
                - arrive_m
                - almost_there_m
                - away_from_spot_m
                - low_stock_qty
                - scooter_capacity_qty
                - min_phone_battery_pct
                - min_scooter_battery_pct
                - low_scooter_battery_pct
                - ride_speed_kmh
                - break_options_s
                - add_time_options_s
                - skip_reasons
                - problem_types
                - checklist
            type: object
        RiderSettingsResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                settings:
                    $ref: '#/components/schemas/RiderSettings'
            required:
                - settings
                - server_time
            type: object
        RiderState:
            description: Everything current for this rider. seq is compared with seq on the rider stream.
            properties:
                current_order:
                    oneOf:
                        - $ref: '#/components/schemas/RiderOrder'
                        - type: "null"
                offers:
                    items:
                        $ref: '#/components/schemas/Offer'
                    type: array
                restock_request:
                    oneOf:
                        - $ref: '#/components/schemas/RestockRequest'
                        - type: "null"
                seq:
                    example: 7
                    minimum: 1
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                shift:
                    oneOf:
                        - $ref: '#/components/schemas/Shift'
                        - type: "null"
            required:
                - seq
                - shift
                - offers
                - current_order
                - restock_request
                - server_time
            type: object
        RouteResponse:
            properties:
                eta_s:
                    description: Set only when eta_source is measured.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                eta_source:
                    $ref: '#/components/schemas/EtaSource'
                polyline:
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - polyline
                - eta_source
                - eta_s
                - server_time
            type: object
        ServerTime:
            description: Current server time in UTC. Clients use it to measure phone clock offset.
            example: "2026-11-04T10:15:30.250Z"
            format: date-time
            type: string
        Shift:
            properties:
                break:
                    description: The break under way as the rider app reads it, the same facts as break_started_at and break_ends_at. Null when the rider is not on a break. Always sent.
                    oneOf:
                        - properties:
                            ends_at:
                                format: date-time
                                type: string
                            started_at:
                                format: date-time
                                type: string
                          required:
                            - started_at
                            - ends_at
                          type: object
                        - type: "null"
                break_ends_at:
                    description: When the current break ends on its own, at the console's longest break (max_break_s). Null when the rider is not on a break.
                    format: date-time
                    type:
                        - string
                        - "null"
                break_started_at:
                    description: When the current break began. Null when the rider is not on a break.
                    format: date-time
                    type:
                        - string
                        - "null"
                device_id:
                    anyOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
                    description: The device the shift was started from. Null if startShift did not send one. The app compares it with its own device id.
                ended_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                node_assigned_at:
                    description: When the rider was given this node. This is the shift start, or when the rider accepted the last move in the shift (the node changes at accept).
                    format: date-time
                    type: string
                node_id:
                    $ref: '#/components/schemas/Id'
                online_at:
                    description: When the rider went online at their spot (goOnline). Null before. Always sent.
                    format: date-time
                    type:
                        - string
                        - "null"
                planned_end_at:
                    description: When the rider said the shift would end (setPlannedEnd), or the day's plan end. A record only, because shifts are open-ended. Null with none. Always sent.
                    format: date-time
                    type:
                        - string
                        - "null"
                scooter:
                    description: The scooter on this shift.
                    properties:
                        battery_pct:
                            description: Null until scooter data exists.
                            maximum: 100
                            minimum: 0
                            type:
                                - integer
                                - "null"
                        id:
                            $ref: '#/components/schemas/Id'
                        plate:
                            description: The scooter code shown on the vehicle.
                            type: string
                    required:
                        - id
                        - plate
                        - battery_pct
                    type: object
                started_at:
                    format: date-time
                    type: string
            required:
                - id
                - node_id
                - started_at
                - ended_at
                - node_assigned_at
                - scooter
                - break_started_at
                - break_ends_at
                - device_id
                - online_at
                - planned_end_at
                - break
            type: object
        ShiftEntry:
            properties:
                avg_delivery_s:
                    description: The average seconds from accept to handover. Null with no orders. Always sent.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                break_s:
                    minimum: 0
                    type: integer
                ended_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                node_id:
                    $ref: '#/components/schemas/Id'
                online_at:
                    description: When the rider went online at their spot. Null before. For the rider app (Issue 235). Always sent.
                    format: date-time
                    type:
                        - string
                        - "null"
                online_s:
                    description: The shift's length minus its breaks.
                    minimum: 0
                    type: integer
                orders:
                    description: The same count as orders_handed_over, under the name the rider app reads. Always sent.
                    minimum: 0
                    type: integer
                orders_handed_over:
                    minimum: 0
                    type: integer
                planned_end_at:
                    description: The planned end the rider set. A record only. For the rider app (Issue 235). Always sent.
                    format: date-time
                    type:
                        - string
                        - "null"
                portions:
                    description: Portions handed over on this shift. Always sent.
                    minimum: 0
                    type: integer
                started_at:
                    format: date-time
                    type: string
            required:
                - id
                - node_id
                - started_at
                - ended_at
                - online_s
                - break_s
                - orders_handed_over
                - online_at
                - planned_end_at
                - orders
                - portions
                - avg_delivery_s
            type: object
        ShiftList:
            properties:
                next_cursor:
                    description: Pass as cursor to get the next page. Null on the last page.
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                shifts:
                    items:
                        $ref: '#/components/schemas/ShiftEntry'
                    type: array
            required:
                - shifts
                - next_cursor
                - server_time
            type: object
        ShiftPlan:
            description: One day's plan for the rider, made by operations. Shifts are open-ended, so starts_at and ends_at are a guide and nothing starts or ends a shift at them.
            properties:
                date:
                    description: The day, in the zone's local time.
                    format: date
                    type: string
                ends_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                node_id:
                    anyOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
                    description: Where the shift is planned to start. Null if operations have not chosen yet.
                packing:
                    description: 'The hub packing the day''s stock: not_started, packing, then ready.'
                    enum:
                        - not_started
                        - packing
                        - ready
                    type: string
                ready_at:
                    description: When the stock was ready, or when the hub expects it to be while packing. Null before packing.
                    format: date-time
                    type:
                        - string
                        - "null"
                replied_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                starts_at:
                    format: date-time
                    type: string
                stock_reply:
                    description: The rider's answer to the morning stock request. The hub packs only after coming.
                    enum:
                        - pending
                        - coming
                        - not_today
                    type: string
            required:
                - id
                - date
                - node_id
                - starts_at
                - ends_at
                - stock_reply
                - replied_at
                - packing
                - ready_at
            type: object
        ShiftPlanResponse:
            properties:
                plan:
                    description: Null on a day with no plan, which is the usual day.
                    oneOf:
                        - $ref: '#/components/schemas/ShiftPlan'
                        - type: "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - plan
                - server_time
            type: object
        ShiftResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                shift:
                    $ref: '#/components/schemas/Shift'
            required:
                - shift
                - server_time
            type: object
        ShiftSummary:
            properties:
                avg_delivery_s:
                    description: Average seconds from accept to handover. Null with no order handed over.
                    minimum: 0
                    type:
                        - integer
                        - "null"
                break_s:
                    minimum: 0
                    type: integer
                earnings:
                    $ref: '#/components/schemas/Money'
                ended_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                items_returned:
                    description: Units that went back to the hub at shift end.
                    items:
                        $ref: '#/components/schemas/OrderLine'
                    type: array
                items_sold:
                    items:
                        $ref: '#/components/schemas/OrderLine'
                    type: array
                online_s:
                    minimum: 0
                    type: integer
                orders_handed_over:
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                shift_id:
                    $ref: '#/components/schemas/Id'
                started_at:
                    format: date-time
                    type: string
            required:
                - shift_id
                - started_at
                - ended_at
                - online_s
                - break_s
                - orders_handed_over
                - avg_delivery_s
                - items_sold
                - items_returned
                - earnings
                - server_time
            type: object
        StockCountLine:
            properties:
                counted:
                    minimum: 0
                    type: integer
                expected:
                    description: What the server expects on the scooter.
                    minimum: 0
                    type: integer
                item_id:
                    $ref: '#/components/schemas/Id'
            required:
                - item_id
                - expected
                - counted
            type: object
        StockCountResponse:
            properties:
                counted:
                    items:
                        $ref: '#/components/schemas/StockCountLine'
                    type: array
                mismatches:
                    description: How many lines differ from what was expected.
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - counted
                - mismatches
                - server_time
            type: object
        StockList:
            properties:
                lots:
                    items:
                        $ref: '#/components/schemas/StockLot'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - lots
                - server_time
            type: object
        StockLot:
            properties:
                expiry:
                    format: date-time
                    type: string
                image_url:
                    description: The menu item photo. Null when the item has none.
                    type:
                        - string
                        - "null"
                item_id:
                    $ref: '#/components/schemas/Id'
                lot_id:
                    $ref: '#/components/schemas/Id'
                qty:
                    minimum: 0
                    type: integer
                temp_status:
                    $ref: '#/components/schemas/TempStatus'
            required:
                - lot_id
                - item_id
                - qty
                - expiry
                - temp_status
                - image_url
            type: object
        StockScanEvent:
            properties:
                device_time:
                    format: date-time
                    type: string
                event_id:
                    description: Unique, and created when the event is queued.
                    maxLength: 128
                    minLength: 8
                    pattern: ^[A-Za-z0-9_-]+$
                    type: string
                payload:
                    $ref: '#/components/schemas/StockScanEventPayload'
                type:
                    const: stock_scan
                    type: string
            required:
                - event_id
                - type
                - payload
                - device_time
            type: object
        StockScanEventPayload:
            description: For type stock_scan.
            properties:
                lot_code:
                    type: string
            required:
                - lot_code
            type: object
        StockUnit:
            properties:
                expiry:
                    format: date-time
                    type: string
                item_id:
                    $ref: '#/components/schemas/Id'
                lot_id:
                    $ref: '#/components/schemas/Id'
                temp_status:
                    $ref: '#/components/schemas/TempStatus'
            required:
                - lot_id
                - item_id
                - expiry
                - temp_status
            type: object
        StockUnitResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                unit:
                    $ref: '#/components/schemas/StockUnit'
            required:
                - unit
                - server_time
            type: object
        TempStatus:
            enum:
                - ok
                - alert
            type: string
        TokenPair:
            description: Sign-in responses add the signed-in user's ID to these fields.
            properties:
                access_token:
                    type: string
                expires_in_s:
                    description: Access token lifetime in seconds.
                    example: 900
                    minimum: 1
                    type: integer
                refresh_token:
                    description: Single use. Each refresh returns a new one. See contracts/README.md.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - server_time
            type: object
        VerificationDocument:
            properties:
                reason:
                    description: Open list, including name_mismatch, photo_retake, expired, unreadable, other. Null unless rejected.
                    type:
                        - string
                        - "null"
                status:
                    enum:
                        - pending
                        - verified
                        - rejected
                    type: string
                type:
                    description: Open list, including aadhaar, driving_licence, rc, insurance, photo.
                    type: string
            required:
                - type
                - status
                - reason
            type: object
        VerificationResponse:
            properties:
                documents:
                    description: The status of each document, with the reason for a rejection. Empty until documents are recorded.
                    items:
                        $ref: '#/components/schemas/VerificationDocument'
                    type: array
                reason:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                status:
                    enum:
                        - pending
                        - verified
                        - failed
                        - expired
                    type: string
            required:
                - status
                - reason
                - documents
                - server_time
            type: object
        VerificationStart:
            properties:
                redirect_url:
                    format: uri
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                upload_url:
                    format: uri
                    type:
                        - string
                        - "null"
            required:
                - redirect_url
                - upload_url
                - server_time
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: Short-lived access token from the sign-in endpoints.
            scheme: bearer
            type: http
info:
    contact:
        name: Ninzo backend
    description: |-
        The API behind the rider app. The shared rules are in contracts/README.md. Field names are final only after the contract review. Until the partner API exists, hub actions come from a simulator.

        The finished rider APK was built against a copy of this API (Issue 235), so this contract also holds every call the APK makes, with its paths, its request fields and the fields it reads. Our own operations stay as they were. Where the APK uses another path for something we already do, the APK's path is a second operation marked "Alias" in its summary. Where both use one path, the operation accepts both shapes and the reply carries both sets of fields. Fields added for the APK are optional until the server sends them (part B of Issue 235). These owner rules hold while the APK is served.

        Shifts are open-ended. A shift plan exists only when operations create one, otherwise getShiftPlan returns plan null, and an answer to a plan is accepted and recorded. A planned end or added time (setPlannedEnd) is accepted and recorded, and nothing forces the shift to end at it. A break length the rider picks (takeBreak) is capped by the console's max_break_s. Help articles come from the backend and are edited in the console. The gate code check (checkGate) is accepted, but arrival is still decided by the rider's location. Masked calls stay call_not_available until a provider is chosen, and the provider's call bridge (with a key in its URL) is not part of this contract. Scooter telemetry is signed with a key of its own for each scooter, never one shared key. Document photos go to file storage (Supabase Storage), never into a database column, and the contract shape stays the one the APK sends. After wrong sign-in codes the APK is told otp_attempts_exceeded with Retry-After. That pause counts wrong codes against one sign-in request (request_id), never against a phone number, so a stranger's wrong codes cannot block the number's owner from verifying a code of their own request. The separate resend limit on requestOtp (otp_resend_limit) is counted per phone number and still exists, so someone can slow down code requests for a number, and the server must keep that limit generous and also count requests per caller. A cancelled order pays the rider only when the rider had already started moving toward the gate.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Ninzo rider API
    version: 0.1.0
openapi: 3.1.0
paths:
    /auth/otp/request:
        post:
            description: 'Indian mobile numbers only for now. The reply is the same whether or not the account exists, and no SMS is sent if it does not. Later errors on that request_id behave the same either way. Errors: invalid_phone (400) for a phone that is not an Indian mobile number in E.164 form, which the rider app shows as its invalid number screen (Issue 235, the customer contract keeps invalid_request for this), invalid_request (400) for a missing phone or a body that is not JSON, otp_resend_limit (429) when the resend limit is reached.'
            operationId: requestOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                phone:
                                    description: In E.164 format.
                                    example: "+919876543210"
                                    pattern: ^\+91[6-9][0-9]{9}$
                                    type: string
                            required:
                                - phone
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OtpRequestResult'
                    description: The code was sent.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Send a sign-in code
            tags:
                - auth
    /auth/otp/verify:
        post:
            description: 'Errors: invalid_otp and otp_expired (both 400), otp_attempts_exceeded (429). After a correct code, a blocked person or suspended rider gets account_blocked (403). The rider app (Issue 235) reads the error code and the Retry-After header of a 429 and shows the pause. The pause after wrong codes counts against this request_id only. A stranger who sends wrong codes can spoil the request they hold, but not the requests of the number''s owner. It does not stop the per-phone resend limit of requestOtp, which is a separate limit.'
            operationId: verifyOtp
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                otp:
                                    example: "123456"
                                    pattern: ^[0-9]{4,8}$
                                    type: string
                                request_id:
                                    type: string
                            required:
                                - request_id
                                - otp
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RiderSession'
                    description: Signed in.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Sign in with the code
            tags:
                - auth
    /auth/refresh:
        post:
            description: Send only one refresh at a time. See Sign-in in contracts/README.md.
            operationId: refreshToken
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenPair'
                    description: A new pair.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Get a new token pair
            tags:
                - auth
    /auth/signout:
        post:
            description: Ends this device's session, so its refresh token stops working. An access token already issued can work for up to 15 minutes more. Other devices stay signed in.
            operationId: signOut
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Signed out. Doing it twice is fine.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Sign out on this device
            tags:
                - auth
    /nodes:
        get:
            description: Shows how full each node is, and a relocation suggestion if there is one.
            operationId: listNodes
            parameters:
                - description: The zone.
                  in: query
                  name: zone_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NodeList'
                    description: The nodes.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List staging nodes in a zone
            tags:
                - shift
    /offers/{offer_id}/accept:
        post:
            description: 'A repeated accept has no second effect. Errors, all 409: offer_expired, offer_taken, stale_fencing_token.'
            operationId: acceptOffer
            parameters:
                - $ref: '#/components/parameters/OfferId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fencing_token:
                                    type: string
                            required:
                                - fencing_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: Accepted. The rider stops and packs.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Accept an offer
            tags:
                - offers
    /offers/{offer_id}/decline:
        post:
            description: 'There is no penalty. Errors, both 409: offer_expired, stale_fencing_token.'
            operationId: declineOffer
            parameters:
                - $ref: '#/components/parameters/OfferId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fencing_token:
                                    type: string
                                reason:
                                    maxLength: 200
                                    type: string
                            required:
                                - fencing_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Declined.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Decline an offer
            tags:
                - offers
    /offers/{offer_id}/ready:
        post:
            description: 'The server also checks that the rider is stopped. If the order is already packed, including through the packing limit, this succeeds with no change. Errors, all 409: rider_moving, order_cancelled, stale_fencing_token. Pressing Ready does not start the timer by itself.'
            operationId: markReady
            parameters:
                - $ref: '#/components/parameters/OfferId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                fencing_token:
                                    type: string
                            required:
                                - fencing_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: Packed. The rider can ride.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Mark the order packed
            tags:
                - offers
    /orders/{order_id}:
        get:
            description: For an order this rider is or was assigned. If the rider no longer has it, this shows the last state with ended_reason set, and never another rider's progress.
            operationId: getRiderOrder
            parameters:
                - $ref: '#/components/parameters/OrderId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: The order.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get an order this rider is delivering
            tags:
                - delivery
    /orders/{order_id}/call:
        post:
            description: 'Errors: call_not_available (409). Priority P2.'
            operationId: startRiderMaskedCall
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MaskedCall'
                    description: The number to call.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Call the customer through a masked number
            tags:
                - delivery
    /orders/{order_id}/gate-check:
        post:
            description: 'For the rider app (Issue 235). Compares what the rider scanned or typed with the gate. It changes nothing, so it takes no Idempotency-Key. It is accepted and answered, but it never decides arrival. Arrival and the timer''s stop come from the rider''s location alone (decision 0007), so a matched false does not block the handover and a matched true does not mark the rider as arrived. For method qr the value is NZG|<gate id>, compared with the id of the gate the order was placed to: checked is true, and matched is true or false (a value in any other shape is checked true, matched false). For method code, no gate has a typed code, so checked is false and matched is true. The order must be one this rider accepted and still holds, and not finished, or 404.'
            operationId: checkGate
            parameters:
                - $ref: '#/components/parameters/OrderId'
            requestBody:
                content:
                    application/json:
                        schema:
                            example:
                                method: code
                                value: GATE-4821
                            properties:
                                method:
                                    enum:
                                        - qr
                                        - code
                                    type: string
                                value:
                                    maxLength: 64
                                    minLength: 1
                                    type: string
                            required:
                                - method
                                - value
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GateCheck'
                    description: The result.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Check the gate's QR code or code
            tags:
                - delivery
    /orders/{order_id}/handover:
        post:
            description: 'Sends the OTP the customer shows, and the quantities. Recorded once. Queue the event first, and use its event_id as the Idempotency-Key, so the direct and queued paths count as one. A repeat by the same rider after success returns success. Allowed from PACKED, TIMER_RUNNING or ARRIVED, and from RIDER_ACCEPTED once the code was released after a lost signal. Rejected with rider_not_near if the handover is current and fresh GPS shows the rider away from the gate. Errors, all 409: wrong_otp, otp_attempts_exceeded, handover_not_allowed, rider_not_near, order_cancelled, order_reassigned.'
            operationId: handOver
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                client_time:
                                    description: Device time. The server sets the official time.
                                    format: date-time
                                    type: string
                                otp:
                                    pattern: ^[0-9]{4,8}$
                                    type: string
                                quantities:
                                    items:
                                        $ref: '#/components/schemas/HandoverQuantity'
                                    minItems: 1
                                    type: array
                            required:
                                - otp
                                - quantities
                                - client_time
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: Handed over.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Hand over the order
            tags:
                - delivery
    /orders/{order_id}/route:
        get:
            description: Refresh after a road closure. Keep the last route on screen on a weak signal. Until the routing engine, this is a straight line from the rider's last position to the gate, with eta_source placeholder and no eta_s, so keep turn-by-turn directions on the phone.
            operationId: getRoute
            parameters:
                - $ref: '#/components/parameters/OrderId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RouteResponse'
                    description: The route.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            summary: Get the route to the gate
            tags:
                - delivery
    /orders/{order_id}/waiting:
        post:
            description: 'For an order this rider accepted, once the server knows the rider is at the gate: the order is ARRIVED, or the handover code was released after a lost signal (as for handOver). Sets waiting_since on the order, raises the rider seq and the customer order seq, and pushes the customer. Calling it again keeps the first time. Errors, all 409: not_arrived (before the rider is at the gate), order_cancelled, order_reassigned, handover_not_allowed (the order is finished or already handed over). Direct only: it is not in the offline event batch. This does not report arrival.'
            operationId: markWaitingAtGate
            parameters:
                - $ref: '#/components/parameters/OrderId'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                    description: The order, with waiting_since set.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Tell the customer the rider is waiting at the gate
            tags:
                - delivery
    /restock:
        post:
            description: 'For spoiled or damaged units the system cannot see. Duplicates merge into the scooter''s one open request while it is confirmed at the same hub; a manual request replaces a suggestion. A hub not in the rider''s zone, a paused hub, or no open shift is 404. Errors: hub_out_of_stock, restock_already_open (409).'
            operationId: createRestock
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                hub_id:
                                    $ref: '#/components/schemas/Id'
                                items:
                                    items:
                                        $ref: '#/components/schemas/RestockLineRequest'
                                    maxItems: 20
                                    minItems: 1
                                    type: array
                                reason:
                                    maxLength: 200
                                    type: string
                            required:
                                - hub_id
                                - items
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RestockResponse'
                    description: Created.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
