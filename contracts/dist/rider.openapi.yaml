            description: 'For when the scanner fails: records what the rider counted against what the server expects on the scooter. It does not change the stock. Only the lines sent are compared. An item not on the scooter has expected 0. The same item_id twice is 400 invalid_request. mismatches counts the lines where counted differs from expected. Ops see the mismatches. Needs an open shift: no_open_shift (409). Direct only: it is not in the offline event batch.'
            operationId: submitStockCount
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
