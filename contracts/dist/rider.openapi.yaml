            description: Orders handed over, average time from accept to handover, what was sold, what came back to the hub at shift end, and what the shift earned. The shift id comes from startShift or listRiderShifts. A shift that belongs to another rider gets 404. On an open shift the figures count up to now, and items_returned is empty until the shift ends.
