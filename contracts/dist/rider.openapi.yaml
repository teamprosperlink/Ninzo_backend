    /riders/me/shifts:
        get:
            description: The rider's shifts, newest first. online_s is the shift's length minus its breaks, worked out by the server; an open shift is counted to now. from and to are optional dates in the zone's local time and keep only shifts that started in that range. A from after to is 400 invalid_request. The rider app (Issue 235) calls this path as listShifts with days instead, the last days days in India time, today included, from 1 to 31 (the app sends 7). Without days, from, to, cursor and limit work as above. days with from, to, cursor or limit is 400 invalid_request. Each entry also carries online_at, planned_end_at, orders, portions and avg_delivery_s, which the app reads. With days the reply holds every matching shift, at most 1000 (31 days of real shifts never come near that), and next_cursor is null, because the app does not page. A suspended rider can still read this.
            operationId: listRiderShifts
            parameters:
                - description: The rider app's way to ask. How many days back, today included.
                  in: query
                  name: days
                  required: false
                  schema:
                    maximum: 31
                    minimum: 1
                    type: integer
                - description: First day to include, in the zone's local time.
                  in: query
                  name: from
                  required: false
                  schema:
                    format: date
                    type: string
                - description: Last day to include, in the zone's local time.
                  in: query
                  name: to
                  required: false
                  schema:
                    format: date
                    type: string
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShiftList'
                    description: One page, newest first.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List the rider's earlier shifts (also the rider app's listShifts)
            tags:
                - shift
