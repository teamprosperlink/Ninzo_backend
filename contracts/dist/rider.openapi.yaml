    /riders/me/stock/scan:
        post:
            description: 'Loads the whole lot onto the rider''s scooter. Errors, all 409: no_open_shift, bad_scan, lot_expired, lot_quarantined, lot_already_on_scooter, lot_not_expected. A temperature problem returns temp_status so the app can show the quarantine prompt.'
            operationId: scanStock
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                lot_code:
                                    type: string
                                scanned_at:
                                    description: Device time. The server sets the official time.
                                    format: date-time
                                    type: string
                            required:
                                - lot_code
                                - scanned_at
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StockUnitResponse'
                    description: Accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Scan a lot onto the scooter
            tags:
                - stock
    /riders/me/verification:
        get:
            description: Only verified riders can start a shift. Before anything is started the status is pending with reason not_started; a verification past its expiry is expired.
            operationId: getVerification
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VerificationResponse'
                    description: The status.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get document verification status
            tags:
                - profile
    /riders/me/verification/start:
        post:
            description: A stand-in until DigiLocker. It records a pending request, and ops check the documents by hand, so redirect_url and upload_url are null for now. Errors already_verified and verification_in_progress (both 409).
            operationId: startVerification
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                method:
                                    enum:
                                        - digilocker
                                        - manual_upload
                                    type: string
                            required:
                                - method
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/VerificationStart'
                    description: Started.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Start document verification
            tags:
                - profile
    /scooters/{code}/telemetry:
        post:
            description: Called by the scooter, or the fleet system for it, never by the rider app. It is signed with a key that belongs to this one scooter (X-Telemetry-Key), made when the scooter is added in the console. There is no key shared by all scooters, so a key that leaks from one scooter cannot report for another, and the console can replace one scooter's key alone. A key that does not belong to the scooter in the path gets 401. Only a newer reading replaces the one kept, and a reading older than 30 minutes is not shown to the rider (the shift's scooter.battery_pct). It has no rider sign-in because the caller is a machine. It takes no Idempotency-Key, because the same reading sent twice is harmless.
            operationId: reportScooterTelemetry
            parameters:
                - description: The scooter code shown on the vehicle.
                  in: path
                  name: code
                  required: true
                  schema:
                    minLength: 1
                    type: string
                - description: The key of this scooter. Not a key for the fleet.
                  in: header
                  name: X-Telemetry-Key
                  required: true
                  schema:
                    minLength: 1
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            example:
                                at: "2026-11-12T06:00:00Z"
                                battery_pct: 72
                            properties:
                                at:
                                    description: When the scooter read it. At most a minute ahead of the server.
                                    format: date-time
                                    type: string
                                battery_pct:
                                    maximum: 100
                                    minimum: 0
                                    type: integer
                            required:
                                - battery_pct
                                - at
                            type: object
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Kept.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            security: []
            summary: Report a scooter's battery
            tags:
                - shift
security:
    - bearerAuth: []
servers:
