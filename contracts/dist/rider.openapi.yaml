                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change when the shift is planned to end
            tags:
