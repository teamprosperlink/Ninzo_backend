                                    format: date-time
                                    type: string
                                lat:
                                    maximum: 90
                                    minimum: -90
                                    type: number
                                lng:
                                    maximum: 180
                                    minimum: -180
                                    type: number
                                speed_mps:
                                    minimum: 0
                                    type: number
                            required:
                                - lat
                                - lng
                                - speed_mps
                                - accuracy_m
                                - device_time
                            type: object
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LocationAccepted'
