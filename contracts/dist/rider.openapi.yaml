        patch:
            description: 'Changes the name and the area the rider would like to work in. preferred_area is free text, what an applicant says they want; the rider''s zone itself stays an ops decision at approval. The rider app (Issue 235) sends email and area instead. area is a place the rider picked (name, city, lat, lng), and the server keeps its name as preferred_area. Send preferred_area or area, not both, or the call gets 400. email null clears the email, and area null clears the area. A suspended rider gets 403. Send only the fields to change. Error: invalid_request (400), for a name outside 1 to 80 characters, a preferred_area over 80, or an email that is not an address. The only 409 is idempotency_in_progress. Direct only: not in the offline event batch.'
            operationId: updateRider
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            example:
                                name: Ravi Kumar
                                preferred_area: Indiranagar
                            minProperties: 1
                            properties:
                                area:
                                    description: The place the rider picked while applying, as the rider app sends it. null clears it.
                                    oneOf:
                                        - $ref: '#/components/schemas/RiderArea'
                                        - type: "null"
                                email:
                                    description: Contact only. It never signs anyone in. null clears it.
                                    format: email
                                    maxLength: 254
                                    type:
                                        - string
                                        - "null"
                                name:
                                    maxLength: 80
                                    minLength: 1
                                    type: string
                                preferred_area:
                                    description: Free text. Not a zone.
                                    maxLength: 80
                                    type: string
                            type: object
                required: true
