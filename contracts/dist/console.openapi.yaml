                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                label:
                    type: string
                lat:
                    type: number
                lng:
                    type: number
                updated_at:
                    format: date-time
                    type: string
                verified:
                    type: boolean
                version:
                    minimum: 1
                    type: integer
                zone_id:
