    /auth/login:
        post:
            description: 'Step one. Returns a challenge for the authenticator code, and a session starts after verifyTotp. Until pre-launch the code is optional on staging: a user who has not set up an authenticator gets totp_required false and the session in this reply (session); one who has is still asked for the code. In production the code is always required. A wrong ID or password is invalid_credentials (401). After 5 wrong passwords or codes in 15 minutes the account locks for 15 minutes, and every sign-in then gets the same invalid_credentials; admins see locked_until. Errors also: rate_limited (429).'
            operationId: consoleLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginChallenge'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Sign in with an ID and password
            tags:
                - auth
    /auth/refresh:
        post:
            description: Send only one refresh at a time. See Sign-in in contracts/README.md.
            operationId: refreshToken
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenPair'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            security: []
            summary: Get a new token pair
            tags:
                - auth
    /auth/signout:
        post:
            description: Ends this session.
            operationId: signOut
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Sign out on this device
            tags:
                - auth
    /auth/totp/enroll:
        post:
            description: 'Only when the challenge says totp_enrolled is false: returns the secret once, to add to an authenticator app. Errors: totp_already_enrolled, challenge_expired (both 409).'
            operationId: enrollTotp
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChallengeRef'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TotpEnrollment'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            security: []
            summary: Set up the authenticator
            tags:
                - auth
    /auth/totp/verify:
        post:
            description: 'Step two. A wrong code also counts toward the account''s lockout. Errors: invalid_totp (400), challenge_expired (409), totp_attempts_exceeded (429).'
            operationId: verifyTotp
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TotpCode'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConsoleSession'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
                "503":
                    $ref: '#/components/responses/ServiceUnavailable'
            security: []
            summary: Finish sign-in with the authenticator code
            tags:
                - auth
    /me/password:
        post:
            description: 'Ends every other session. After a temporary password, this is the only call that works besides getConsoleUser, refreshToken and signOut; every other call is 403 password_change_required. Errors: invalid_credentials (401) for a wrong current password; weak_password (400).'
            operationId: changePassword
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasswordChange'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Done'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change your password
            tags:
                - auth
