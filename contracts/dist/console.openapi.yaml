# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
components:
    headers:
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                minimum: 0
                type: integer
    parameters:
        IdempotencyKey:
            description: Unique per intended action. Send the same key when retrying. Kept for 24 hours, per signed-in user, method and exact path.
            example: 7f3c1e9a-2b4d-4c8e-9a10-5d6e7f8a9b0c
            in: header
            name: Idempotency-Key
            required: true
            schema:
                maxLength: 128
                minLength: 8
                pattern: ^[A-Za-z0-9_-]+$
                type: string
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The request is invalid, or a required Idempotency-Key is missing.
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The action no longer fits the current state, or the same Idempotency-Key is still being processed. In that second case, retryable is true and Retry-After is set.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The caller lacks a permission, named in missing_permission.
        IdempotencyKeyReused:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: This Idempotency-Key was already used with a different request body.
        InternalError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: An unexpected server error.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The resource does not exist, or the caller cannot see it.
        ServiceUnavailable:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: A dependency is down. Retry later.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        TooManyRequests:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Rate limited.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The token is missing, invalid or expired.
    schemas:
        AdminGate:
            properties:
                entry_notes:
                    type:
