                    maxProperties: 50
                    minProperties: 1
                    type: object
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - changes
                - base_version
                - reason
            type: object
        SettingsView:
            properties:
                global_version:
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                settings:
                    items:
                        $ref: '#/components/schemas/Setting'
                    type: array
                zone_id:
                    description: Null for the global settings.
                    type:
                        - string
                        - "null"
                zone_version:
                    description: The zone's own version; null for the global settings, 0 for a zone with none yet.
                    type:
                        - integer
                        - "null"
            required:
                - zone_id
                - global_version
                - zone_version
                - settings
                - server_time
            type: object
        SupportAlert:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
                kind:
                    description: Open list, such as handover_wrong_otp.
                    type: string
                order_id:
                    type:
                        - string
                        - "null"
                rider_id:
                    type:
                        - string
                        - "null"
            required:
                - id
                - kind
                - order_id
                - rider_id
                - created_at
            type: object
        SupportAlertList:
            properties:
                alerts:
                    items:
                        $ref: '#/components/schemas/SupportAlert'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - alerts
                - next_cursor
                - server_time
            type: object
        Ticket:
            properties:
                close_reason:
                    type:
                        - string
                        - "null"
                closed_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                messages:
                    description: Oldest first. Empty in a list; filled when one ticket is read.
                    items:
                        $ref: '#/components/schemas/TicketMessage'
                    type: array
                opened_at:
                    format: date-time
                    type: string
                order_id:
                    type:
                        - string
                        - "null"
                status:
                    enum:
                        - open
                        - resolved
                    type: string
                subject:
                    type: string
                type:
                    enum:
                        - missing_item
                        - cold_food
                        - wrong_item
                        - payment
                        - other
                    type: string
            required:
                - id
                - order_id
                - type
                - status
                - subject
                - opened_at
                - closed_at
                - close_reason
                - messages
            type: object
        TicketList:
            properties:
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                tickets:
                    items:
                        $ref: '#/components/schemas/Ticket'
                    type: array
            required:
                - tickets
                - next_cursor
                - server_time
            type: object
        TicketMessage:
            properties:
                author_name:
                    type:
                        - string
                        - "null"
                author_type:
                    enum:
                        - customer
                        - support
                    type: string
                created_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                text:
                    type: string
            required:
                - id
                - author_type
                - author_name
                - text
                - created_at
            type: object
        TicketReply:
            properties:
                text:
                    maxLength: 2000
                    minLength: 1
                    type: string
            required:
                - text
            type: object
        TicketResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                ticket:
                    $ref: '#/components/schemas/Ticket'
            required:
                - ticket
                - server_time
            type: object
        TimelineEvent:
            properties:
                actor_name:
                    type:
                        - string
                        - "null"
                actor_type:
                    description: Open list, such as customer, rider, console or system.
                    type: string
                at:
                    format: date-time
                    type: string
                detail:
                    additionalProperties: true
                    description: Only the listed, non-personal fields of the event, such as ids, states and amounts (Money). Never a phone number, an address or a handover code.
                    type: object
                kind:
                    description: Open list, such as order.created or payment.captured.
                    type: string
                source:
                    enum:
                        - order
                        - offer
                        - payment
                        - refund
                        - remedy
                        - problem
                        - ticket
                        - review
                        - audit
                    type: string
            required:
                - at
                - source
                - kind
                - actor_type
                - actor_name
                - detail
            type: object
        TokenPair:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    minimum: 1
                    type: integer
                refresh_token:
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - server_time
            type: object
        TotpCode:
            properties:
                challenge_id:
                    maxLength: 200
                    type: string
                code:
                    pattern: ^[0-9]{6}$
                    type: string
            required:
                - challenge_id
                - code
            type: object
        TotpEnrollment:
            properties:
                otpauth_uri:
                    description: For a QR code in the console.
                    type: string
                secret:
                    description: Base32. Shown once.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - secret
                - otpauth_uri
                - server_time
            type: object
        Zone:
            properties:
                city:
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                is_test:
                    type: boolean
                name:
                    type: string
                offer_enabled:
                    description: The kill switch, true while the zone is active. False (paused) stops new orders in the zone.
                    type: boolean
            required:
                - id
                - name
                - city
                - offer_enabled
                - is_test
            type: object
        ZoneList:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                zones:
                    items:
                        $ref: '#/components/schemas/Zone'
                    type: array
            required:
                - zones
                - server_time
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: Short-lived access token from the sign-in endpoints.
            scheme: bearer
            type: http
info:
    contact:
        name: Ninzo backend
    description: The API behind the ops console (admin, ops, support and hub_manager; decision 0014). The shared rules are in contracts/README.md. Sign-in is an ID and password, then an authenticator code. The server checks the role on every call; a missing permission is 403 with missing_permission. A settings, kill-switch or flag change, and a refund above the set amount, waits for a second person's approval. Support and live ops screens come in v0.10.0.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Ninzo console API
    version: 0.1.0
openapi: 3.1.0
paths:
    /admin/approvals:
        get:
            description: 'Pending first. A second person approves a settings change, a kill-switch change, a flag change and a refund above the set amount (decision 0014). Permission: approvals.read.'
            operationId: listApprovals
            parameters:
                - description: Only this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - pending
                        - approved
                        - rejected
                        - failed
                        - cancelled
                        - lapsed
                        - open
                        - arrived_in_time
                        - late
                        - timed_out
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List approvals
            tags:
                - approvals
            x-permission: approvals.read
    /admin/approvals/{approval_id}/approve:
        post:
            description: 'Applies it. The person who asked cannot approve their own change. A kind of change not built yet is not_allowed (409). If the change no longer applies (the settings moved past its base version, or a zone would become invalid), the approval becomes failed with failure_code and nothing changes. Errors: own_change, not_pending (both 409). Permission: approvals.decide.'
            operationId: approveChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Approve a change
            tags:
                - approvals
            x-permission: approvals.decide
    /admin/approvals/{approval_id}/cancel:
        post:
            description: 'Only the person who asked. A pending approval also lapses after 24 hours. Errors: not_pending (409). Permission: approvals.read.'
            operationId: cancelChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Cancel your own pending change
            tags:
                - approvals
            x-permission: approvals.read
    /admin/approvals/{approval_id}/reject:
        post:
            description: 'With a reason. Errors: not_pending (409). Permission: approvals.decide.'
            operationId: rejectChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReasonBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Reject a change
            tags:
                - approvals
            x-permission: approvals.decide
    /admin/arrival-reviews:
        get:
            description: 'Open ones first, with how long is left. Ops and support. Permission: reviews.read.'
            operationId: listArrivalReviews
            parameters:
                - description: Only this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - open
                        - arrived_in_time
                        - late
                        - timed_out
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrivalReviewList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List late-arrival reviews
            tags:
                - reviews
            x-permission: reviews.read
    /admin/arrival-reviews/{review_id}/decision:
        post:
            description: 'arrived_in_time stops the timer at the rider''s evidence and takes back a credit still owed; late keeps the miss and its credit. Errors: review_closed, credit_applied (both 409; credit_applied when the credit was already given). Permission: reviews.decide.'
            operationId: decideArrivalReview
            parameters:
                - description: The id.
                  in: path
                  name: review_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ArrivalDecision'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrivalReviewResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Decide a late-arrival review
            tags:
                - reviews
            x-permission: reviews.decide
    /admin/audit:
        get:
            description: 'Newest first. Read-only. Password hashes, TOTP secrets and full phone numbers are never in before or after. Permission: audit.read.'
            operationId: listAuditEvents
            parameters:
                - description: From this time.
                  in: query
                  name: from
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: Before this time.
                  in: query
                  name: to
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: Only this actor.
                  in: query
                  name: actor_id
                  required: false
                  schema:
                    maxLength: 64
                    type: string
                - description: Only this action, such as order.handed_over.
                  in: query
                  name: action
                  required: false
                  schema:
                    maxLength: 80
                    type: string
                - description: Only this kind of thing, such as order, zone or lot.
                  in: query
                  name: entity_type
                  required: false
                  schema:
                    maxLength: 40
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Search the audit log
            tags:
                - audit
            x-permission: audit.read
    /admin/flags:
        get:
            description: 'Admin. Permission: flags.manage.'
            operationId: listFlags
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FlagList'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List feature flags
            tags:
                - flags
            x-permission: flags.manage
    /admin/flags/{flag_key}:
        put:
            description: 'Creates an approval; a second admin applies it. Errors: approval_pending (409) if one is already waiting. Permission: flags.manage.'
            operationId: requestFlagChange
            parameters:
                - description: The flag.
                  in: path
                  name: flag_key
                  required: true
                  schema:
                    pattern: ^[a-z][a-z0-9_]{1,60}$
                    type: string
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FlagChange'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Ask to change a feature flag
            tags:
                - flags
            x-permission: flags.manage
    /admin/gates:
        get:
            description: 'Newest first, optionally in one zone. Customers add gates; the console edits and verifies them. Permission: gates.read.'
            operationId: listAdminGates
            parameters:
                - description: Only this zone.
                  in: query
                  name: zone_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminGateList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List gates
            tags:
                - gates
            x-permission: gates.read
    /admin/gates/{gate_id}:
        patch:
            description: 'Every change is a new version with who and why; orders keep the version they were placed with. A gate whose customer was erased cannot be changed. Errors: outside_zone, not_allowed (both 409). Permission: gates.manage.'
            operationId: updateGate
            parameters:
                - description: The id.
                  in: path
                  name: gate_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GateUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminGateResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change a gate
            tags:
                - gates
            x-permission: gates.manage
    /admin/gates/{gate_id}/history:
        get:
            description: 'Oldest first. Permission: gates.read.'
            operationId: getGateHistory
            parameters:
                - description: The id.
                  in: path
                  name: gate_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GateHistory'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get a gate's versions
            tags:
                - gates
            x-permission: gates.read
    /admin/hub-ops:
        get:
            description: 'For each hub: its requests by state (confirmed, hub_accepted, packing, partial, ready, picked_up), how many are stuck (waiting longer than the setting restock_stuck_s), open shortfalls, quarantined lots and active staff. A hub_manager sees only their own hub. Permission: hub_ops.read.'
            operationId: listHubOps
            parameters:
                - description: Only hubs in this zone.
                  in: query
                  name: zone_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubOpsList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Show how each hub is doing
            tags:
                - hub_ops
            x-permission: hub_ops.read
    /admin/hub-ops/stuck:
        get:
            description: 'Requests in confirmed, hub_accepted or packing that have waited longer than the setting restock_stuck_s, longest first. A hub_manager sees only their own hub. Permission: hub_ops.read.'
            operationId: listStuckRestocks
            parameters:
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RestockList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
