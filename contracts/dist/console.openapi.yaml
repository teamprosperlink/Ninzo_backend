                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - rider
                - server_time
            type: object
        Role:
            description: admin runs users, settings and approvals; ops runs zones, hubs, riders and reviews; support handles customers and reviews; hub_manager runs one hub.
            enum:
                - admin
                - ops
                - support
                - hub_manager
            type: string
        ServerTime:
            description: Current server time in UTC. Clients use it to measure phone clock offset.
            example: "2026-11-04T10:15:30.250Z"
            format: date-time
            type: string
        Setting:
            properties:
                description:
                    type: string
                effective:
                    type:
                        - integer
                        - "null"
                key:
                    type: string
                max:
                    type: integer
                min:
                    type: integer
                required:
                    type: boolean
                unit:
                    type: string
                value:
                    description: This level's own value; null means it follows the global one.
                    type:
                        - integer
                        - "null"
            required:
                - key
                - unit
                - min
                - max
                - value
                - effective
                - required
                - description
            type: object
        SettingsChange:
            properties:
                changes:
                    additionalProperties:
                        type:
                            - integer
                            - "null"
                    description: Setting key to its new value; null goes back to the global value.
                    example:
                        timer_length_s: 120
                    maxProperties: 50
                    minProperties: 1
                    type: object
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - changes
                - reason
            type: object
        SettingsView:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                settings:
                    items:
                        $ref: '#/components/schemas/Setting'
                    type: array
                version:
                    minimum: 0
                    type: integer
                zone_id:
                    description: Null for the global settings.
                    type:
                        - string
                        - "null"
            required:
                - zone_id
                - version
                - settings
                - server_time
            type: object
        SupportAlert:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
                kind:
                    description: Open list, such as handover_wrong_otp.
                    type: string
                order_id:
                    type:
                        - string
                        - "null"
                rider_id:
                    type:
                        - string
                        - "null"
            required:
                - id
                - kind
                - order_id
                - rider_id
                - created_at
            type: object
        SupportAlertList:
            properties:
                alerts:
                    items:
                        $ref: '#/components/schemas/SupportAlert'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - alerts
                - next_cursor
                - server_time
            type: object
        TokenPair:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    minimum: 1
                    type: integer
                refresh_token:
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - server_time
            type: object
        TotpCode:
            properties:
                challenge_id:
                    maxLength: 200
                    type: string
                code:
                    pattern: ^[0-9]{6}$
                    type: string
            required:
                - challenge_id
                - code
            type: object
        TotpEnrollment:
            properties:
                otpauth_uri:
                    description: For a QR code in the console.
                    type: string
                secret:
                    description: Base32. Shown once.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - secret
                - otpauth_uri
                - server_time
            type: object
        Zone:
            properties:
                city:
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                is_test:
                    type: boolean
                name:
                    type: string
                offer_enabled:
                    description: The kill switch. False stops new orders in the zone.
                    type: boolean
            required:
                - id
                - name
                - city
                - offer_enabled
                - is_test
            type: object
        ZoneList:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                zones:
                    items:
                        $ref: '#/components/schemas/Zone'
                    type: array
            required:
                - zones
                - server_time
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: Short-lived access token from the sign-in endpoints.
            scheme: bearer
            type: http
info:
    contact:
        name: Ninzo backend
    description: The API behind the ops console (admin, ops, support and hub_manager; decision 0014). The shared rules are in contracts/README.md. Sign-in is an ID and password, then an authenticator code. The server checks the role on every call; a missing permission is 403 with missing_permission. A settings, kill-switch or flag change, and a refund above the set amount, waits for a second person's approval. Support and live ops screens come in v0.10.0.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Ninzo console API
    version: 0.1.0
openapi: 3.1.0
paths:
    /admin/approvals:
        get:
            description: Pending first. A second person approves a settings change, a kill-switch change, a flag change and a refund above the set amount (decision 0014).
            operationId: listApprovals
            parameters:
                - description: Only this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    maxLength: 40
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List approvals
            tags:
                - approvals
    /admin/approvals/{approval_id}/approve:
        post:
            description: 'Applies it. The person who asked cannot approve their own change. Errors: own_change, not_pending, change_conflict (the setting changed since; ask again) (all 409).'
            operationId: approveChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Approve a change
            tags:
                - approvals
    /admin/approvals/{approval_id}/reject:
        post:
            description: 'With a reason. Errors: not_pending (409).'
            operationId: rejectChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReasonBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Reject a change
            tags:
                - approvals
    /admin/arrival-reviews:
        get:
            description: Open ones first, with how long is left. Ops and support.
            operationId: listArrivalReviews
            parameters:
                - description: Only this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    maxLength: 40
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrivalReviewList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List late-arrival reviews
            tags:
                - reviews
    /admin/arrival-reviews/{review_id}/decision:
        post:
            description: 'arrived_in_time stops the timer at the rider''s evidence; late keeps the miss and its credit. Errors: review_closed (409).'
            operationId: decideArrivalReview
            parameters:
                - description: The id.
                  in: path
                  name: review_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ArrivalDecision'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrivalReviewResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Decide a late-arrival review
            tags:
                - reviews
    /admin/audit:
        get:
            description: Newest first. Admin only. Read-only.
            operationId: listAuditEvents
            parameters:
                - description: From this time.
                  in: query
                  name: from
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: Before this time.
                  in: query
                  name: to
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: Only this actor.
                  in: query
                  name: actor_id
                  required: false
                  schema:
                    maxLength: 64
                    type: string
                - description: Only this action, such as order.handed_over.
                  in: query
                  name: action
                  required: false
                  schema:
                    maxLength: 80
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Search the audit log
            tags:
                - audit
    /admin/flags:
        get:
            description: Admin.
            operationId: listFlags
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FlagList'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List feature flags
            tags:
                - flags
    /admin/flags/{flag_key}:
        put:
            description: 'Creates an approval; a second admin applies it. Errors: approval_pending (409) if one is already waiting.'
            operationId: requestFlagChange
            parameters:
                - description: The flag.
                  in: path
                  name: flag_key
                  required: true
                  schema:
                    pattern: ^[a-z][a-z0-9_]{1,60}$
                    type: string
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FlagChange'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Ask to change a feature flag
            tags:
                - flags
    /admin/gates:
        get:
            description: Newest first, optionally in one zone.
            operationId: listAdminGates
            parameters:
                - description: Only this zone.
                  in: query
                  name: zone_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminGateList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List gates
            tags:
                - gates
    /admin/gates/{gate_id}:
        patch:
            description: 'Every change is a new version with who and why; orders keep the version they were placed with. Errors: outside_zone (409).'
            operationId: updateGate
            parameters:
                - description: The id.
                  in: path
                  name: gate_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GateUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminGateResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change a gate
            tags:
                - gates
    /admin/gates/{gate_id}/history:
        get:
            description: Oldest first.
            operationId: getGateHistory
            parameters:
                - description: The id.
                  in: path
                  name: gate_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GateHistory'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Get a gate's versions
            tags:
                - gates
    /admin/hub-staff/{staff_id}:
        patch:
            description: Role, hub or status, with a reason. Suspending ends their sessions.
            operationId: updateHubStaff
            parameters:
                - description: The id.
                  in: path
                  name: staff_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HubStaffUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubStaffResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change hub staff
            tags:
                - hubs
    /admin/hubs:
        get:
            description: Optionally in one zone.
            operationId: listAdminHubs
            parameters:
                - description: Only this zone.
                  in: query
                  name: zone_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminHubList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List hubs
            tags:
                - hubs
        post:
            description: 'Errors: name_taken (409).'
            operationId: createHub
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HubCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminHubResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Add a hub
            tags:
                - hubs
    /admin/hubs/{hub_id}:
        patch:
            description: 'A paused hub accepts nothing new. Errors: name_taken (409).'
            operationId: updateHub
            parameters:
                - description: The id.
                  in: path
                  name: hub_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HubUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminHubResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Change or pause a hub
            tags:
                - hubs
    /admin/hubs/{hub_id}/staff:
        get:
            description: A hub_manager sees only their own hub.
            operationId: listHubStaff
            parameters:
                - description: The id.
                  in: path
                  name: hub_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubStaffList'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List a hub's staff
            tags:
                - hubs
        post:
            description: 'They sign in to the partner app with this phone. Errors: phone_taken (409).'
            operationId: addHubStaff
            parameters:
                - description: The id.
                  in: path
                  name: hub_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HubStaffCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HubStaffResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
