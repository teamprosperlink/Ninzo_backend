    /admin/zones:
        get:
            description: 'With each zone''s kill switch. Permission: zones.read.'
            operationId: listZones
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ZoneList'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List zones
            tags:
                - zones
            x-permission: zones.read
    /admin/zones/{zone_id}/kill-switch:
        post:
            description: 'Creates an approval. Turning it off pauses the zone: new orders stop there; orders in progress finish with their rider, but one that needs another scooter cannot get one. Turning it on needs an area that overlaps no other active zone, checked again on approval. Errors: approval_pending, no_change, zone_has_no_area, zone_overlaps (all 409). Permission: zones.kill_switch.'
            operationId: requestKillSwitch
            parameters:
                - description: The id.
                  in: path
                  name: zone_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/KillSwitch'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Ask to turn a zone's 90-second offer off or on
            tags:
                - zones
            x-permission: zones.kill_switch
    /admin/zones/{zone_id}/settings:
        get:
            description: 'Its own values, and the effective values with the global ones beneath. Permission: settings.read.'
