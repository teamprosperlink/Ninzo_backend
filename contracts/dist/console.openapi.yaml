# Generated by `task contracts:bundle`. Do not edit. Change the files in contracts/customer, contracts/rider, contracts/partner, contracts/console or contracts/shared.
components:
    headers:
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                minimum: 0
                type: integer
    parameters:
        IdempotencyKey:
            description: Unique per intended action. Send the same key when retrying. Kept for 24 hours, per signed-in user, method and exact path.
            example: 7f3c1e9a-2b4d-4c8e-9a10-5d6e7f8a9b0c
            in: header
            name: Idempotency-Key
            required: true
            schema:
                maxLength: 128
                minLength: 8
                pattern: ^[A-Za-z0-9_-]+$
                type: string
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The request is invalid, or a required Idempotency-Key is missing.
        Conflict:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The action no longer fits the current state, or the same Idempotency-Key is still being processed. In that second case, retryable is true and Retry-After is set.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The caller lacks a permission, named in missing_permission.
        IdempotencyKeyReused:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: This Idempotency-Key was already used with a different request body.
        InternalError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: An unexpected server error.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The resource does not exist, or the caller cannot see it.
        ServiceUnavailable:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: A dependency is down. Retry later.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        TooManyRequests:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Rate limited.
            headers:
                Retry-After:
                    $ref: '#/components/headers/RetryAfter'
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The token is missing, invalid or expired.
    schemas:
        Actor:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
            required:
                - id
                - name
            type: object
        AdminGate:
            properties:
                entry_notes:
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                label:
                    type: string
                lat:
                    type: number
                lng:
                    type: number
                updated_at:
                    format: date-time
                    type: string
                verified:
                    type: boolean
                version:
                    minimum: 1
                    type: integer
                zone_id:
                    $ref: '#/components/schemas/Id'
            required:
                - id
                - zone_id
                - label
                - lat
                - lng
                - entry_notes
                - verified
                - version
                - updated_at
            type: object
        AdminGateList:
            properties:
                gates:
                    items:
                        $ref: '#/components/schemas/AdminGate'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - gates
                - next_cursor
                - server_time
            type: object
        AdminGateResponse:
            properties:
                gate:
                    $ref: '#/components/schemas/AdminGate'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - gate
                - server_time
            type: object
        AdminHub:
            properties:
                id:
                    $ref: '#/components/schemas/Id'
                is_test:
                    type: boolean
                lat:
                    type: number
                lng:
                    type: number
                name:
                    type: string
                staff_count:
                    minimum: 0
                    type: integer
                status:
                    enum:
                        - active
                        - paused
                    type: string
                zone_id:
                    $ref: '#/components/schemas/Id'
            required:
                - id
                - zone_id
                - name
                - lat
                - lng
                - status
                - staff_count
                - is_test
            type: object
        AdminHubList:
            properties:
                hubs:
                    items:
                        $ref: '#/components/schemas/AdminHub'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - hubs
                - server_time
            type: object
        AdminHubResponse:
            properties:
                hub:
                    $ref: '#/components/schemas/AdminHub'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - hub
                - server_time
            type: object
        AdminMenuItem:
            properties:
                allergens:
                    items:
                        type: string
                    type: array
                description:
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type: string
                photo_url:
                    type:
                        - string
                        - "null"
                price:
                    $ref: '#/components/schemas/Money'
                sort_order:
                    type: integer
                status:
                    enum:
                        - active
                        - hidden
                    type: string
                updated_at:
                    format: date-time
                    type: string
            required:
                - id
                - name
                - description
                - price
                - status
                - sort_order
                - allergens
                - photo_url
                - updated_at
            type: object
        AdminMenuItemResponse:
            properties:
                item:
                    $ref: '#/components/schemas/AdminMenuItem'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - item
                - server_time
            type: object
        AdminMenuList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AdminMenuItem'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - items
                - server_time
            type: object
        Approval:
            properties:
                change:
                    discriminator:
                        mapping:
                            flag: '#/components/schemas/FlagApprovalChange'
                            kill_switch: '#/components/schemas/KillSwitchApprovalChange'
                            refund: '#/components/schemas/RefundApprovalChange'
                            settings: '#/components/schemas/SettingsApprovalChange'
                        propertyName: kind
                    oneOf:
                        - $ref: '#/components/schemas/SettingsApprovalChange'
                        - $ref: '#/components/schemas/KillSwitchApprovalChange'
                        - $ref: '#/components/schemas/FlagApprovalChange'
                        - $ref: '#/components/schemas/RefundApprovalChange'
                decided_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                decided_by:
                    oneOf:
                        - $ref: '#/components/schemas/Actor'
                        - type: "null"
                decision_reason:
                    description: Why it was rejected or cancelled.
                    type:
                        - string
                        - "null"
                expires_at:
                    description: A pending approval lapses then.
                    format: date-time
                    type: string
                failure_code:
                    description: Why an approved change could not be applied, such as stale_version or invalid_setting.
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                kind:
                    enum:
                        - settings
                        - kill_switch
                        - flag
                        - refund
                    type: string
                request_reason:
                    type: string
                requested_at:
                    format: date-time
                    type: string
                requested_by:
                    $ref: '#/components/schemas/Actor'
                status:
                    enum:
                        - pending
                        - approved
                        - rejected
                        - failed
                        - cancelled
                        - lapsed
                    type: string
                summary:
                    description: What would change, in words.
                    type: string
            required:
                - id
                - kind
                - status
                - summary
                - change
                - requested_by
                - requested_at
                - request_reason
                - decided_by
                - decided_at
                - decision_reason
                - failure_code
                - expires_at
            type: object
        ApprovalList:
            properties:
                approvals:
                    items:
                        $ref: '#/components/schemas/Approval'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - approvals
                - next_cursor
                - server_time
            type: object
        ApprovalResponse:
            properties:
                approval:
                    $ref: '#/components/schemas/Approval'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - approval
                - server_time
            type: object
        ArrivalDecision:
            properties:
                decision:
                    enum:
                        - arrived_in_time
                        - late
                    type: string
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - decision
                - reason
            type: object
        ArrivalReview:
            properties:
                decided_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                decided_by:
                    type:
                        - string
                        - "null"
                decision_reason:
                    type:
                        - string
                        - "null"
                device_time:
                    description: When the rider's phone says it reached the perimeter.
                    format: date-time
                    type: string
                due_at:
                    format: date-time
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                lat:
                    type: number
                lng:
                    type: number
                order_id:
                    $ref: '#/components/schemas/Id'
                status:
                    enum:
                        - open
                        - arrived_in_time
                        - late
                        - timed_out
                    type: string
            required:
                - id
                - order_id
                - status
                - lat
                - lng
                - device_time
                - due_at
                - decided_at
                - decided_by
                - decision_reason
            type: object
        ArrivalReviewList:
            properties:
                next_cursor:
                    type:
                        - string
                        - "null"
                reviews:
                    items:
                        $ref: '#/components/schemas/ArrivalReview'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - reviews
                - next_cursor
                - server_time
            type: object
        ArrivalReviewResponse:
            properties:
                review:
                    $ref: '#/components/schemas/ArrivalReview'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - review
                - server_time
            type: object
        AuditEvent:
            properties:
                action:
                    type: string
                actor_id:
                    type:
                        - string
                        - "null"
                actor_type:
                    type: string
                after:
                    type:
                        - object
                        - "null"
                at:
                    format: date-time
                    type: string
                before:
                    type:
                        - object
                        - "null"
                entity_id:
                    type: string
                entity_type:
                    type: string
                id:
                    type: string
                reason:
                    type:
                        - string
                        - "null"
            required:
                - id
                - actor_type
                - actor_id
                - action
                - entity_type
                - entity_id
                - before
                - after
                - reason
                - at
            type: object
        AuditList:
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/AuditEvent'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - events
                - next_cursor
                - server_time
            type: object
        ChallengeRef:
            properties:
                challenge_id:
                    maxLength: 200
                    type: string
            required:
                - challenge_id
            type: object
        ConsoleSession:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    minimum: 1
                    type: integer
                must_change_password:
                    type: boolean
                refresh_token:
                    type: string
                role:
                    $ref: '#/components/schemas/Role'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                user_id:
                    $ref: '#/components/schemas/Id'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - user_id
                - role
                - must_change_password
                - server_time
            type: object
        ConsoleUser:
            properties:
                active:
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                hub_id:
                    description: A hub_manager's hub.
                    type:
                        - string
                        - "null"
                id:
                    $ref: '#/components/schemas/Id'
                locked_until:
                    description: Set while sign-in is locked after repeated failures; a reset clears it.
                    format: date-time
                    type:
                        - string
                        - "null"
                login_id:
                    type: string
                name:
                    type: string
                role:
                    $ref: '#/components/schemas/Role'
                totp_enrolled:
                    type: boolean
            required:
                - id
                - login_id
                - name
                - role
                - hub_id
                - active
                - totp_enrolled
                - locked_until
                - created_at
            type: object
        ConsoleUserCreate:
            properties:
                hub_id:
                    $ref: '#/components/schemas/Id'
                login_id:
                    description: The user's email address, lower case. The older ID form is still accepted.
                    maxLength: 254
                    pattern: ^([a-z0-9._-]{3,80}|[a-z0-9._%+-]{1,64}@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,63})$
                    type: string
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
                role:
                    $ref: '#/components/schemas/Role'
            required:
                - login_id
                - name
                - role
            type: object
        ConsoleUserCreated:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                temporary_password:
                    description: Shown once. Give it to the user privately.
                    type: string
                user:
                    $ref: '#/components/schemas/ConsoleUser'
            required:
                - user
                - temporary_password
                - server_time
            type: object
        ConsoleUserList:
            properties:
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                users:
                    items:
                        $ref: '#/components/schemas/ConsoleUser'
                    type: array
            required:
                - users
                - next_cursor
                - server_time
            type: object
        ConsoleUserResponse:
            properties:
                permissions:
                    description: What this user's role may do.
                    items:
                        $ref: '#/components/schemas/Permission'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                user:
                    $ref: '#/components/schemas/ConsoleUser'
            required:
                - user
                - permissions
                - server_time
            type: object
        ConsoleUserUpdate:
            properties:
                active:
                    type: boolean
                hub_id:
                    description: Null takes a user off a hub.
                    oneOf:
                        - $ref: '#/components/schemas/Id'
                        - type: "null"
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
                role:
                    $ref: '#/components/schemas/Role'
            required:
                - reason
            type: object
        Done:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - server_time
            type: object
        Error:
            description: The one error shape, used by every endpoint.
            properties:
                code:
                    description: 'Stable code for app logic. This is an open list: contracts add codes for their own endpoints. If a client does not know a code, it follows retryable. Shared codes are listed in contracts/README.md.'
                    example: token_expired
                    type: string
                message:
                    description: For developers and logs. App wording comes from the copy deck.
                    example: The access token has expired.
                    type: string
                missing_permission:
                    description: Only on 403. The permission the caller lacks.
                    example: orders.read
                    type: string
                retryable:
                    description: True if the same request may succeed later without changes.
                    example: false
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                sign_in_method:
                    description: Only on sign_in_method_mismatch. How this account signs in.
                    example: google
                    type: string
            required:
                - code
                - message
                - retryable
                - server_time
            type: object
        Flag:
            properties:
                description:
                    type: string
                enabled:
                    type: boolean
                key:
                    type: string
                updated_at:
                    format: date-time
                    type: string
            required:
                - key
                - enabled
                - description
                - updated_at
            type: object
        FlagApprovalChange:
            properties:
                enabled_after:
                    type: boolean
                enabled_before:
                    type: boolean
                key:
                    type: string
                kind:
                    const: flag
                    type: string
            required:
                - kind
                - key
                - enabled_before
                - enabled_after
            type: object
        FlagChange:
            properties:
                enabled:
                    type: boolean
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - enabled
                - reason
            type: object
        FlagList:
            properties:
                flags:
                    items:
                        $ref: '#/components/schemas/Flag'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - flags
                - server_time
            type: object
        GateHistory:
            properties:
                gate_id:
                    $ref: '#/components/schemas/Id'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                versions:
                    items:
                        $ref: '#/components/schemas/GateVersion'
                    type: array
            required:
                - gate_id
                - versions
                - server_time
            type: object
        GateUpdate:
            properties:
                entry_notes:
                    maxLength: 500
                    type:
                        - string
                        - "null"
                label:
                    maxLength: 80
                    minLength: 1
                    type: string
                lat:
                    maximum: 90
                    minimum: -90
                    type: number
                lng:
                    maximum: 180
                    minimum: -180
                    type: number
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
                verified:
                    type: boolean
            required:
                - reason
            type: object
        GateVersion:
            properties:
                changed_by:
                    description: Who made this version; null for one the customer made.
                    type:
                        - string
                        - "null"
                created_at:
                    format: date-time
                    type: string
                entry_notes:
                    type:
                        - string
                        - "null"
                label:
                    type: string
                lat:
                    type: number
                lng:
                    type: number
                reason:
                    type: string
                verified:
                    type: boolean
                version:
                    type: integer
            required:
                - version
                - label
                - lat
                - lng
                - entry_notes
                - verified
                - reason
                - changed_by
                - created_at
            type: object
        HubCreate:
            properties:
                lat:
                    maximum: 90
                    minimum: -90
                    type: number
                lng:
                    maximum: 180
                    minimum: -180
                    type: number
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
                zone_id:
                    $ref: '#/components/schemas/Id'
            required:
                - zone_id
                - name
                - lat
                - lng
            type: object
        HubStaffCreate:
            properties:
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
                phone:
                    pattern: ^\+91[6-9][0-9]{9}$
                    type: string
                role:
                    enum:
                        - hub_staff
                        - hub_lead
                    type: string
            required:
                - phone
                - name
                - role
            type: object
        HubStaffList:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                staff:
                    items:
                        $ref: '#/components/schemas/HubStaffMember'
                    type: array
            required:
                - staff
                - server_time
            type: object
        HubStaffMember:
            properties:
                hub_id:
                    $ref: '#/components/schemas/Id'
                id:
                    $ref: '#/components/schemas/Id'
                name:
                    type:
                        - string
                        - "null"
                phone_last4:
                    type: string
                role:
                    enum:
                        - hub_staff
                        - hub_lead
                    type: string
                status:
                    enum:
                        - active
                        - suspended
                    type: string
            required:
                - id
                - hub_id
                - name
                - phone_last4
                - role
                - status
            type: object
        HubStaffResponse:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                staff:
                    $ref: '#/components/schemas/HubStaffMember'
            required:
                - staff
                - server_time
            type: object
        HubStaffUpdate:
            properties:
                hub_id:
                    $ref: '#/components/schemas/Id'
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
                role:
                    enum:
                        - hub_staff
                        - hub_lead
                    type: string
                status:
                    enum:
                        - active
                        - suspended
                    type: string
            required:
                - reason
            type: object
        HubUpdate:
            properties:
                lat:
                    maximum: 90
                    minimum: -90
                    type: number
                lng:
                    maximum: 180
                    minimum: -180
                    type: number
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
                status:
                    enum:
                        - active
                        - paused
                    type: string
            required:
                - reason
            type: object
        Id:
            description: Opaque identifier. Do not parse it.
            example: ord_01HZX3Q7
            minLength: 1
            type: string
        KillSwitch:
            properties:
                offer_enabled:
                    type: boolean
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - offer_enabled
                - reason
            type: object
        KillSwitchApprovalChange:
            properties:
                kind:
                    const: kill_switch
                    type: string
                offer_enabled_after:
                    type: boolean
                offer_enabled_before:
                    type: boolean
                zone_id:
                    $ref: '#/components/schemas/Id'
            required:
                - kind
                - zone_id
                - offer_enabled_before
                - offer_enabled_after
            type: object
        LoginChallenge:
            properties:
                challenge_id:
                    description: For enrollTotp and verifyTotp. Still given when totp_required is false, so a user can set up an authenticator.
                    type: string
                expires_in_s:
                    minimum: 1
                    type: integer
                must_change_password:
                    description: True with a temporary password. Change it with changePassword once signed in; until then only that call works.
                    type: boolean
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                session:
                    description: The session when totp_required is false; otherwise null.
                    oneOf:
                        - $ref: '#/components/schemas/ConsoleSession'
                        - type: "null"
                totp_enrolled:
                    description: False at first sign-in. Then call enrollTotp before verifyTotp.
                    type: boolean
                totp_required:
                    description: False when the password alone signed in (only before pre-launch, for a user with no authenticator); session then holds the session.
                    type: boolean
            required:
                - challenge_id
                - totp_enrolled
                - totp_required
                - must_change_password
                - expires_in_s
                - session
                - server_time
            type: object
        LoginRequest:
            properties:
                login_id:
                    description: The user's email address (or an older login ID). Not case sensitive.
                    maxLength: 254
                    minLength: 3
                    type: string
                password:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - login_id
                - password
            type: object
        MenuItemCreate:
            properties:
                allergens:
                    items:
                        maxLength: 40
                        type: string
                    maxItems: 20
                    type: array
                description:
                    maxLength: 500
                    type: string
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
                photo_url:
                    maxLength: 1000
                    pattern: ^https://
                    type: string
                price_paise:
                    maximum: 1000000
                    minimum: 100
                    type: integer
                reason:
                    description: Kept in the price history as why the first price was set.
                    maxLength: 500
                    minLength: 3
                    type: string
                sort_order:
                    maximum: 10000
                    minimum: 0
                    type: integer
            required:
                - name
                - price_paise
            type: object
        MenuItemUpdate:
            properties:
                allergens:
                    items:
                        maxLength: 40
                        type: string
                    maxItems: 20
                    type: array
                description:
                    maxLength: 500
                    type:
                        - string
                        - "null"
                name:
                    maxLength: 80
                    minLength: 1
                    type: string
                photo_url:
                    maxLength: 1000
                    pattern: ^https://
                    type:
                        - string
                        - "null"
                price_paise:
                    maximum: 1000000
                    minimum: 100
                    type: integer
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
                sort_order:
                    maximum: 10000
                    minimum: 0
                    type: integer
                status:
                    enum:
                        - active
                        - hidden
                    type: string
            required:
                - reason
            type: object
        Money:
            description: An amount in minor units, such as paise. Never a decimal.
            properties:
                amount_minor:
                    example: 14900
                    minimum: 0
                    type: integer
                currency:
                    example: INR
                    pattern: ^[A-Z]{3}$
                    type: string
            required:
                - amount_minor
                - currency
            type: object
        PasswordChange:
            properties:
                current_password:
                    maxLength: 200
                    type: string
                new_password:
                    description: At least 12 characters.
                    example: a-new-long-password
                    maxLength: 200
                    minLength: 12
                    type: string
            required:
                - current_password
                - new_password
            type: object
        Permission:
            description: What a call needs; each role's list is in decision 0015. admin has every one; ops has approvals.read, riders.review, zones.read, settings.read, settings.request, zones.kill_switch, menu.manage, gates.read, gates.manage, hubs.read, hubs.manage, hub_staff.manage, reviews.read, reviews.decide, alerts.read; support has zones.read, gates.read, reviews.read, reviews.decide, alerts.read; hub_manager has hubs.read and hub_staff.manage for their own hub.
            enum:
                - users.manage
                - approvals.read
                - approvals.decide
                - riders.review
                - flags.manage
                - zones.read
                - settings.read
                - settings.request
                - zones.kill_switch
                - menu.manage
                - gates.read
                - gates.manage
                - hubs.read
                - hubs.manage
                - hub_staff.manage
                - audit.read
                - reviews.read
                - reviews.decide
                - alerts.read
            type: string
        PriceHistory:
            properties:
                item_id:
                    $ref: '#/components/schemas/Id'
                prices:
                    items:
                        $ref: '#/components/schemas/PricePoint'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - item_id
                - prices
                - server_time
            type: object
        PricePoint:
            properties:
                created_at:
                    format: date-time
                    type: string
                price:
                    $ref: '#/components/schemas/Money'
                reason:
                    type: string
            required:
                - price
                - reason
                - created_at
            type: object
        ReasonBody:
            properties:
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - reason
            type: object
        RefreshRequest:
            properties:
                refresh_token:
                    type: string
            required:
                - refresh_token
            type: object
        RefundApprovalChange:
            properties:
                amount:
                    $ref: '#/components/schemas/Money'
                kind:
                    const: refund
                    type: string
                order_id:
                    $ref: '#/components/schemas/Id'
            required:
                - kind
                - order_id
                - amount
            type: object
        RiderDecision:
            properties:
                decision:
                    enum:
                        - approve
                        - suspend
                        - reinstate
                    type: string
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
                zone_id:
                    $ref: '#/components/schemas/Id'
            required:
                - decision
                - reason
            type: object
        RiderReview:
            properties:
                applied_at:
                    format: date-time
                    type: string
                name:
                    type:
                        - string
                        - "null"
                phone_last4:
                    description: The last four digits only.
                    type: string
                rider_id:
                    $ref: '#/components/schemas/Id'
                status:
                    enum:
                        - applicant
                        - active
                        - suspended
                    type: string
                verification:
                    enum:
                        - none
                        - pending
                        - verified
                        - failed
                        - expired
                    type: string
                zone_id:
                    type:
                        - string
                        - "null"
            required:
                - rider_id
                - name
                - phone_last4
                - status
                - verification
                - zone_id
                - applied_at
            type: object
        RiderReviewList:
            properties:
                next_cursor:
                    type:
                        - string
                        - "null"
                riders:
                    items:
                        $ref: '#/components/schemas/RiderReview'
                    type: array
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - riders
                - next_cursor
                - server_time
            type: object
        RiderReviewResponse:
            properties:
                rider:
                    $ref: '#/components/schemas/RiderReview'
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - rider
                - server_time
            type: object
        Role:
            description: admin runs users, settings and approvals; ops runs zones, hubs, riders and reviews; support handles customers and reviews; hub_manager runs one hub.
            enum:
                - admin
                - ops
                - support
                - hub_manager
            type: string
        ServerTime:
            description: Current server time in UTC. Clients use it to measure phone clock offset.
            example: "2026-11-04T10:15:30.250Z"
            format: date-time
            type: string
        Setting:
            properties:
                description:
                    type: string
                effective:
                    type:
                        - integer
                        - "null"
                key:
                    type: string
                max:
                    type: integer
                min:
                    type: integer
                required:
                    type: boolean
                unit:
                    type: string
                value:
                    description: This level's own value; null means it follows the global one.
                    type:
                        - integer
                        - "null"
            required:
                - key
                - unit
                - min
                - max
                - value
                - effective
                - required
                - description
            type: object
        SettingDiff:
            properties:
                after:
                    type:
                        - integer
                        - "null"
                before:
                    type:
                        - integer
                        - "null"
                key:
                    type: string
            required:
                - key
                - before
                - after
            type: object
        SettingsApprovalChange:
            properties:
                base_version:
                    minimum: 0
                    type: integer
                diffs:
                    items:
                        $ref: '#/components/schemas/SettingDiff'
                    type: array
                kind:
                    const: settings
                    type: string
                zone_id:
                    description: Null for the global settings.
                    type:
                        - string
                        - "null"
            required:
                - kind
                - zone_id
                - base_version
                - diffs
            type: object
        SettingsChange:
            properties:
                base_version:
                    description: The version you read (global_version, or zone_version for a zone).
                    minimum: 0
                    type: integer
                changes:
                    additionalProperties:
                        type:
                            - integer
                            - "null"
                    description: Setting key to its new value; null goes back to the global value.
                    example:
                        timer_length_s: 120
                    maxProperties: 50
                    minProperties: 1
                    type: object
                reason:
                    maxLength: 500
                    minLength: 3
                    type: string
            required:
                - changes
                - base_version
                - reason
            type: object
        SettingsView:
            properties:
                global_version:
                    minimum: 0
                    type: integer
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                settings:
                    items:
                        $ref: '#/components/schemas/Setting'
                    type: array
                zone_id:
                    description: Null for the global settings.
                    type:
                        - string
                        - "null"
                zone_version:
                    description: The zone's own version; null for the global settings, 0 for a zone with none yet.
                    type:
                        - integer
                        - "null"
            required:
                - zone_id
                - global_version
                - zone_version
                - settings
                - server_time
            type: object
        SupportAlert:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
                kind:
                    description: Open list, such as handover_wrong_otp.
                    type: string
                order_id:
                    type:
                        - string
                        - "null"
                rider_id:
                    type:
                        - string
                        - "null"
            required:
                - id
                - kind
                - order_id
                - rider_id
                - created_at
            type: object
        SupportAlertList:
            properties:
                alerts:
                    items:
                        $ref: '#/components/schemas/SupportAlert'
                    type: array
                next_cursor:
                    type:
                        - string
                        - "null"
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - alerts
                - next_cursor
                - server_time
            type: object
        TokenPair:
            properties:
                access_token:
                    type: string
                expires_in_s:
                    minimum: 1
                    type: integer
                refresh_token:
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - access_token
                - refresh_token
                - expires_in_s
                - server_time
            type: object
        TotpCode:
            properties:
                challenge_id:
                    maxLength: 200
                    type: string
                code:
                    pattern: ^[0-9]{6}$
                    type: string
            required:
                - challenge_id
                - code
            type: object
        TotpEnrollment:
            properties:
                otpauth_uri:
                    description: For a QR code in the console.
                    type: string
                secret:
                    description: Base32. Shown once.
                    type: string
                server_time:
                    $ref: '#/components/schemas/ServerTime'
            required:
                - secret
                - otpauth_uri
                - server_time
            type: object
        Zone:
            properties:
                city:
                    type: string
                id:
                    $ref: '#/components/schemas/Id'
                is_test:
                    type: boolean
                name:
                    type: string
                offer_enabled:
                    description: The kill switch, true while the zone is active. False (paused) stops new orders in the zone.
                    type: boolean
            required:
                - id
                - name
                - city
                - offer_enabled
                - is_test
            type: object
        ZoneList:
            properties:
                server_time:
                    $ref: '#/components/schemas/ServerTime'
                zones:
                    items:
                        $ref: '#/components/schemas/Zone'
                    type: array
            required:
                - zones
                - server_time
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            description: Short-lived access token from the sign-in endpoints.
            scheme: bearer
            type: http
info:
    contact:
        name: Ninzo backend
    description: The API behind the ops console (admin, ops, support and hub_manager; decision 0014). The shared rules are in contracts/README.md. Sign-in is an ID and password, then an authenticator code. The server checks the role on every call; a missing permission is 403 with missing_permission. A settings, kill-switch or flag change, and a refund above the set amount, waits for a second person's approval. Support and live ops screens come in v0.10.0.
    license:
        identifier: Apache-2.0
        name: Apache-2.0
    title: Ninzo console API
    version: 0.1.0
openapi: 3.1.0
paths:
    /admin/approvals:
        get:
            description: 'Pending first. A second person approves a settings change, a kill-switch change, a flag change and a refund above the set amount (decision 0014). Permission: approvals.read.'
            operationId: listApprovals
            parameters:
                - description: Only this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - pending
                        - approved
                        - rejected
                        - failed
                        - cancelled
                        - lapsed
                        - open
                        - arrived_in_time
                        - late
                        - timed_out
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List approvals
            tags:
                - approvals
            x-permission: approvals.read
    /admin/approvals/{approval_id}/approve:
        post:
            description: 'Applies it. The person who asked cannot approve their own change. A kind of change not built yet is not_allowed (409). If the change no longer applies (the settings moved past its base version, or a zone would become invalid), the approval becomes failed with failure_code and nothing changes. Errors: own_change, not_pending (both 409). Permission: approvals.decide.'
            operationId: approveChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Approve a change
            tags:
                - approvals
            x-permission: approvals.decide
    /admin/approvals/{approval_id}/cancel:
        post:
            description: 'Only the person who asked. A pending approval also lapses after 24 hours. Errors: not_pending (409). Permission: approvals.read.'
            operationId: cancelChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Cancel your own pending change
            tags:
                - approvals
            x-permission: approvals.read
    /admin/approvals/{approval_id}/reject:
        post:
            description: 'With a reason. Errors: not_pending (409). Permission: approvals.decide.'
            operationId: rejectChange
            parameters:
                - description: The id.
                  in: path
                  name: approval_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReasonBody'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Reject a change
            tags:
                - approvals
            x-permission: approvals.decide
    /admin/arrival-reviews:
        get:
            description: 'Open ones first, with how long is left. Ops and support. Permission: reviews.read.'
            operationId: listArrivalReviews
            parameters:
                - description: Only this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - open
                        - arrived_in_time
                        - late
                        - timed_out
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrivalReviewList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List late-arrival reviews
            tags:
                - reviews
            x-permission: reviews.read
    /admin/arrival-reviews/{review_id}/decision:
        post:
            description: 'arrived_in_time stops the timer at the rider''s evidence and takes back a credit still owed; late keeps the miss and its credit. Errors: review_closed, credit_applied (both 409; credit_applied when the credit was already given). Permission: reviews.decide.'
            operationId: decideArrivalReview
            parameters:
                - description: The id.
                  in: path
                  name: review_id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Id'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ArrivalDecision'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ArrivalReviewResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Decide a late-arrival review
            tags:
                - reviews
            x-permission: reviews.decide
    /admin/audit:
        get:
            description: 'Newest first. Read-only. Password hashes, TOTP secrets and full phone numbers are never in before or after. Permission: audit.read.'
            operationId: listAuditEvents
            parameters:
                - description: From this time.
                  in: query
                  name: from
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: Before this time.
                  in: query
                  name: to
                  required: false
                  schema:
                    format: date-time
                    type: string
                - description: Only this actor.
                  in: query
                  name: actor_id
                  required: false
                  schema:
                    maxLength: 64
                    type: string
                - description: Only this action, such as order.handed_over.
                  in: query
                  name: action
                  required: false
                  schema:
                    maxLength: 80
                    type: string
                - description: Only this kind of thing, such as order, zone or lot.
                  in: query
                  name: entity_type
                  required: false
                  schema:
                    maxLength: 40
                    type: string
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Search the audit log
            tags:
                - audit
            x-permission: audit.read
    /admin/flags:
        get:
            description: 'Admin. Permission: flags.manage.'
            operationId: listFlags
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FlagList'
                    description: Done.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: List feature flags
            tags:
                - flags
            x-permission: flags.manage
    /admin/flags/{flag_key}:
        put:
            description: 'Creates an approval; a second admin applies it. Errors: approval_pending (409) if one is already waiting. Permission: flags.manage.'
            operationId: requestFlagChange
            parameters:
                - description: The flag.
                  in: path
                  name: flag_key
                  required: true
                  schema:
                    pattern: ^[a-z][a-z0-9_]{1,60}$
                    type: string
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FlagChange'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApprovalResponse'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "409":
                    $ref: '#/components/responses/Conflict'
                "422":
                    $ref: '#/components/responses/IdempotencyKeyReused'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
                "500":
                    $ref: '#/components/responses/InternalError'
            summary: Ask to change a feature flag
            tags:
                - flags
            x-permission: flags.manage
    /admin/gates:
        get:
            description: 'Newest first, optionally in one zone. Customers add gates; the console edits and verifies them. Permission: gates.read.'
            operationId: listAdminGates
            parameters:
                - description: Only this zone.
                  in: query
                  name: zone_id
                  required: false
                  schema:
                    $ref: '#/components/schemas/Id'
                - description: From next_cursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    maxLength: 200
                    type: string
                - description: 1 to 100. 50 by default.
                  in: query
                  name: limit
                  required: false
                  schema:
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminGateList'
                    description: Done.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
