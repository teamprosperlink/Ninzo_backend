    post:
      tags:
      - delivery
      operationId: handOver
      summary: Hand over the order
      description: 'Sends the OTP the customer shows, and the quantities. Recorded once. Queue the event
        first, and use its event_id as the Idempotency-Key, so the direct and queued paths count as one.
        A repeat by the same rider after success returns success. Allowed from PACKED, TIMER_RUNNING or
        ARRIVED, and from RIDER_ACCEPTED once the code was released after a lost signal. Rejected with
        rider_not_near if the handover is current and fresh GPS shows the rider away from the gate.
        Errors, all 409: wrong_otp, otp_attempts_exceeded, handover_not_allowed, rider_not_near,
        order_cancelled, order_reassigned.'
