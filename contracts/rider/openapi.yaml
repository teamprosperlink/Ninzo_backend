  /scooters/{code}/telemetry:
    post:
      tags:
      - shift
      operationId: reportScooterTelemetry
      summary: Report a scooter's battery
      description: >-
        Called by the scooter, or the fleet system for it, never by the rider app. It is signed with a key
        that belongs to this one scooter (X-Telemetry-Key), made when the scooter is added in the console.
        There is no key shared by all scooters, so a key that leaks from one scooter cannot report for
        another, and the console can replace one scooter's key alone. A key that does not belong to the scooter
        in the path gets 401. Only a newer reading replaces the one kept, and a reading older than 30 minutes is
        not shown to the rider (the shift's scooter.battery_pct). It has no rider sign-in
        because the caller is a machine. It takes no Idempotency-Key, because the same reading sent twice is harmless.
      security: []
      parameters:
      - name: code
        in: path
        required: true
        description: The scooter code shown on the vehicle.
        schema:
          type: string
          minLength: 1
      - name: X-Telemetry-Key
        in: header
        required: true
        description: The key of this scooter. Not a key for the fleet.
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - battery_pct
              - at
              example:
                battery_pct: 72
                at: '2026-11-12T06:00:00Z'
              properties:
                battery_pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                at:
                  type: string
                  format: date-time
                  description: When the scooter read it. At most a minute ahead of the server.
      responses:
        '202':
          description: Kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/stock/{lot_id}/quarantine:
    post:
      tags:
      - stock
      operationId: quarantineLot
      summary: Take a lot off the scooter into quarantine
      description: >-
        For the rider app's prompt after a temperature alert, or food the rider finds damaged (Issue 235).
        The lot leaves the scooter's stock and can never be scanned again.
        Errors, all 409: no_open_shift, lot_not_on_scooter, lot_reserved (part of it is held for an order).
        With lot_reserved the lot is still quarantined and the units no order holds are taken out of sale and off the
        scooter at once; the units an order holds stay with that order, so that order is not broken. If those held units
        are bad, the rider reports a problem on that order. Asking again changes nothing while the order holds them,
        and takes out what the order gives back. A lot already quarantined by this rider answers 200 again, wherever
        the lot is now. A lot of another rider's scooter, on no scooter, or that does not exist gets 404.
      parameters:
      - $ref: '#/components/parameters/LotId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              example:
                reason: temperature
              properties:
                reason:
                  type: string
                  enum:
                  - temperature
                  - damaged
                  - expired
                  - other
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Quarantined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /orders/{order_id}/gate-check:
    post:
      tags:
      - delivery
      operationId: checkGate
      summary: Check the gate's QR code or code
      description: >-
        For the rider app (Issue 235). Compares what the rider scanned or typed with the gate.
        It changes nothing, so it takes no Idempotency-Key. It is accepted and answered, but it never decides
        arrival. Arrival and the timer's stop come from the rider's location alone (decision 0007), so a
        matched false does not block the handover and a matched true does not mark the rider as arrived.
        For method qr the value is NZG|<gate id>, compared with the id of the gate the order was placed to:
        checked is true, and matched is true or false (a value in any other shape is checked true, matched false). For method
        code, no gate has a typed code, so checked is false and matched is true. The order must be one this rider accepted
        and still holds, and not finished, or 404.
      parameters:
      - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - value
              example:
                method: code
                value: GATE-4821
              properties:
                method:
                  type: string
                  enum:
                  - qr
                  - code
                value:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateCheck'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shift-plan:
    get:
      tags:
      - shift
      operationId: getShiftPlan
      summary: Get today's planned shift
      description: >-
        For the rider app (Issue 235). Shifts are open-ended, so there is no plan unless operations make one for the day.
        With none, plan is null (an empty plan) and the rider starts a shift whenever they like. When
        operations did make one, it holds when the shift is planned to start and end (informative, nothing ends
        the shift), the morning stock request, and how the hub's packing is going. Today is the zone's local day.
      responses:
        '200':
          description: Today's plan, or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPlanResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shift-plan/reply:
    post:
      tags:
      - shift
      operationId: replyToShiftPlan
      summary: Answer the morning stock request
      description: >-
        For the rider app (Issue 235). coming lets the hub pack the rider's stock, and not_today tells it not to.
        The reply is accepted and recorded, and the answer can change until the hub starts packing.
        Errors: 404 not_found when there is no plan today, and 409 shift_plan_closed once packing has started.
        The shift's start time passing does not close it, because shifts are open-ended.
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reply
              example:
                reply: coming
              properties:
                reply:
                  type: string
                  enum:
                  - coming
                  - not_today
      responses:
        '200':
          description: The plan, with the answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPlanResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from the sign-in endpoints.
  parameters:
    OfferId:
      name: offer_id
      in: path
      required: true
      description: The offer.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    OrderId:
      name: order_id
      in: path
      required: true
      description: The order.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    ShiftId:
      name: shift_id
      in: path
      required: true
      description: The shift.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    RestockRequestId:
      name: request_id
      in: path
      required: true
      description: The restock request or suggestion.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    LotId:
      name: lot_id
      in: path
      required: true
      description: The lot, as getStock lists it.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
  schemas:
    Done:
      type: object
      required:
      - server_time
      properties:
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OtpRequestResult:
      type: object
      required:
      - request_id
      - expires_in_s
      - resend_after_s
      - server_time
      properties:
        request_id:
          type: string
        expires_in_s:
          type: integer
          minimum: 1
          example: 300
        resend_after_s:
          type: integer
          minimum: 0
          example: 30
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderSession:
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in_s
      - rider_id
      - status
      - server_time
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_s:
          type: integer
          minimum: 1
          example: 900
        rider_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        status:
          type: string
          description: Open list, including applicant and active. A suspended rider gets account_blocked instead of a session. An applicant can only apply and see progress.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Rider:
      type: object
      required:
      - id
      - name
      - status
      - zone_id
      - created_at
      - approved_at
      - preferred_area
      - email
      - area
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        preferred_area:
          description: The area the rider says they want to work in, free text up to 80 characters. Null until set. The zone itself is an ops decision.
          type:
          - string
          - 'null'
          maxLength: 80
        name:
          description: Null until an applicant fills it in.
          type:
          - string
          - 'null'
        phone:
          description: The number the rider signs in with. Left out only if the account has no number.
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        email:
          description: Contact only. It never signs anyone in. Null when not given. Always sent.
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
        area:
          description: >-
            Where the rider wants to work, as the rider app sends it while applying. Null when not given. The server
            keeps the place's name as preferred_area. Always sent.
          oneOf:
          - $ref: '#/components/schemas/RiderArea'
          - type: 'null'
        zone_id:
          description: Null until a zone is set.
          anyOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
        status:
          type: string
          description: Open list, including applicant, active, suspended.
        created_at:
          description: When the account was made.
          type: string
          format: date-time
        approved_at:
          description: When the rider was approved. Null before approval.
          type:
          - string
          - 'null'
          format: date-time
    RiderResponse:
      type: object
      required:
      - rider
      - server_time
      properties:
        rider:
          $ref: '#/components/schemas/Rider'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    VerificationResponse:
      type: object
      required:
      - status
      - reason
      - documents
      - server_time
      properties:
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
          - expired
        reason:
          type:
          - string
          - 'null'
        documents:
          description: The status of each document, with the reason for a rejection. Empty until documents are recorded.
          type: array
          items:
            $ref: '#/components/schemas/VerificationDocument'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    VerificationDocument:
      type: object
      required:
      - type
      - status
      - reason
      properties:
        type:
          type: string
          description: Open list, including aadhaar, driving_licence, rc, insurance, photo.
        status:
          type: string
          enum:
          - pending
          - verified
          - rejected
        reason:
          description: Open list, including name_mismatch, photo_retake, expired, unreadable, other. Null unless rejected.
          type:
          - string
          - 'null'
    VerificationStart:
      type: object
      required:
      - redirect_url
      - upload_url
      - server_time
      properties:
        redirect_url:
          type:
          - string
          - 'null'
          format: uri
        upload_url:
          type:
          - string
          - 'null'
          format: uri
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    DeviceResponse:
      type: object
      required:
      - device_id
      - server_time
      properties:
        device_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Shift:
      type: object
      required:
      - id
      - node_id
      - started_at
      - ended_at
      - node_assigned_at
      - scooter
      - break_started_at
      - break_ends_at
      - device_id
      - online_at
      - planned_end_at
      - break
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        break_started_at:
          description: When the current break began. Null when the rider is not on a break.
          type:
          - string
          - 'null'
          format: date-time
        break_ends_at:
          description: When the current break ends on its own, at the console's longest break (max_break_s). Null when the rider is not on a break.
          type:
          - string
          - 'null'
          format: date-time
        device_id:
          description: The device the shift was started from. Null if startShift did not send one. The app compares it with its own device id.
          anyOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
        online_at:
          description: When the rider went online at their spot (goOnline). Null before. Always sent.
          type:
          - string
          - 'null'
          format: date-time
        planned_end_at:
          description: >-
            When the rider said the shift would end (setPlannedEnd), or the day's plan end. A record only,
            because shifts are open-ended. Null with none. Always sent.
          type:
          - string
          - 'null'
          format: date-time
        break:
          description: >-
            The break under way as the rider app reads it, the same facts as break_started_at and break_ends_at.
            Null when the rider is not on a break. Always sent.
          oneOf:
          - type: object
            required:
            - started_at
            - ends_at
            properties:
              started_at:
                type: string
                format: date-time
              ends_at:
                type: string
                format: date-time
          - type: 'null'
        node_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        node_assigned_at:
          description: When the rider was given this node. This is the shift start, or when the rider accepted the last move in the shift (the node changes at accept).
          type: string
          format: date-time
        scooter:
          description: The scooter on this shift.
          type: object
          required:
          - id
          - plate
          - battery_pct
          properties:
            id:
              $ref: ../shared/common.yaml#/components/schemas/Id
            plate:
              type: string
              description: The scooter code shown on the vehicle.
            battery_pct:
              description: Null until scooter data exists.
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
    ShiftResponse:
      type: object
      required:
      - shift
      - server_time
      properties:
        shift:
          $ref: '#/components/schemas/Shift'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderNotification:
      type: object
      required:
      - id
      - kind
      - title
      - body
      - order_id
      - created_at
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        kind:
          type: string
          description: Open list, including offer, restock, relocation, shift, support.
        title:
          type: string
        body:
          type: string
        order_id:
          description: The order this is about. Null when it is not about an order.
          anyOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
        created_at:
          type: string
          format: date-time
    RiderNotificationList:
      type: object
      required:
      - notifications
      - next_cursor
      - server_time
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/RiderNotification'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as cursor to get the next page. Null on the last page.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ShiftEntry:
      type: object
      required:
      - id
      - node_id
      - started_at
      - ended_at
      - online_s
      - break_s
      - orders_handed_over
      - online_at
      - planned_end_at
      - orders
      - portions
      - avg_delivery_s
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        node_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        online_s:
          type: integer
          minimum: 0
          description: The shift's length minus its breaks.
        break_s:
          type: integer
          minimum: 0
        orders_handed_over:
          type: integer
          minimum: 0
        online_at:
          description: When the rider went online at their spot. Null before. For the rider app (Issue 235). Always sent.
          type:
          - string
          - 'null'
          format: date-time
        planned_end_at:
          description: The planned end the rider set. A record only. For the rider app (Issue 235). Always sent.
          type:
          - string
          - 'null'
          format: date-time
        orders:
          description: The same count as orders_handed_over, under the name the rider app reads. Always sent.
          type: integer
          minimum: 0
        portions:
          description: Portions handed over on this shift. Always sent.
          type: integer
          minimum: 0
        avg_delivery_s:
          description: The average seconds from accept to handover. Null with no orders. Always sent.
          type:
          - integer
          - 'null'
          minimum: 0
    ShiftList:
      type: object
      required:
      - shifts
      - next_cursor
      - server_time
      properties:
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/ShiftEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as cursor to get the next page. Null on the last page.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ShiftSummary:
      type: object
      required:
      - shift_id
      - started_at
      - ended_at
      - online_s
      - break_s
      - orders_handed_over
      - avg_delivery_s
      - items_sold
      - items_returned
      - earnings
      - server_time
      properties:
        shift_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        online_s:
          type: integer
          minimum: 0
        break_s:
          type: integer
          minimum: 0
        orders_handed_over:
          type: integer
          minimum: 0
        avg_delivery_s:
          description: Average seconds from accept to handover. Null with no order handed over.
          type:
          - integer
          - 'null'
          minimum: 0
        items_sold:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        items_returned:
          description: Units that went back to the hub at shift end.
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        earnings:
          $ref: ../shared/common.yaml#/components/schemas/Money
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    StockCountLine:
      type: object
      required:
      - item_id
      - expected
      - counted
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        expected:
          type: integer
          minimum: 0
          description: What the server expects on the scooter.
        counted:
          type: integer
          minimum: 0
    StockCountResponse:
      type: object
      required:
      - counted
      - mismatches
      - server_time
      properties:
        counted:
          type: array
          items:
            $ref: '#/components/schemas/StockCountLine'
        mismatches:
          type: integer
          minimum: 0
          description: How many lines differ from what was expected.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderState:
      type: object
      description: Everything current for this rider. seq is compared with seq on the rider stream.
      required:
      - seq
      - shift
      - offers
      - current_order
      - restock_request
      - server_time
      properties:
        seq:
          type: integer
          minimum: 1
          example: 7
        shift:
          oneOf:
          - $ref: '#/components/schemas/Shift'
          - type: 'null'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        current_order:
          oneOf:
          - $ref: '#/components/schemas/RiderOrder'
          - type: 'null'
        restock_request:
          oneOf:
          - $ref: '#/components/schemas/RestockRequest'
          - type: 'null'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Node:
      type: object
      required:
      - id
      - name
      - fullness_pct
      - lat
      - lng
      - hub_distance_m
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        fullness_pct:
          type: integer
          minimum: 0
          maximum: 100
        lat:
          type: number
        lng:
          type: number
        hub_distance_m:
          description: Straight-line metres to the nearest active hub in the zone. Null if the zone has no active hub.
          type:
          - integer
          - 'null'
          minimum: 0
    RelocationSuggestion:
      type: object
      required:
      - id
      - node_id
      - reason
      - expires_at
      - orders_waiting
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        node_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        reason:
          type: string
          description: Short text, such as how many orders are expected.
          example: 3 orders expected, nobody nearby
        expires_at:
          type: string
          format: date-time
        orders_waiting:
          description: Orders expected near the node when this was made. Null for older suggestions.
          type:
          - integer
          - 'null'
          minimum: 0
    NodeList:
      type: object
      required:
      - nodes
      - assigned_node_id
      - relocation
      - server_time
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        assigned_node_id:
          type:
          - string
          - 'null'
          description: The node this rider is told to wait at.
        relocation:
          oneOf:
          - $ref: '#/components/schemas/RelocationSuggestion'
          - type: 'null'
          description: A suggestion only. It never blocks the screen.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    StockUnit:
      type: object
      required:
      - lot_id
      - item_id
      - expiry
      - temp_status
      properties:
        lot_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        expiry:
          type: string
          format: date-time
        temp_status:
          $ref: '#/components/schemas/TempStatus'
    TempStatus:
      type: string
      enum:
      - ok
      - alert
    StockUnitResponse:
      type: object
      required:
      - unit
      - server_time
      properties:
        unit:
          $ref: '#/components/schemas/StockUnit'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    StockLot:
      type: object
      required:
      - lot_id
      - item_id
      - qty
      - expiry
      - temp_status
      - image_url
      properties:
        lot_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        qty:
          type: integer
          minimum: 0
        expiry:
          type: string
          format: date-time
        temp_status:
          $ref: '#/components/schemas/TempStatus'
        image_url:
          description: The menu item photo. Null when the item has none.
          type:
          - string
          - 'null'
    StockList:
      type: object
      required:
      - lots
      - server_time
      properties:
        lots:
          type: array
          items:
            $ref: '#/components/schemas/StockLot'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OrderLine:
      type: object
      required:
      - item_id
      - name
      - qty
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        qty:
          type: integer
          minimum: 1
    Offer:
      type: object
      required:
      - id
      - order_id
      - items
      - gate
      - expires_at
      - state
      - fencing_token
      - order_number
      - total
      - payment_method
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        order_id:
          type:
          - string
          - 'null'
          description: Set once accepted.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        gate:
          type: object
          description: Where the rider is going.
          required:
          - id
          - label
          - lat
          - lng
          - entry_notes
          properties:
            id:
              $ref: ../shared/common.yaml#/components/schemas/Id
            label:
              type: string
            lat:
              type: number
            lng:
              type: number
            entry_notes:
              type:
              - string
              - 'null'
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - open
          - accepted
          - declined
          - expired
          - taken
          - cancelled
        fencing_token:
          type: string
          description: Fixed for the life of the offer. Send with accept, decline and Ready. A device
            holding a token from another offer is rejected with stale_fencing_token.
        order_number:
          description: Readable order number, a letter and four digits such as A2931.
          type: string
          pattern: '^[A-Z][0-9]{4}$'
        total:
          description: What the customer paid for the order. For the rider app (Issue 235). Always sent.
          $ref: ../shared/common.yaml#/components/schemas/Money
        payment_method:
          description: For the rider app (Issue 235). Always sent.
          $ref: '#/components/schemas/PaymentMethod'
    PaymentMethod:
      type: string
      description: >-
        How the order was paid. A closed list, with prepaid the only value today, so a new value needs a contract change. prepaid: paid online before the order was offered, so the rider
        collects nothing and the handover takes the customer's OTP.
      enum:
      - prepaid
    OfferList:
      type: object
      required:
      - offers
      - server_time
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderOrder:
      type: object
      description: What the rider sees of an order. It has no countdown fields. The rider sees a calm
        fixed label, so the clock never pressures the rider.
      required:
      - id
      - offer_id
      - fencing_token
      - state
      - seq
      - ended_reason
      - items
      - gate
      - timer_label
      - rider_accepted_at
      - otp_available
      - handed_over_at
      - order_number
      - waiting_since
      - total
      - payment_method
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        waiting_since:
          description: When the rider said they were waiting at the gate (markWaitingAtGate). Null until then.
          type:
          - string
          - 'null'
          format: date-time
        offer_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        fencing_token:
          type: string
          description: Send with Ready, including after a restart.
        state:
          $ref: ../shared/common.yaml#/components/schemas/OrderState
        ended_reason:
          type:
          - string
          - 'null'
          description: Set when this rider no longer has the order. Open list, including cancelled, reassigned,
            failed, timed_out.
        seq:
          type: integer
          minimum: 1
          description: The rider's current seq when this was read.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        gate:
          type: object
          description: Where the rider is going.
          required:
          - id
          - label
          - lat
          - lng
          - entry_notes
          properties:
            id:
              $ref: ../shared/common.yaml#/components/schemas/Id
            label:
              type: string
            lat:
              type: number
            lng:
              type: number
            entry_notes:
              type:
              - string
              - 'null'
        timer_label:
          type: string
          description: A fixed label built from this order's timer length. It does not count down.
          example: 1.5 mins
        rider_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        otp_available:
          type: boolean
          description: True once the customer has the OTP to show. Offline, this value may be stale, so
            the app must still allow the rider to enter an OTP.
        handed_over_at:
          type:
          - string
          - 'null'
          format: date-time
        order_number:
          description: Readable order number, a letter and four digits such as A2931.
          type: string
          pattern: '^[A-Z][0-9]{4}$'
        total:
          description: What the customer paid for the order. For the rider app (Issue 235). Always sent.
          $ref: ../shared/common.yaml#/components/schemas/Money
        payment_method:
          description: For the rider app (Issue 235). Always sent.
          $ref: '#/components/schemas/PaymentMethod'
    OrderResponse:
      type: object
      required:
      - order
      - server_time
      properties:
        order:
          $ref: '#/components/schemas/RiderOrder'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RouteResponse:
      type: object
      required:
      - polyline
      - eta_source
      - eta_s
      - server_time
      properties:
        polyline:
          type: string
        eta_source:
          $ref: ../shared/common.yaml#/components/schemas/EtaSource
        eta_s:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Set only when eta_source is measured.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    HandoverQuantity:
      type: object
      required:
      - item_id
      - qty
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        qty:
          type: integer
          minimum: 0
          description: Below the ordered quantity means a partial handover.
    MaskedCall:
      type: object
      required:
      - phone
      - expires_at
      - server_time
      properties:
        phone:
          type: string
          description: A masked number, not the customer's own.
        expires_at:
          type: string
          format: date-time
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    LocationAccepted:
      type: object
      required:
      - next_ping_s
      - server_time
      properties:
        next_ping_s:
          type: integer
          minimum: 1
          description: Seconds until the next ping. About 2 to 3 from packed to arrived, and slower otherwise.
          example: 3
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OfflineEvent:
      description: One queued action. Each type has its own payload.
      oneOf:
      - $ref: '#/components/schemas/LocationEvent'
      - $ref: '#/components/schemas/HandoverEvent'
      - $ref: '#/components/schemas/ProblemEvent'
      - $ref: '#/components/schemas/RestockConfirmEvent'
      - $ref: '#/components/schemas/RestockDeclineEvent'
      - $ref: '#/components/schemas/StockScanEvent'
      discriminator:
        propertyName: type
        mapping:
          location: '#/components/schemas/LocationEvent'
          handover: '#/components/schemas/HandoverEvent'
          problem: '#/components/schemas/ProblemEvent'
          restock_confirm: '#/components/schemas/RestockConfirmEvent'
          restock_decline: '#/components/schemas/RestockDeclineEvent'
          stock_scan: '#/components/schemas/StockScanEvent'
    LocationEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: location
        payload:
          $ref: '#/components/schemas/LocationEventPayload'
        device_time:
          type: string
          format: date-time
    HandoverEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: handover
        payload:
          $ref: '#/components/schemas/HandoverEventPayload'
        device_time:
          type: string
          format: date-time
    ProblemEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: problem
        payload:
          $ref: '#/components/schemas/ProblemEventPayload'
        device_time:
          type: string
          format: date-time
    RestockConfirmEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: restock_confirm
        payload:
          $ref: '#/components/schemas/RestockEventPayload'
        device_time:
          type: string
          format: date-time
    RestockDeclineEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: restock_decline
        payload:
          $ref: '#/components/schemas/RestockEventPayload'
        device_time:
          type: string
          format: date-time
    StockScanEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: stock_scan
        payload:
          $ref: '#/components/schemas/StockScanEventPayload'
        device_time:
          type: string
          format: date-time
    LocationEventPayload:
      type: object
      description: For type location.
      required:
      - lat
      - lng
      - speed_mps
      - accuracy_m
      properties:
        lat:
          type: number
        lng:
          type: number
        speed_mps:
          type: number
          minimum: 0
        accuracy_m:
          type: number
          minimum: 0
    HandoverEventPayload:
      type: object
      description: For type handover.
      required:
      - order_id
      - otp
      - quantities
      properties:
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        otp:
          type: string
          pattern: ^[0-9]{4,8}$
        quantities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HandoverQuantity'
    ProblemEventPayload:
      type: object
      description: For type problem.
      required:
      - problem_type
      properties:
        problem_type:
          type: string
          enum:
          - breakdown
          - accident
          - gate_closed
          - customer_absent
          - unsafe_route
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        note:
          type: string
          maxLength: 1000
    RestockEventPayload:
      type: object
      description: For types restock_confirm and restock_decline.
      required:
      - request_id
      properties:
        request_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        reason:
          type: string
          maxLength: 200
        quantity_override:
          type: array
          items:
            $ref: '#/components/schemas/RestockLineRequest'
    StockScanEventPayload:
      type: object
      description: For type stock_scan.
      required:
      - lot_code
      properties:
        lot_code:
          type: string
    RejectedEvent:
      type: object
      required:
      - id
      - code
      - message
      - retryable
      properties:
        id:
          type: string
        code:
          type: string
          description: Open list. See Rider offline events in contracts/README.md.
        message:
          type: string
        retryable:
          type: boolean
    EventBatchResult:
      type: object
      required:
      - accepted_ids
      - rejected
      - server_time
      properties:
        accepted_ids:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedEvent'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockLineRequest:
      type: object
      required:
      - item_id
      - qty
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        qty:
          type: integer
          minimum: 1
          maximum: 500
    RestockLine:
      type: object
      required:
      - item_id
      - name
      - qty
      - filled_qty
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
          example: Burger
        qty:
          type: integer
          minimum: 1
        filled_qty:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Set once the hub has packed. Below qty means a short fill.
    RestockOption:
      type: object
      required:
      - item_id
      - name
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
    RestockOptions:
      type: object
      required:
      - hubs
      - items
      - server_time
      properties:
        hubs:
          type: array
          items:
            $ref: '#/components/schemas/RestockOptionHub'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestockOption'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockShortfall:
      type: object
      description: What the hub could not fill, and what it offers instead.
      required:
      - action
      - substitute
      - other_hub
      properties:
        action:
          type: string
          enum:
          - partial
          - substitute
          - other_hub
        substitute:
          oneOf:
          - $ref: '#/components/schemas/RestockOption'
          - type: 'null'
        other_hub:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/HubRef'
            - type: object
              required:
              - distance_m
              properties:
                distance_m:
                  description: Straight-line metres from the rider's node to this hub. Null if it cannot be worked out.
                  type:
                  - integer
                  - 'null'
                  minimum: 0
          - type: 'null'
    RestockSuggestion:
      type: object
      required:
      - id
      - hub
      - items
      - expires_at
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        hub:
          $ref: '#/components/schemas/HubRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestockLine'
        expires_at:
          type: string
          format: date-time
    HubRef:
      type: object
      required:
      - id
      - name
      - lat
      - lng
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
    RestockSuggestionList:
      type: object
      required:
      - suggestions
      - server_time
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RestockSuggestion'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockRequest:
      type: object
      required:
      - id
      - state
      - hub
      - items
      - slot_at
      - arrive_by
      - lot_numbers
      - shortfall
      - ready_in_s
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        state:
          type: string
          enum:
          - suggested
          - confirmed
          - hub_accepted
          - packing
          - ready
          - picked_up
          - received
          - closed
          - expired
          - cancelled
          - partial
        hub:
          $ref: '#/components/schemas/HubRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestockLine'
        shortfall:
          oneOf:
          - $ref: '#/components/schemas/RestockShortfall'
          - type: 'null'
        slot_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The hub's queue slot.
        arrive_by:
          type:
          - string
          - 'null'
          format: date-time
          description: When the rider should arrive.
        lot_numbers:
          type: array
          description: The lots in the cassette, set at ready. The rider's scan is checked against these.
          items:
            type: string
        ready_in_s:
          description: Seconds from now to the hub slot, never below 0. Null without a slot.
          type:
          - integer
          - 'null'
          minimum: 0
    RestockResponse:
      type: object
      required:
      - request
      - server_time
      properties:
        request:
          $ref: '#/components/schemas/RestockRequest'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ProblemResponse:
      type: object
      required:
      - report_id
      - server_time
      properties:
        report_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OrderEarning:
      type: object
      required:
      - order_id
      - amount
      properties:
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
    Earnings:
      type: object
      required:
      - date
      - orders
      - order_earnings
      - incentives
      - total
      - repositioning
      - repositioning_seconds
      - server_time
      properties:
        date:
          type: string
          format: date
        orders:
          type: integer
          minimum: 0
          description: How many orders.
        order_earnings:
          type: array
          items:
            $ref: '#/components/schemas/OrderEarning'
        total:
          $ref: ../shared/common.yaml#/components/schemas/Money
        incentives:
          $ref: ../shared/common.yaml#/components/schemas/Money
        repositioning:
          $ref: ../shared/common.yaml#/components/schemas/Money
          description: Pay for repositioning time. total is the order earnings, incentives and this.
        repositioning_seconds:
          type: integer
          minimum: 0
          description: Repositioning is paid time.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderArea:
      type: object
      description: A place the rider picked, such as a town or a junction.
      required:
      - name
      - city
      - lat
      - lng
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          maxLength: 80
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    DocumentKind:
      type: string
      description: The names the rider app sends. They are not the names verification lists, so the server maps them.
      enum:
      - aadhaar
      - drivingLicence
      - vehicleRc
      - selfie
      - bank
    DocumentSide:
      type: string
      enum:
      - front
      - back
      - photo
    RiderDocumentInfo:
      type: object
      description: What is known of one uploaded photo. The photo itself is in file storage and is never sent back.
      required:
      - document
      - side
      - content_type
      - size_bytes
      - uploaded_at
      properties:
        document:
          $ref: '#/components/schemas/DocumentKind'
        side:
          $ref: '#/components/schemas/DocumentSide'
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        uploaded_at:
          type: string
          format: date-time
    RiderDocumentResponse:
      type: object
      required:
      - document
      - server_time
      properties:
        document:
          $ref: '#/components/schemas/RiderDocumentInfo'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderDocumentList:
      type: object
      required:
      - documents
      - server_time
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/RiderDocumentInfo'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderChoice:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
        label:
          type: string
        hint:
          type: string
        check:
          description: >-
            Checklist items only. What the app checks itself. manual is the rider's tick, and phone_battery,
            scooter_battery and location are checked by the app.
          type: string
    RiderSettings:
      type: object
      description: What the rider app works by, from the rider's zone settings in the console. Null where the zone has no value.
      required:
      - stock_request_ask_before_s
      - stock_request_reminder_before_s
      - shift_ending_soon_before_s
      - break_extension_s
      - not_at_gate_after_s
      - handover_code_length
      - cancel_pay_cap
      - verification_within_s
      - timer_length_s
      - max_break_s
      - arrive_m
      - almost_there_m
      - away_from_spot_m
      - low_stock_qty
      - scooter_capacity_qty
      - min_phone_battery_pct
      - min_scooter_battery_pct
      - low_scooter_battery_pct
      - ride_speed_kmh
      - break_options_s
      - add_time_options_s
      - skip_reasons
      - problem_types
      - checklist
      properties:
        timer_length_s:
          description: The console's timer length, 90 seconds by default. The rider never sees a countdown, only a fixed label.
          type:
          - integer
          - 'null'
        max_break_s:
          description: The console's longest break. No break option is longer, and takeBreak is capped by it.
          type:
          - integer
          - 'null'
        arrive_m:
          description: How close to the hub, the spot or the gate counts as there.
          type:
          - integer
          - 'null'
        almost_there_m:
          type:
          - integer
          - 'null'
        away_from_spot_m:
          type:
          - integer
          - 'null'
        low_stock_qty:
          description: Fewer portions of an item than this suggests a refill.
          type:
          - integer
          - 'null'
        scooter_capacity_qty:
          type:
          - integer
          - 'null'
        min_phone_battery_pct:
          type:
          - integer
          - 'null'
        min_scooter_battery_pct:
          type:
          - integer
          - 'null'
        low_scooter_battery_pct:
          type:
          - integer
          - 'null'
        ride_speed_kmh:
          description: The straight-line speed used for ride times, until real road times.
          type:
          - integer
          - 'null'
        break_options_s:
          type: array
          items:
            type: integer
        add_time_options_s:
          type: array
          items:
            type: integer
        skip_reasons:
          type: array
          items:
            $ref: '#/components/schemas/RiderChoice'
        problem_types:
          description: >-
            Each code must be one of the reportProblem type values (breakdown, accident, gate_closed, customer_absent, unsafe_route),
            because the app sends the code straight into reportProblem. The settings never offer any other.
          type: array
          items:
            $ref: '#/components/schemas/RiderChoice'
        checklist:
          description: The Before you start items. Each code can be sent in startShift checklist.
          type: array
          items:
            $ref: '#/components/schemas/RiderChoice'
        stock_request_ask_before_s:
          description: How long before the planned start the app asks if the rider is coming.
          type: integer
        stock_request_reminder_before_s:
          description: When a rider who has not answered is reminded.
          type: integer
        shift_ending_soon_before_s:
          type: integer
        break_extension_s:
          description: What "+15 min" adds to a break.
          type: integer
        not_at_gate_after_s:
          description: How long the handover's code step waits, empty, before offering "Customer not at the gate?".
          type: integer
        handover_code_length:
          description: Digits in the customer's handover code.
          type: integer
        cancel_pay_cap:
          description: >-
            The most a cancelled prepaid order pays for the trip. Under it, the order's price. It is paid only
            when the rider had already started moving toward the gate.
          $ref: ../shared/common.yaml#/components/schemas/Money
        verification_within_s:
          description: How soon operations usually check a rider's documents.
          type: integer
    RiderSettingsResponse:
      type: object
      required:
      - settings
      - server_time
      properties:
        settings:
          $ref: '#/components/schemas/RiderSettings'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderHelp:
      type: object
      required:
      - faq
      - server_time
      properties:
        faq:
          type: array
          items:
            type: object
            required:
            - id
            - question
            - answer
            properties:
              id:
                $ref: ../shared/common.yaml#/components/schemas/Id
              question:
                type: string
              answer:
                type: string
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    FeedbackResponse:
      type: object
      required:
      - feedback_id
      - server_time
      properties:
        feedback_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    GateCheck:
      type: object
      required:
      - checked
      - matched
      - server_time
      properties:
        checked:
          description: False when there is nothing to check against (a typed code, which no gate has). True for a scanned QR. Arrival is by location either way.
          type: boolean
        matched:
          type: boolean
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    QuarantineResponse:
      type: object
      required:
      - lot_id
      - quarantined_at
      - server_time
      properties:
        lot_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        quarantined_at:
          type: string
          format: date-time
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ShiftPlan:
      type: object
      description: >-
        One day's plan for the rider, made by operations. Shifts are open-ended, so starts_at and ends_at
        are a guide and nothing starts or ends a shift at them.
      required:
      - id
      - date
      - node_id
      - starts_at
      - ends_at
      - stock_reply
      - replied_at
      - packing
      - ready_at
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        date:
          description: The day, in the zone's local time.
          type: string
          format: date
        node_id:
          description: Where the shift is planned to start. Null if operations have not chosen yet.
          anyOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        stock_reply:
          description: The rider's answer to the morning stock request. The hub packs only after coming.
          type: string
          enum:
          - pending
          - coming
          - not_today
        replied_at:
          type:
          - string
          - 'null'
          format: date-time
        packing:
          description: 'The hub packing the day''s stock: not_started, packing, then ready.'
          type: string
          enum:
          - not_started
          - packing
          - ready
        ready_at:
          description: When the stock was ready, or when the hub expects it to be while packing. Null before packing.
          type:
          - string
          - 'null'
          format: date-time
    ShiftPlanResponse:
      type: object
      required:
      - plan
      - server_time
      properties:
        plan:
          description: Null on a day with no plan, which is the usual day.
          oneOf:
          - $ref: '#/components/schemas/ShiftPlan'
          - type: 'null'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockOptionHub:
      description: A hub the rider can order from, with the number for Call hub manager.
      allOf:
      - $ref: '#/components/schemas/HubRef'
      - type: object
        required:
        - manager_phone
        properties:
          manager_phone:
            description: The hub manager's number, for Call hub manager in the rider app. Null until the hub has one. Always sent.
            type:
            - string
            - 'null'
            pattern: '^\+[1-9][0-9]{7,14}$'
