openapi: 3.1.0
info:
  title: Ninzo rider API
  version: 0.1.0
  description: >-
    The API behind the rider app. The shared rules are in contracts/README.md. Field names
    are final only after the contract review. Until the partner API exists, hub actions come from a simulator.


    The finished rider APK was built against a copy of this API (Issue 235), so this contract also holds
    every call the APK makes, with its paths, its request fields and the fields it reads. Our own
    operations stay as they were. Where the APK uses another path for something we already do, the
    APK's path is a second operation marked "Alias" in its summary. Where both use one path, the
    operation accepts both shapes and the reply carries both sets of fields. Fields added for the APK
    are optional until the server sends them (part B of Issue 235). These owner rules hold while the APK is served.


    Shifts are open-ended. A shift plan exists only when operations create one, otherwise getShiftPlan
    returns plan null, and an answer to a plan is accepted and recorded. A planned end or added time (setPlannedEnd)
    is accepted and recorded, and nothing forces the shift to end at it. A break length the rider picks
    (takeBreak) is capped by the console's max_break_s. Help articles come from the backend and are edited
    in the console. The gate code check (checkGate) is accepted, but arrival is still decided by the rider's
    location. Masked calls stay call_not_available until a provider is chosen, and the provider's call bridge
    (with a key in its URL) is not part of this contract. Scooter telemetry is signed with a key of its own for
    each scooter, never one shared key. Document photos go to file storage (Supabase Storage), never into a
    database column, and the contract shape stays the one the APK sends. After wrong sign-in codes the APK is
    told otp_attempts_exceeded with Retry-After. That pause counts wrong codes against one sign-in request
    (request_id), never against a phone number, so a stranger's wrong codes cannot block the number's owner
    from verifying a code of their own request. The separate resend limit on requestOtp (otp_resend_limit)
    is counted per phone number and still exists, so someone can slow down code requests for a number, and
    the server must keep that limit generous and also count requests per caller. A cancelled order pays the
    rider only when the rider had already started moving toward the gate.
  contact:
    name: Ninzo backend
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://rider-api.example.invalid/v1
  description: Placeholder. Real URLs are published with the mock server.
security:
- bearerAuth: []
tags:
- name: auth
  description: Sign-in and tokens.
- name: profile
  description: The rider, verification and devices.
- name: shift
  description: Shifts and staging nodes.
- name: stock
  description: Stock on the scooter.
- name: offers
  description: Offers, accept and Ready.
- name: delivery
  description: Route and handover.
- name: location
  description: Location pings and offline sync.
- name: restock
  description: Restock suggestions and requests.
- name: support
  description: Problems and earnings.
paths:
  /auth/otp/request:
    post:
      tags:
      - auth
      operationId: requestOtp
      summary: Send a sign-in code
      description: >-
        Indian mobile numbers only for now. The reply is the same whether or not the account exists,
        and no SMS is sent if it does not.
        Later errors on that request_id behave the same either way. Errors: invalid_phone (400) for a
        phone that is not an Indian mobile number in E.164 form, which the rider app shows as its invalid
        number screen (Issue 235, the customer contract keeps invalid_request for this),
        invalid_request (400) for a missing phone or a body that is not JSON, otp_resend_limit (429) when
        the resend limit is reached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  description: In E.164 format.
                  pattern: ^\+91[6-9][0-9]{9}$
                  example: '+919876543210'
      responses:
        '200':
          description: The code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResult'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/otp/verify:
    post:
      tags:
      - auth
      operationId: verifyOtp
      summary: Sign in with the code
      description: >-
        Errors: invalid_otp and otp_expired (both 400), otp_attempts_exceeded (429). After a
        correct code, a blocked person or suspended rider gets account_blocked (403).
        The rider app (Issue 235) reads the error code and the Retry-After header of a 429 and shows the
        pause. The pause after wrong codes counts against this request_id only. A stranger who sends wrong
        codes can spoil the request they hold, but not the requests of the number's owner. It does not
        stop the per-phone resend limit of requestOtp, which is a separate limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - otp
              properties:
                request_id:
                  type: string
                otp:
                  type: string
                  pattern: ^[0-9]{4,8}$
                  example: '123456'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderSession'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: '../shared/common.yaml#/components/responses/Forbidden'
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshToken
      summary: Get a new token pair
      description: Send only one refresh at a time. See Sign-in in contracts/README.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: A new pair.
          content:
            application/json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/TokenPair
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/signout:
    post:
      tags:
      - auth
      operationId: signOut
      summary: Sign out on this device
      description: Ends this device's session, so its refresh token stops working. An access token already issued can work for up to 15 minutes more. Other devices stay signed in.
      responses:
        '200':
          description: Signed out. Doing it twice is fine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '401':
          $ref: '../shared/common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/common.yaml#/components/responses/InternalError'
        '503':
          $ref: '../shared/common.yaml#/components/responses/ServiceUnavailable'
  /riders/me:
    get:
      tags:
      - profile
      operationId: getRider
      summary: Get the signed-in rider
      description: Returns the rider's own profile.
      responses:
        '200':
          description: The rider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
    patch:
      tags:
      - profile
      operationId: updateRider
      summary: Update the rider's own profile
      description: >-
        Changes the name and the area the rider would like to work in. preferred_area is free
        text, what an applicant says they want; the rider's zone itself stays an ops decision at approval.
        The rider app (Issue 235) sends email and area instead. area is a place the rider picked (name, city,
        lat, lng), and the server keeps its name as preferred_area. Send preferred_area or area, not both,
        or the call gets 400. email null clears the email, and area null clears the area. A suspended rider
        gets 403. Send only the fields to change. Error: invalid_request (400), for a name outside 1 to 80 characters,
        a preferred_area over 80, or an email that is not an address. The only 409 is idempotency_in_progress.
        Direct only: not in the offline event batch.
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              example:
                name: Ravi Kumar
                preferred_area: Indiranagar
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                preferred_area:
                  type: string
                  maxLength: 80
                  description: Free text. Not a zone.
                email:
                  description: Contact only. It never signs anyone in. null clears it.
                  type:
                  - string
                  - 'null'
                  format: email
                  maxLength: 254
                area:
                  description: The place the rider picked while applying, as the rider app sends it. null clears it.
                  oneOf:
                  - $ref: '#/components/schemas/RiderArea'
                  - type: 'null'
      responses:
        '200':
          description: The updated rider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/state:
    get:
      tags:
      - profile
      operationId: getRiderState
      summary: Get everything current for this rider
      description: The authority for the rider stream. Fetch this before showing anything after a reconnect
        or a notification.
      responses:
        '200':
          description: The current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderState'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/verification:
    get:
      tags:
      - profile
      operationId: getVerification
      summary: Get document verification status
      description: Only verified riders can start a shift. Before anything is started the status is pending with reason not_started; a verification past its expiry is expired.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/verification/start:
    post:
      tags:
      - profile
      operationId: startVerification
      summary: Start document verification
      description: A stand-in until DigiLocker. It records a pending request, and ops check the documents by hand, so redirect_url and upload_url are null for now. Errors already_verified and verification_in_progress (both 409).
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - digilocker
                  - manual_upload
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStart'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/devices:
    post:
      tags:
      - profile
      operationId: registerRiderDevice
      summary: Register a device for push
      description: Registering a token that already exists updates it.
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - platform
              - push_token
              properties:
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                push_token:
                  type: string
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /riders/me/devices/{device_id}:
    delete:
      tags:
      - profile
      operationId: removeRiderDevice
      summary: Remove a device from push
      description: Called on sign-out.
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /riders/me/shifts/start:
    post:
      tags:
      - shift
      operationId: startShift
      summary: Start a shift
      description: 'A suspended rider gets 403. Errors, all 409: rider_not_approved, rider_not_verified,
        shift_already_open, shift_limit_reached, no_scooter_at_node. A free scooter waiting at the
        node becomes the rider''s for the shift. A node outside the rider''s zone gets 404.
        device_id must be one this rider registered with registerRiderDevice, or the call gets 400 unknown_device.
        A rider whose open shift shows another device (a reinstall, or a new phone) sends take_over: true: the
        open shift of this rider then gets the new device_id and is returned (200) instead of shift_already_open.
        take_over needs device_id. endShift works from any of the rider''s phones.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - node_id
              properties:
                node_id:
                  $ref: ../shared/common.yaml#/components/schemas/Id
                device_id:
                  description: The id from registerRiderDevice for this phone, which must be one this rider registered (400 unknown_device otherwise). It is kept on the shift, so the app can tell when the shift is open on another phone.
                  $ref: ../shared/common.yaml#/components/schemas/Id
                take_over:
                  type: boolean
                  default: false
                  description: Send true to move this rider's open shift to this phone. The shift gets the new device_id and is returned instead of shift_already_open. Needs device_id.
                checklist:
                  description: >-
                    The Before you start items the rider ticked, each once (a repeated or empty code is 400 invalid_request).
                    Kept with the shift. The rider app (Issue 235) sends it. Only codes listed in the checklist of getRiderSettings are stored;
                    any other code is ignored, not an error.
                    It is stored only when the shift is started by this call. When the reply is a take_over or a 409 shift_already_open, the checklist is not stored.
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/end:
    post:
      tags:
      - shift
      operationId: endShift
      summary: End the shift
      description: 'Errors, both 409: no_open_shift, order_in_progress.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/notifications:
    get:
      tags:
      - profile
      operationId: listRiderNotifications
      summary: List what was pushed to the rider
      description: 'What the server pushed to this rider, newest first, kept for 30 days. kind is an open list, including offer, restock, relocation, shift, support. A notification never carries the customer phone or address.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/Cursor
      - $ref: ../shared/common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: One page, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderNotificationList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts:
    get:
      tags:
      - shift
      operationId: listRiderShifts
      summary: "List the rider's earlier shifts (also the rider app's listShifts)"
      description: >-
        The rider's shifts, newest first. online_s is the shift's length minus its breaks, worked out by the server; an open shift is counted to now.
        from and to are optional dates in the zone's local time and keep only shifts that started in that range. A from after to is 400 invalid_request.
        The rider app (Issue 235) calls this path as listShifts with days instead, the last days days in India time, today included,
        from 1 to 31 (the app sends 7). Without days, from, to, cursor and limit work as above. days with from, to, cursor or limit is 400 invalid_request. Each entry also carries online_at, planned_end_at,
        orders, portions and avg_delivery_s, which the app reads. With days the reply holds every matching shift, at most 1000
        (31 days of real shifts never come near that), and next_cursor is null, because the app does not page. A suspended rider can still read this.
      parameters:
      - name: days
        in: query
        required: false
        description: The rider app's way to ask. How many days back, today included.
        schema:
          type: integer
          minimum: 1
          maximum: 31
      - name: from
        in: query
        required: false
        description: First day to include, in the zone's local time.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Last day to include, in the zone's local time.
        schema:
          type: string
          format: date
      - $ref: ../shared/common.yaml#/components/parameters/Cursor
      - $ref: ../shared/common.yaml#/components/parameters/Limit
      responses:
        '200':
          description: One page, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftList'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/{shift_id}/summary:
    get:
      tags:
      - shift
      operationId: getShiftSummary
      summary: Get the summary of one shift
      description: 'Orders handed over, average time from accept to handover, what was sold, what came back to the hub
        at shift end, and what the shift earned. The shift id comes from startShift or listRiderShifts. A shift that
        belongs to another rider gets 404. On an open shift the figures count up to now, and items_returned is empty until the shift ends.'
      parameters:
      - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSummary'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/breaks/start:
    post:
      tags:
      - shift
      operationId: startBreak
      summary: Start a break
      description: 'Pauses offers until the break ends. The rider needs an open shift. Errors, all 409: order_in_progress (an order is live), offer_open (an offer is waiting for an answer, so answer it first), no_open_shift, on_break. A restock in progress does not stop a break. The longest break is a console setting (max_break_s), and after it the break ends on its own: break_ends_at on the shift is when. Ending the shift ends a break. A break start, end or automatic end raises the rider seq. Direct only: it is not in the offline event batch.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: The shift, now on break.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
