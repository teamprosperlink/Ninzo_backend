      - $ref: '#/components/parameters/OrderId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - otp
              - quantities
              - client_time
              properties:
                otp:
                  type: string
                  pattern: ^[0-9]{4,8}$
                quantities:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/HandoverQuantity'
                client_time:
                  type: string
                  format: date-time
                  description: Device time. The server sets the official time.
