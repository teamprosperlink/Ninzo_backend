version: "3"

# Skeleton. Adjust once go.mod exists. `task verify` is what the Stop hook and CI call.
tasks:
  build:
    cmds: ["go build ./..."]
  test:
    cmds: ["go test ./..."]
  vet:
    cmds: ["go vet ./..."]
  verify:
    desc: Everything that must pass before a commit or merge
    cmds:
      - task: vet
      - task: test
      - task: contracts:lint
  contracts:lint:
    desc: Lint the API contracts
    cmds: ["npx --yes @stoplight/spectral-cli@6.17.0 lint --fail-severity=warn 'contracts/**/*.yaml'"]
  contracts:bundle:
    desc: Write the single-file contracts and the Bruno collection
    cmds: ["go run ./cmd/contract-bundle"]
  mock:
    desc: Run the mock server on port 8080
    cmds: ["go run ./cmd/mock-server"]
  db:up:
    desc: Start local Postgres and Redis
    cmds: ["docker compose -f deploy/compose.yml up -d --wait"]
  # URLs are inline because the shell's environment beats env: and dotenv: in Task.
  # -local and -remote make the command refuse the wrong kind of target.
  db:migrate:
    desc: Apply migrations to local Postgres only
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/migrate -local up"]
  db:status:
    desc: Show migration status on local Postgres only
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/migrate -local status"]
  test:db:
    desc: Run the database tests on local Postgres, in throwaway databases
    cmds: ["TEST_DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' REQUIRE_DB_TESTS=yes go test -count=1 -p 1 ./tests/db/ ./cmd/migrate/ ./internal/platform/... ./internal/audit/ ./internal/identity/ ./internal/profile/ ./internal/geo/ ./internal/catalog/ ./internal/shifts/ ./internal/availability/ ./internal/orders/ ./internal/restock/ ./internal/relocation/ ./internal/earnings/ ./internal/hub/ ./internal/console/ ./cmd/riders/ ./cmd/console/ ./cmd/settings/ ./cmd/testdata/"]
  run:customer:
    desc: Run customer-api on port 8080, against local Postgres only
    cmds: ["APP_ENV=local LOG_LEVEL=debug HTTP_PORT=8080 GOOGLE_CLIENT_IDS=144794375699-vdlaflhhjmpfgdv8qscjlncp2909ea1l.apps.googleusercontent.com JWT_SIGNING_KEY=local-only-development-signing-key OTP_TEST_MODE=true OTP_TEST_CODE=123456 DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./apps/customer-api"]
  run:rider:
    desc: Run rider-api on port 8081, against local Postgres only
    cmds: ["APP_ENV=local LOG_LEVEL=debug HTTP_PORT=8081 JWT_SIGNING_KEY=local-only-development-signing-key OTP_TEST_MODE=true OTP_TEST_CODE=123456 DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./apps/rider-api"]
  run:partner:
    desc: Run partner-api on port 8082, against local Postgres only
    cmds: ["APP_ENV=local LOG_LEVEL=debug HTTP_PORT=8082 JWT_SIGNING_KEY=local-only-development-signing-key OTP_TEST_MODE=true OTP_TEST_CODE=123456 DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./apps/partner-api"]
  run:console:
    desc: Run console-api on port 8083, against local Postgres only
    cmds: ["APP_ENV=local LOG_LEVEL=debug HTTP_PORT=8083 JWT_SIGNING_KEY=local-only-development-signing-key DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./apps/console-api"]
  console:
    desc: "Add the first console admin, or reset a console user, on local Postgres. Example: task console -- add-admin -login asha.k -name \"Asha K\""
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/console -local {{.CLI_ARGS}}"]
  staging:console:
    desc: Add the first console admin, or reset a console user, on the database in .env. Asks first, and needs the owner's okay
    dotenv: [".env"]
    prompt: Change console users on the Supabase project in .env?
    cmds: ["go run ./cmd/console -remote {{.CLI_ARGS}}"]
  staging:status:
    desc: Show the target and migration status of the database in .env. Changes nothing
    dotenv: [".env"]
    cmds: ["go run ./cmd/migrate -remote status"]
  settings:
    desc: "Show or change order settings on local Postgres. Example: task settings -- set -reason why -by name timer_length_s=100"
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/settings -local {{.CLI_ARGS}}"]
  testdata:
    desc: Add the Bengaluru test zones and the test menu to local Postgres. Running it again changes nothing
    cmds:
      - "DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/testdata -local zones"
      - "DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/testdata -local menu"
      - "DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/testdata -local fleet"
      - "DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/testdata -local hubs"
      - "DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/testdata -local rider"
  staging:testdata:
    desc: Add the Bengaluru test zones and the test menu to the database in .env. Asks first, and needs the owner's okay
    dotenv: [".env"]
    prompt: Add the test zones, menu, fleet, hubs, rider and hub staff to the Supabase project in .env?
    cmds:
      - go run ./cmd/testdata -remote zones
      - go run ./cmd/testdata -remote menu
      - go run ./cmd/testdata -remote fleet
      - go run ./cmd/testdata -remote hubs
      - go run ./cmd/testdata -remote rider
      - go run ./cmd/testdata -remote staff
  riders:
    desc: "Approve a rider on local Postgres. Example: task riders -- approve -phone +919800000001 -zone ID -reason why -by name"
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/riders -local {{.CLI_ARGS}}"]
  staging:riders:
    desc: Approve a rider on the database in .env. Asks first, and needs the owner's okay
    dotenv: [".env"]
    prompt: Approve this rider on the Supabase project in .env?
    cmds: ["go run ./cmd/riders -remote {{.CLI_ARGS}}"]
  staging:settings:show:
    desc: Show the target and the order settings on the database in .env. Changes nothing
    dotenv: [".env"]
    cmds: ["go run ./cmd/settings -remote show {{.CLI_ARGS}}"]
  staging:settings:
    desc: "Change order settings on the database in .env. Shows the target, then asks. Example: task staging:settings -- -reason why -by name timer_length_s=100"
    cmds:
      - task: staging:settings:show
      - task: staging:settings:apply
        vars: {CLI_ARGS: "{{.CLI_ARGS}}"}
  staging:settings:apply:
    internal: true
    dotenv: [".env"]
    prompt: Change settings on the target shown above?
    cmds: ["go run ./cmd/settings -remote set {{.CLI_ARGS}}"]
  staging:migrate:
    desc: Show the target, ask, then apply migrations to the database in .env. Needs the owner's okay
    cmds:
      - task: staging:status
      - task: staging:apply
  staging:apply:
    internal: true
    dotenv: [".env"]
    prompt: Apply migrations to the target shown above?
    cmds: ["go run ./cmd/migrate -remote up"]
  db:down:
    desc: Stop local Postgres and Redis, keeping their data
    cmds: ["docker compose -f deploy/compose.yml down"]
