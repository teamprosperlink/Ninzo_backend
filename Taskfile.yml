version: "3"

# Skeleton. Adjust once go.mod exists. `task verify` is what the Stop hook and CI call.
tasks:
  build:
    cmds: ["go build ./..."]
  test:
    cmds: ["go test ./..."]
  vet:
    cmds: ["go vet ./..."]
  verify:
    desc: Everything that must pass before a commit or merge
    cmds:
      - task: vet
      - task: test
      - task: contracts:lint
  contracts:lint:
    desc: Lint the API contracts
    cmds: ["npx --yes @stoplight/spectral-cli@6.17.0 lint --fail-severity=warn 'contracts/**/*.yaml'"]
  contracts:bundle:
    desc: Write the single-file contracts and the Bruno collection
    cmds: ["go run ./cmd/contract-bundle"]
  mock:
    desc: Run the mock server on port 8080
    cmds: ["go run ./cmd/mock-server"]
  db:up:
    desc: Start local Postgres and Redis
    cmds: ["docker compose -f deploy/compose.yml up -d --wait"]
  # URLs are inline because the shell's environment beats env: and dotenv: in Task.
  # -local and -remote make the command refuse the wrong kind of target.
  db:migrate:
    desc: Apply migrations to local Postgres only
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/migrate -local up"]
  db:status:
    desc: Show migration status on local Postgres only
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/migrate -local status"]
  test:db:
    desc: Run the database tests on local Postgres, in throwaway databases
    cmds: ["TEST_DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' REQUIRE_DB_TESTS=yes go test -count=1 ./tests/db/ ./cmd/migrate/"]
  staging:status:
    desc: Show the target and migration status of the database in .env. Changes nothing
    dotenv: [".env"]
    cmds: ["go run ./cmd/migrate -remote status"]
  staging:migrate:
    desc: Show the target, ask, then apply migrations to the database in .env. Needs the owner's okay
    cmds:
      - task: staging:status
      - task: staging:apply
  staging:apply:
    internal: true
    dotenv: [".env"]
    prompt: Apply migrations to the target shown above?
    cmds: ["go run ./cmd/migrate -remote up"]
  db:down:
    desc: Stop local Postgres and Redis, keeping their data
    cmds: ["docker compose -f deploy/compose.yml down"]
