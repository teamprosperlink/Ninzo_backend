version: "3"

# Skeleton. Adjust once go.mod exists. `task verify` is what the Stop hook and CI call.
tasks:
  build:
    cmds: ["go build ./..."]
  test:
    cmds: ["go test ./..."]
  vet:
    cmds: ["go vet ./..."]
  verify:
    desc: Everything that must pass before a commit or merge
    cmds:
      - task: vet
      - task: test
      - task: contracts:lint
  contracts:lint:
    desc: Lint the API contracts
    cmds: ["npx --yes @stoplight/spectral-cli@6.17.0 lint --fail-severity=warn 'contracts/**/*.yaml'"]
  contracts:bundle:
    desc: Write the single-file contracts and the Bruno collection
    cmds: ["go run ./cmd/contract-bundle"]
  mock:
    desc: Run the mock server on port 8080
    cmds: ["go run ./cmd/mock-server"]
  db:up:
    desc: Start local Postgres and Redis
    cmds: ["docker compose -f deploy/compose.yml up -d --wait"]
  # URLs are inline because the shell's environment beats env: and dotenv: in Task.
  # -local and -remote make the command refuse the wrong kind of target.
  db:migrate:
    desc: Apply migrations to local Postgres only
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/migrate -local up"]
  db:status:
    desc: Show migration status on local Postgres only
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/migrate -local status"]
  test:db:
    desc: Run the database tests on local Postgres, in throwaway databases
    cmds: ["TEST_DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' REQUIRE_DB_TESTS=yes go test -count=1 -p 1 ./tests/db/ ./cmd/migrate/ ./internal/platform/... ./internal/audit/ ./internal/identity/ ./internal/profile/ ./internal/geo/ ./cmd/settings/"]
  run:customer:
    desc: Run customer-api on port 8080, against local Postgres only
    cmds: ["APP_ENV=local LOG_LEVEL=debug HTTP_PORT=8080 GOOGLE_CLIENT_IDS=144794375699-vdlaflhhjmpfgdv8qscjlncp2909ea1l.apps.googleusercontent.com JWT_SIGNING_KEY=local-only-development-signing-key OTP_TEST_MODE=true OTP_TEST_CODE=123456 DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./apps/customer-api"]
  run:rider:
    desc: Run rider-api on port 8081, against local Postgres only
    cmds: ["APP_ENV=local LOG_LEVEL=debug HTTP_PORT=8081 JWT_SIGNING_KEY=local-only-development-signing-key OTP_TEST_MODE=true OTP_TEST_CODE=123456 DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./apps/rider-api"]
  staging:status:
    desc: Show the target and migration status of the database in .env. Changes nothing
    dotenv: [".env"]
    cmds: ["go run ./cmd/migrate -remote status"]
  settings:
    desc: "Show or change order settings on local Postgres. Example: task settings -- set -reason why -by name timer_length_s=100"
    cmds: ["DATABASE_URL='postgres://ninzo:ninzo_local@localhost:5432/ninzo?sslmode=disable' go run ./cmd/settings -local {{.CLI_ARGS}}"]
  staging:settings:
    desc: Change order settings on the database in .env. Asks first, and needs the owner's okay
    dotenv: [".env"]
    prompt: Change settings on the target shown by `task staging:settings -- show`?
    cmds: ["go run ./cmd/settings -remote {{.CLI_ARGS}}"]
  staging:migrate:
    desc: Show the target, ask, then apply migrations to the database in .env. Needs the owner's okay
    cmds:
      - task: staging:status
      - task: staging:apply
  staging:apply:
    internal: true
    dotenv: [".env"]
    prompt: Apply migrations to the target shown above?
    cmds: ["go run ./cmd/migrate -remote up"]
  db:down:
    desc: Stop local Postgres and Redis, keeping their data
    cmds: ["docker compose -f deploy/compose.yml down"]
