# Local development only. Ports bind to localhost, and the password is not a secret.
# Keep the Postgres major version the same as the Supabase project (decision 0005).
name: ninzo-backend
services:
  postgres:
    image: postgis/postgis:17-3.5
    # This image has no ARM build, so ARM machines run it under emulation. It is slower, but it is the same image CI uses.
    platform: linux/amd64
    # The image's setup script installs PostGIS in public. Migrations install it in extensions, as on Supabase.
    tmpfs:
      - /docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ninzo
      POSTGRES_USER: ninzo
      POSTGRES_PASSWORD: ninzo_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, because the temporary server during first-time setup only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ninzo -d ninzo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      # 6380, so it never clashes with a Redis already installed on the machine.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
