# Local only: the geo session's own Postgres and Redis (#169), so its database tests never share
# a server with the tests on deploy/compose.yml. Same images and settings as that file, other ports.
# Ports bind to localhost, and the password is not a secret.
name: ninzo-geo
services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    # The image's setup script installs PostGIS in public. Migrations install it in extensions, as on Supabase.
    tmpfs:
      - /docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ninzo
      POSTGRES_USER: ninzo
      POSTGRES_PASSWORD: ninzo_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ninzo -d ninzo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # OSRM on the data built by tools/osrm/build.sh (#183). Started only with the osrm profile, once
  # data exists: task geo:osrm:up (Bengaluru) or OSRM_DATA=test-zones task geo:osrm:up.
  osrm:
    # Same digest as tools/osrm/build.sh.
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    profiles: ["osrm"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/${OSRM_DATA:-bengaluru}.osrm"]
    volumes:
      - ../tools/osrm/data/${OSRM_DATA:-bengaluru}:/data:ro
    ports:
      - "127.0.0.1:5001:5000"

volumes:
  postgres_data:
