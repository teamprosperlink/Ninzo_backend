# Secret scanning config for the CI `secrets` job (#238). It keeps every default rule and allows
# one narrow pattern: the Idempotency-Key header values in the generated Bruno request files.
# These are fixed request labels such as `bruno-takeBreak-0001`, not secrets; gitleaks'
# generic-api-key rule flags them because the header name contains "Key" (#235).
[extend]
useDefault = true

[allowlist]
description = "Idempotency-Key labels in generated Bruno files"
paths = []
regexes = ['''Idempotency-Key: bruno-[A-Za-z]+-[0-9]{4}''']
